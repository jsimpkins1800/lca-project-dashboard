<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LCA Daily Pulse</title>
<style>
:root{
  color-scheme: light;
  --bg:#f6f8fb; --card:#ffffff; --border:#e3e8ef; --text:#0f172a; --sub:#64748b;
  --blue:#2563eb; --blue-soft:#eff6ff;
  --green:#15803d; --green-soft:#ecfdf3;
  --amber:#b45309; --amber-soft:#fffbeb;
  --red:#b91c1c; --red-soft:#fef2f2;
  --purple:#7c3aed; --purple-soft:#f5f3ff;
  --conf-confirmed:#1a7f37; --conf-likely:#9a6700; --conf-review:#cf222e;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.45}
.wrap{max-width:1240px;margin:0 auto;padding:16px 18px 40px}

header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:19px;font-weight:700;letter-spacing:-.2px}
.range{font-size:12.5px;color:var(--sub);margin-top:3px}
.stamps{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:11.5px;color:var(--sub)}
.stamp{display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.dot.ok{background:var(--green)} .dot.wait{background:var(--amber)} .dot.err{background:var(--red)}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:9px;margin-bottom:14px}
.tile{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:13px 13px 12px;cursor:pointer;text-align:left;font:inherit;color:inherit;position:relative;transition:border-color .13s,box-shadow .13s}
.tile:hover{border-color:#c7d2e4;box-shadow:0 2px 8px rgba(15,23,42,.07)}
.tile.active{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.11)}
.tile .num{font-size:30px;font-weight:700;line-height:1.05;letter-spacing:-1px}
.tile .num.ratio{font-size:24px}
.tile .lbl{font-size:10.5px;font-weight:650;text-transform:uppercase;letter-spacing:.5px;color:var(--sub);margin-top:5px;line-height:1.3}
.tile .sub{font-size:11px;color:var(--sub);margin-top:4px;min-height:15px}
.tile .bar{display:flex;gap:2px;margin-top:9px;height:3px;border-radius:2px;overflow:hidden}
.tile .bar i{display:block;height:3px}
.delta{position:absolute;top:10px;right:10px;font-size:10px;font-weight:700;padding:2px 5px;border-radius:999px;background:var(--blue-soft);color:var(--blue);border:1px solid #cfe0fd}
.delta.none{display:none}

.panel{background:var(--card);border:1px solid var(--border);border-radius:11px;overflow:hidden}
.panel + .panel{margin-top:12px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 15px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.ph h2{font-size:13.5px;font-weight:680}
.ph .note{font-size:11.5px;color:var(--sub)}
.back{background:none;border:1px solid var(--border);border-radius:7px;padding:4px 10px;font:inherit;font-size:11.5px;color:var(--sub);cursor:pointer}
.back:hover{background:var(--bg);color:var(--text)}

.legend{display:flex;gap:14px;flex-wrap:wrap;padding:10px 15px;background:#fcfdfe;border-bottom:1px solid var(--border);font-size:11.5px;color:var(--sub)}
.legend b{color:var(--text);font-weight:680}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:9px;height:9px;border-radius:2px;flex:none}
.banner{padding:10px 15px;background:var(--amber-soft);border-bottom:1px solid #f2e2b8;font-size:12px;color:#7c4a06;line-height:1.5}

.ovw{display:grid;grid-template-columns:1.15fr 1fr;gap:12px}
@media(max-width:860px){.ovw{grid-template-columns:1fr}}
.owners{display:flex;flex-direction:column}
.owner{display:flex;align-items:center;gap:11px;padding:11px 15px;border-bottom:1px solid #f1f4f9;cursor:pointer}
.owner:last-child{border-bottom:none}
.owner:hover{background:#fafbfd}
.av{width:29px;height:29px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff}
.owner .nm{flex:1;min-width:0}
.owner .nm b{font-size:13px;font-weight:640;display:block}
.owner .nm span{font-size:11.5px;color:var(--sub)}
.cnt{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--bg);border:1px solid var(--border);color:var(--sub)}
.cnt.hi{background:var(--red-soft);border-color:#f6cfcf;color:var(--red)}

.progs{padding:5px 0}
.prog{display:flex;align-items:center;gap:10px;padding:9px 15px;font-size:12.5px}
.prog .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:10.5px;font-weight:650;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.active{background:var(--green-soft);color:var(--green)}
.pill.quiet{background:var(--bg);color:var(--sub)}
.pill.dormant{background:#f4f4f5;color:#71717a}
.pill.watch{background:var(--amber-soft);color:var(--amber)}

.rows{display:flex;flex-direction:column}
.row{border-bottom:1px solid #f1f4f9}
.row:last-child{border-bottom:none}
.rhead{display:flex;align-items:flex-start;gap:11px;padding:12px 15px;cursor:pointer;width:100%;background:none;border:none;font:inherit;color:inherit;text-align:left}
.rhead:hover{background:#fafbfd}
.rhead .tw{flex:1;min-width:0}
.rt{font-size:13px;font-weight:640;margin-bottom:3px}
.rm{font-size:11.5px;color:var(--sub)}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:10.5px;font-weight:640;padding:2px 7px;border-radius:5px;border:1px solid transparent}
.tag.cf-Confirmed{background:var(--green-soft);color:var(--conf-confirmed);border-color:#c9ead6}
.tag.cf-Likely{background:var(--amber-soft);color:var(--conf-likely);border-color:#f2e2b8}
.tag.cf-Review{background:var(--red-soft);color:var(--conf-review);border-color:#f6cfcf}
.tag.flag{background:var(--purple-soft);color:var(--purple);border-color:#e3dbfe}
.tag.flag-bad{background:var(--red-soft);color:var(--red);border-color:#f6cfcf}
.tag.flag-warn{background:var(--amber-soft);color:var(--amber);border-color:#f2e2b8}
.tag.flag-good{background:var(--green-soft);color:var(--green);border-color:#c9ead6}
.tag.st{background:var(--bg);color:var(--sub);border-color:var(--border)}
.tag.new{background:var(--blue-soft);color:var(--blue);border-color:#cfe0fd}
.rx{color:#c3ccdb;font-size:11px;padding-top:2px;flex:none;transition:transform .15s}
.row.open .rx{transform:rotate(90deg);color:var(--blue)}
.detail{display:none;padding:2px 15px 15px 15px;background:#fcfdfe;border-top:1px dashed var(--border)}
.row.open .detail{display:block}
.f{display:grid;grid-template-columns:170px 1fr;gap:4px 14px;padding:9px 0;border-bottom:1px solid #f1f4f9;font-size:12.5px}
@media(max-width:640px){.f{grid-template-columns:1fr}}
.f:last-of-type{border-bottom:none}
.f dt{font-weight:640;color:var(--sub)}
.ev{margin-top:11px;display:flex;gap:7px;flex-wrap:wrap}
.ev a{font-size:11.5px;text-decoration:none;color:var(--blue);background:var(--blue-soft);border:1px solid #cfe0fd;padding:3px 9px;border-radius:6px}
.ev a:hover{background:#e0ecfe}
.nt{margin-top:10px;font-size:12px;color:var(--sub);font-style:italic;padding-left:9px;border-left:2px solid var(--border)}

.rev{padding:4px 0}
.rev li{list-style:none;padding:10px 15px;border-bottom:1px solid #f1f4f9;font-size:12.5px;display:flex;gap:9px}
.rev li:last-child{border-bottom:none}
.rev li::before{content:"?";flex:none;width:16px;height:16px;border-radius:50%;background:var(--amber-soft);color:var(--amber);font-size:10px;font-weight:700;display:grid;place-items:center;margin-top:1px}
.rev b{font-weight:640}
.foot{margin-top:14px;font-size:11px;color:var(--sub);text-align:center;line-height:1.65}
.foot a{color:var(--blue)}
.empty{padding:26px 15px;text-align:center;color:var(--sub);font-size:12.5px}
</style>
</head>

/* baseline Gmail thread ids already cited, so the live delta only counts new mail */
const CITED = new Set();
const harvest = ev => (ev||[]).forEach(e => {
  const m = String(e[1]).match(/#all\/([0-9a-f]+)/); if (m) CITED.add(m[1]);
});
(DATA.sections||[]).forEach(s => (s.items||[]).forEach(i => harvest(i.evidence)));
(DATA.owners||[]).forEach(o => (o.items||[]).forEach(i => harvest(i.evidence)));

const LS = "lca-pulse-sel";
let sel = null;
try { sel = localStorage.getItem(LS) || null; } catch(e) { sel = null; }
if (sel && !(DATA.sections||[]).some(s => s.id === sel)) sel = null;
let deltas = {}, openRow = null;

const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const secById = id => DATA.sections.find(s => s.id === id);
const countOf = s => s.countOverride != null ? s.countOverride : (s.items||[]).length;
const cfClass = c => c === "Confirmed" ? "cf-Confirmed" : c === "Likely" ? "cf-Likely" : "cf-Review";
const flagClass = f => /never entered|blocked|not sent|overdue|no results/i.test(f) ? "flag-bad"
  : /no qc|not confirmed|not received|no date/i.test(f) ? "flag-warn"
  : /qc'd|trace-clean/i.test(f) ? "flag-good" : "flag";

/* breakdown colours, in the order the skill emits them */
const BD = ["var(--green)","var(--amber)","var(--red)"];

function renderTiles(){
  document.getElementById("tiles").innerHTML = DATA.sections.map(s => {
    let bars;
    if (s.breakdown){
      const tot = s.breakdown.reduce((a,b) => a + b[1], 0) || 1;
      bars = s.breakdown.map((b,i) => b[1] ? `<i style="background:${BD[i]||"var(--sub)"};flex:${b[1]/tot}"></i>` : "").join("");
    } else {
      const mix = (s.items||[]).reduce((a,i) => (a[i.confidence] = (a[i.confidence]||0)+1, a), {});
      bars = ["Confirmed","Likely","Needs Review"].filter(k => mix[k]).map(k => {
        const c = k === "Confirmed" ? "var(--conf-confirmed)" : k === "Likely" ? "var(--conf-likely)" : "var(--conf-review)";
        return `<i style="background:${c};flex:${mix[k]}"></i>`;
      }).join("");
    }
    const d = deltas[s.id] || 0;
    const shown = s.display != null ? s.display : countOf(s);
    return `<button class="tile ${sel===s.id?"active":""}" data-sec="${esc(s.id)}" aria-pressed="${sel===s.id}">
      <span class="delta ${d?"":"none"}">+${d}</span>
      <div class="num ${s.display!=null?"ratio":""}" style="color:var(--${esc(s.accent)})">${esc(shown)}</div>
      <div class="lbl">${esc(s.label)}</div>
      <div class="sub">${esc(s.sub||"")}</div>
      <div class="bar">${bars}</div>
    </button>`;
  }).join("");
  document.querySelectorAll(".tile").forEach(b => b.onclick = () => {
    sel = (sel === b.dataset.sec) ? null : b.dataset.sec;
    openRow = null;
    try { sel ? localStorage.setItem(LS, sel) : localStorage.removeItem(LS); } catch(e){}
    renderTiles(); renderView();
  });
}

function renderView(){
  document.getElementById("view").innerHTML = sel ? drill(secById(sel)) : overview();
  wire();
}

}

      </button>
      <div class="detail">
        ${(i.fields||[]).map(f => `<dl class="f"><dt>${esc(f[0])}</dt><dd>${esc(f[1])}</dd></dl>`).join("")}
        <div class="ev">${(i.evidence||[]).map(e => `<a href="${esc(e[1])}" target="_blank" rel="noopener">${esc(e[0])}</a>`).join("")}</div>
        ${i.note ? `<div class="nt">${esc(i.note)}</div>` : ""}
      </div>
    </div>`).join("");

  const legend = s.breakdown ? `<div class="legend">${s.breakdown
    .map((b,i) => [b,i]).filter(([b]) => b[0])
    .map(([b,i]) => `<span><i class="sw" style="background:${BD[i]||"var(--sub)"}"></i>${esc(b[0])} <b>${b[1]}</b></span>`)
    .join("")}</div>` : "";
  const banner = s.banner ? `<div class="banner">${esc(s.banner)}</div>` : "";
  const hdr = s.display != null
    ? esc(s.label) + " — " + esc(s.display)
    : esc(s.label) + " — " + countOf(s) + " item" + (countOf(s)===1?"":"s");

  return `<div class="panel">
    <div class="ph"><h2>${hdr}</h2>
      <div style="display:flex;align-items:center;gap:9px">
        ${d?`<span class="tag new">+${d} unvetted since baseline</span>`:""}
        <button class="back" id="back">← All KPIs</button>
      </div></div>
    ${banner}${legend}
    <div class="rows">${rows || '<div class="empty">No relevant activity found in the review window.</div>'}</div>
  </div>`;
}

function wire(){
  const b = document.getElementById("back");
  if (b) b.onclick = () => { sel=null; openRow=null; try{localStorage.removeItem(LS)}catch(e){} renderTiles(); renderView(); };
  document.querySelectorAll(".rhead").forEach(el => el.onclick = () => {
    const ix = +el.dataset.row; openRow = (openRow===ix) ? null : ix; renderView();
  });
  document.querySelectorAll(".owner").forEach(el => el.onclick = () => {
    const dd = document.getElementById("own-"+el.dataset.own);
    if (dd) dd.style.display = dd.style.display === "block" ? "none" : "block";
  });
}

function live(){
  /* static GitHub Pages build — no window.cowork bridge here, so no live Gmail delta */
  const dot=document.getElementById("liveDot"), out=document.getElementById("liveStamp");
  dot.className="dot ok";
  out.textContent="Static snapshot · Aug 20, 2026";
  out.style.cursor="default";
}

document.getElementById("range").textContent = DATA.rangeLabel + " · vetted snapshot with live inbox delta";
document.getElementById("baseStamp").textContent = DATA.baselineStamp;
if (DATA.qcNote) document.getElementById("qcFoot").textContent = DATA.qcNote;
if (DATA.reportUrl) document.getElementById("srcLink").innerHTML =
  'Source of record: <a href="' + esc(DATA.reportUrl) + '" target="_blank" rel="noopener">LCA Snapshot Report ' + esc(DATA.rangeLabel) + '</a>';
renderTiles(); renderView(); live();
</script>
</body>
