<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LCA Project Command Center</title>
<style>
  :root {
    --bg: #0f1117; --card: #1a1d27; --card2: #21253a; --border: #2d3250;
    --text: #e8eaf0; --muted: #8b92b0; --setup: #3b82f6; --field: #f59e0b;
    --reporting: #8b5cf6; --done: #10b981; --unknown: #4b5563;
    --hi: #ef4444; --md: #f59e0b; --lo: #6b7280;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh; }
  
  header { background: var(--card); border-bottom: 1px solid var(--border);
    padding: 12px 20px; display: flex; align-items: center; gap: 12px;
    position: sticky; top: 0; z-index: 100; }
  .logo { font-size: 18px; font-weight: 700; color: #fff; letter-spacing: -0.5px; }
  .logo span { color: #3b82f6; }
  .header-meta { font-size: 11px; color: var(--muted); margin-left: auto; text-align: right; }
  .pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11px;
    padding: 3px 8px; border-radius: 20px; font-weight: 600; }
  .pill-live { background: #10b98120; color: #10b981; border: 1px solid #10b98140; }
  .pill-static { background: #6b728020; color: #9ca3af; border: 1px solid #6b728040; cursor: default; }
  
  .main { display: flex; height: calc(100vh - 49px); }
  
  .sidebar { width: 260px; min-width: 260px; background: var(--card); border-right: 1px solid var(--border);
    overflow-y: auto; padding: 12px 0; }
  
  .sidebar-section { padding: 6px 12px 2px; font-size: 10px; font-weight: 700;
    color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  
  .proj-item { padding: 8px 12px; cursor: pointer; border-left: 3px solid transparent;
    transition: all 0.15s; }
  .proj-item:hover { background: var(--card2); }
  .proj-item.active { background: var(--card2); border-left-color: #3b82f6; }
  .proj-id { font-size: 10px; color: var(--muted); font-weight: 600; }
  .proj-name { font-size: 13px; font-weight: 600; color: var(--text); }
  .proj-bar { height: 4px; border-radius: 2px; background: var(--border); margin-top: 5px; overflow: hidden; display: flex; }
  .bar-seg { height: 100%; transition: width 0.3s; }
  .proj-chips { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
  .chip { font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 10px; }
  .chip-setup { background: #3b82f620; color: #3b82f6; }
  .chip-field { background: #f59e0b20; color: #f59e0b; }
  .chip-reporting { background: #8b5cf620; color: #8b5cf6; }
  .chip-done { background: #10b98120; color: #10b981; }
  .chip-unknown { background: #4b556320; color: #9ca3af; }
  .email-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: #3b82f6; margin-left: 4px; vertical-align: middle; }
  .prior-badge { font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 10px;
    background: #f59e0b20; color: #f59e0b; margin-left: 4px; }
  
  .content { flex: 1; overflow-y: auto; padding: 20px; }
  
  .stats-row { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 20px; }
  .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px; }
  .stat-label { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-val { font-size: 28px; font-weight: 700; margin-top: 4px; }
  .stat-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
  
  .section-title { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase;
    letter-spacing: 1px; margin-bottom: 10px; margin-top: 20px; }
  
  .actions-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
  .action-item { background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 14px; display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
  .action-item:hover { border-color: #3b82f6; }
  .action-pri { width: 4px; border-radius: 2px; min-height: 20px; flex-shrink: 0; margin-top: 2px; }
  .action-pri-hi { background: var(--hi); }
  .action-pri-md { background: var(--md); }
  .action-pri-lo { background: var(--lo); }
  .action-icon { font-size: 16px; flex-shrink: 0; }
  .action-text { font-size: 12px; color: var(--text); line-height: 1.5; flex: 1; }
  .action-meta { font-size: 10px; color: var(--muted); margin-top: 2px; }
  
  .project-detail { background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 20px; margin-bottom: 20px; }
  .detail-header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .detail-pid { font-size: 12px; font-weight: 700; color: var(--muted); }
  .detail-name { font-size: 20px; font-weight: 700; color: #fff; }
  .detail-pct { font-size: 13px; font-weight: 700; color: var(--done); margin-left: auto; }
  
  .pipeline { display: flex; height: 8px; border-radius: 4px; overflow: hidden;
    background: var(--border); margin-bottom: 12px; gap: 1px; }
  .pipeline-seg { height: 100%; transition: width 0.4s; }
  .seg-setup { background: var(--setup); }
  .seg-field { background: var(--field); }
  .seg-reporting { background: var(--reporting); }
  .seg-done { background: var(--done); }
  .seg-unknown { background: var(--unknown); }
  
  .pipeline-legend { display: flex; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; }
  
  .email-section { margin-top: 16px; }
  .email-thread { background: var(--card2); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; margin-bottom: 6px; }
  .email-subject { font-size: 12px; font-weight: 600; color: var(--text); }
  .email-snippet { font-size: 11px; color: var(--muted); margin-top: 3px; line-height: 1.4; }
  .email-meta { font-size: 10px; color: #4b5563; margin-top: 4px; }
  
  .unit-table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 12px; }
  .unit-table th { text-align: left; padding: 7px 10px; font-size: 10px; font-weight: 700;
    color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px;
    border-bottom: 1px solid var(--border); }
  .unit-table td { padding: 6px 10px; border-bottom: 1px solid #1f2437; }
  .unit-table tr:hover td { background: var(--card2); }
  .seg-badge { font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 10px; }
  
  .no-emails { font-size: 12px; color: var(--muted); padding: 10px 0; }
  
  @media (max-width: 768px) {
    .stats-row { grid-template-columns: 1fr 1fr; }
    .main { flex-direction: column; height: auto; }
    .sidebar { width: 100%; min-width: unset; border-right: none; border-bottom: 1px solid var(--border); max-height: 250px; }
  }
</style>
</head>

const SEG_COLORS = {Setup:"setup",Field:"field",Reporting:"reporting",Done:"done",Unknown:"unknown"};
const SEG_HEX = {Setup:"#3b82f6",Field:"#f59e0b",Reporting:"#8b5cf6",Done:"#10b981",Unknown:"#374151"};

let gmailData = {...BAKED_GMAIL};
let selectedPid = null;

// Live Gmail fetch
async function fetchGmail() {
  // Static snapshot — no live Gmail fetch
  document.getElementById("gmail-status").textContent = "Static snapshot · May 5, 2026";
  document.getElementById("gmail-status").className = "pill pill-static";
  if (false) {
    const res = {};
    const threads = res?.threads || [];
    const fresh = {};
    const pidPatterns = [
      [/\b26-001\b|new london/i,"26-001"],
      [/\b26-002\b|newport/i,"26-002"],
      [/\b26-003\b|\bearle\b/i,"26-003"],
      [/\b26-004\b|lakehurst/i,"26-004"],
      [/\b26-005\b|charleston/i,"26-005"],
      [/\b26-006\b|fort jackson/i,"26-006"],
      [/\b26-007\b|fort detrick/i,"26-007"],
      [/\b26-009\b|fort eustis/i,"26-009"],
      [/\b26-010\b|\busma\b.*facilit/i,"26-010"],
      [/\b26-011\b|\busma\b.*renov/i,"26-011"],
      [/\b26-024\b|minot/i,"26-024"],
      [/\b26-025\b|portsmouth/i,"26-025"],
      [/\b24-101\b|fort carson/i,"24-101"],
    ];
    for (const t of threads) {
      const msg = t.messages?.[t.messages.length-1];
      if (!msg) continue;
      const hay = (msg.subject||"") + " " + (msg.snippet||"");
      for (const [pat,pid] of pidPatterns) {
        if (pat.test(hay)) {
          if (!fresh[pid]) fresh[pid] = [];
          fresh[pid].push({
            subject: msg.subject||"(no subject)",
            snippet: msg.snippet||"",
            sender: msg.sender||"",
            date: new Date(msg.date).toLocaleDateString("en-US",{month:"short",day:"numeric"}),
          });
          break;
        }
      }
    }
    // Merge fresh over baked
    for (const [pid,msgs] of Object.entries(fresh)) {
      gmailData[pid] = msgs;
    }
    document.getElementById("gmail-status").textContent = "⬤ Gmail live";
    document.getElementById("gmail-status").className = "pill pill-live";
    if (selectedPid) renderDetail(selectedPid);
  } catch(e) {
    document.getElementById("gmail-status").textContent = "Gmail (baked)";
    document.getElementById("gmail-status").className = "pill pill-static";
  }
}

function segChips(segs) {
  let h = "";
  for (const [seg,cls] of [["Setup","setup"],["Field","field"],["Reporting","reporting"],["Done","done"],["Unknown","unknown"]]) {
    const n = segs[seg]||0;
    if (n>0) h += `<span class="chip chip-${cls}">${seg[0]}:${n}</span>`;
  }
  return h;
}

function pipelineBar(segs, total) {
  if (total===0) return '<div class="pipeline"><div class="pipeline-seg seg-unknown" style="width:100%"></div></div>';
  let h = '<div class="pipeline">';
  for (const [seg,cls] of [["Setup","setup"],["Field","field"],["Reporting","reporting"],["Done","done"],["Unknown","unknown"]]) {
    const n = segs[seg]||0;
    if (n>0) h += `<div class="pipeline-seg seg-${cls}" style="width:${(n/total*100).toFixed(1)}%"></div>`;
  }
  return h+"</div>";
}

function renderSidebar() {
  const el = document.getElementById("sidebar");
  const pids = Object.keys(PROJECTS).sort();
  const hasSig = pid => (gmailData[pid]||[]).length > 0;
  
  let h = '<div class="sidebar-section">Active Projects</div>';
  for (const pid of pids) {
    const p = PROJECTS[pid];
    const active = selectedPid===pid;
    const emails = hasSig(pid);
    h += `<div class="proj-item ${active?"active":""}" onclick="selectProject('${pid}')" data-pid="${pid}">
      <div class="proj-id">${pid} ${p.priorYear?'<span class="prior-badge">PY</span>':''}</div>
      <div class="proj-name">${p.name}${emails?'<span class="email-dot"></span>':''}</div>
      ${pipelineBar(p.segs, p.total)}
      <div class="proj-chips">${segChips(p.segs)}</div>
    </div>`;
  }
  el.innerHTML = h;
}

function renderOverview() {
  const content = document.getElementById("content");
  const pids = Object.keys(PROJECTS);
  const totalUnits = pids.reduce((s,p)=>s+(PROJECTS[p].total||0),0);
  const totalDone = pids.reduce((s,p)=>s+(PROJECTS[p].done||0),0);
  const emailProjects = pids.filter(p=>(gmailData[p]||[]).length>0).length;

  const hiCount = ACTION_ITEMS.filter(a=>a.pri==="hi").length;

  const totalSegs = {Setup:0,Field:0,Reporting:0,Done:0,Unknown:0};
  for (const pid of pids) for (const [s,n] of Object.entries(PROJECTS[pid].segs)) totalSegs[s]=(totalSegs[s]||0)+n;
  
  let h = `
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-label">Active Projects</div>
      <div class="stat-val" style="color:#3b82f6">${pids.length}</div>

    </div>
    <div class="stat-card">
      <div class="stat-label">Total Units</div>
      <div class="stat-val" style="color:#e8eaf0">${totalUnits}</div>
      <div class="stat-sub">${pct}% complete</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">In Reporting</div>
      <div class="stat-val" style="color:#8b5cf6">${totalSegs.Reporting||0}</div>

    </div>
    <div class="stat-card">

      <div class="stat-val" style="color:#ef4444">${hiCount}</div>
      <div class="stat-sub">High-priority items</div>
    </div>
  </div>
  
  <div class="section-title">Action Items</div>
  <div class="actions-list">`;
  
  for (const a of ACTION_ITEMS) {
    h += `<div class="action-item" onclick="selectProject('${a.pid}')">
      <div class="action-pri action-pri-${a.pri}"></div>
      <div class="action-icon">${a.icon}</div>
      <div>
        <div class="action-text">${a.text}</div>
        <div class="action-meta">${a.pid} · ${a.src}</div>
      </div>
    </div>`;
  }
  h += `</div>
  
  <div class="section-title">Pipeline Overview (all projects)</div>
  <div class="project-detail">
    ${pipelineBar(totalSegs, totalUnits)}
    <div class="pipeline-legend">
      <div class="legend-item"><div class="legend-dot" style="background:#3b82f6"></div>Setup (${totalSegs.Setup||0})</div>
      <div class="legend-item"><div class="legend-dot" style="background:#f59e0b"></div>Field (${totalSegs.Field||0})</div>
      <div class="legend-item"><div class="legend-dot" style="background:#8b5cf6"></div>Reporting (${totalSegs.Reporting||0})</div>
      <div class="legend-item"><div class="legend-dot" style="background:#10b981"></div>Done (${totalSegs.Done||0})</div>
      <div class="legend-item"><div class="legend-dot" style="background:#374151"></div>Pending (${totalSegs.Unknown||0})</div>
    </div>
  </div>`;
  
  content.innerHTML = h;
}

function renderDetail(pid) {

  let h = `<div class="project-detail">
    <div class="detail-header">
      <div>
        <div class="detail-pid">${pid}${p.priorYear?' <span class="prior-badge">Prior Year</span>':''}</div>

    <div class="pipeline-legend">
      <div class="legend-item"><div class="legend-dot" style="background:#3b82f6"></div>Setup (${p.segs.Setup||0})</div>
      <div class="legend-item"><div class="legend-dot" style="background:#f59e0b"></div>Field (${p.segs.Field||0})</div>
      <div class="legend-item"><div class="legend-dot" style="background:#8b5cf6"></div>Reporting (${p.segs.Reporting||0})</div>
      <div class="legend-item"><div class="legend-dot" style="background:#10b981"></div>Done (${p.segs.Done||0})</div>
      ${(p.segs.Unknown||0)>0?`<div class="legend-item"><div class="legend-dot" style="background:#374151"></div>Pending (${p.segs.Unknown})</div>`:''}
    </div>
    
    <div class="stats-row" style="margin-top:12px">

      <div class="stat-card"><div class="stat-label">In Reporting</div><div class="stat-val" style="font-size:20px;color:#8b5cf6">${p.segs.Reporting||0}</div></div>
      <div class="stat-card"><div class="stat-label">Done</div><div class="stat-val" style="font-size:20px;color:#10b981">${p.segs.Done||0}</div></div>
    </div>
  </div>
  
  <div class="section-title">Recent Email (${emails.length} thread${emails.length!==1?"s":""} in last 14 days)</div>`;
  
  if (emails.length === 0) {
    h += '<div class="no-emails">No recent email threads matched for this project.</div>';
  } else {
    h += '<div class="email-section">';
    for (const e of emails) {
      h += `<div class="email-thread">
        <div class="email-subject">${e.subject}</div>
        <div class="email-snippet">${e.snippet}</div>
        <div class="email-meta">${e.sender} · ${e.date}</div>
      </div>`;
    }
    h += '</div>';
  }
  
  if (p.units.length > 0) {
    const hasACM = p.hasACM;
    h += `<div class="section-title" style="margin-top:16px">Units (${p.units.length})</div>
    <div style="overflow-x:auto">
    <table class="unit-table">
      <thead><tr>
        <th>#</th>
        <th>Address</th>
        <th>Status</th>
        <th>Stage</th>
        ${hasACM?`<th>${p.acmLabel}</th>`:''}
      </tr></thead>
      <tbody>`;
    
    p.units.forEach((u,i) => {
      const cls = SEG_COLORS[u.g]||"unknown";
      const bg = SEG_HEX[u.g]||"#374151";
      h += `<tr>
        <td style="color:#4b5563">${i+1}</td>
        <td>${u.a}</td>
        <td style="color:${bg}">${u.s}</td>
        <td><span class="seg-badge chip-${cls}">${u.g}</span></td>
        ${hasACM?`<td style="color:${u.m==='Yes'||u.m==='✓'?'#ef4444':'#10b981'}">${u.m||'—'}</td>`:''}
      </tr>`;
    });
    
    h += '</tbody></table></div>';
  }
  
  content.innerHTML = h;
}

function selectProject(pid) {
  selectedPid = pid;
  document.querySelectorAll(".proj-item").forEach(el => {
    el.classList.toggle("active", el.dataset.pid===pid);
  });
  renderDetail(pid);
}
