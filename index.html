<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LCA Project Command Center</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3350;
    --text: #e2e8f0;
    --text2: #94a3b8;
    --text3: #64748b;
    --blue: #3b82f6;
    --amber: #f59e0b;
    --purple: #a855f7;
    --green: #22c55e;
    --red: #ef4444;
    --pill-blue: rgba(59,130,246,0.15);
    --pill-amber: rgba(245,158,11,0.15);
    --pill-purple: rgba(168,85,247,0.15);
    --pill-green: rgba(34,197,94,0.15);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  
  /* Header */
  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .header-logo { width: 32px; height: 32px; background: var(--blue); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; color: #fff; }
  .header-title { font-size: 16px; font-weight: 700; }
  .header-sub { font-size: 11px; color: var(--text3); }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .badge-gmail { background: var(--pill-blue); color: var(--blue); border: 1px solid rgba(59,130,246,0.3); border-radius: 20px; padding: 3px 10px; font-size: 11px; cursor: pointer; }
  .badge-live { background: var(--pill-green); color: var(--green); border: 1px solid rgba(34,197,94,0.3); border-radius: 20px; padding: 3px 10px; font-size: 11px; }
  .badge-snap { background: var(--pill-amber); color: var(--amber); border: 1px solid rgba(245,158,11,0.3); border-radius: 20px; padding: 3px 10px; font-size: 11px; cursor: default; }

  /* Layout */
  .layout { display: flex; height: calc(100vh - 57px); overflow: hidden; }
  
  /* Sidebar */
  .sidebar { width: 300px; min-width: 300px; overflow-y: auto; border-right: 1px solid var(--border); background: var(--surface); }
  
  /* Main area */
  .main { flex: 1; overflow-y: auto; padding: 20px; }
  
  /* Summary row */
  .summary-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
  .stat-card .label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
  .stat-card .value { font-size: 28px; font-weight: 700; }
  .stat-card .sub { font-size: 11px; color: var(--text2); margin-top: 2px; }
  
  /* Action items */
  .section-title { font-size: 13px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 12px; }
  .action-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }
  .action-item { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; display: flex; align-items: flex-start; gap: 10px; cursor: pointer; transition: border-color .15s; }
  .action-item:hover { border-color: var(--blue); }
  .action-item.hi { border-left: 3px solid var(--red); }
  .action-item.md { border-left: 3px solid var(--amber); }
  .action-item.lo { border-left: 3px solid var(--text3); }
  .action-icon { font-size: 16px; margin-top: 1px; }
  .action-text { font-size: 13px; line-height: 1.5; flex: 1; }
  .action-src { font-size: 11px; color: var(--text3); margin-top: 3px; }
  .action-pid { font-size: 10px; color: var(--blue); background: var(--pill-blue); border-radius: 4px; padding: 1px 6px; margin-left: 6px; }

  /* Project list */
  .proj-item { padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background .1s; }
  .proj-item:hover { background: var(--surface2); }
  .proj-item.active { background: var(--surface2); border-left: 3px solid var(--blue); }
  .proj-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .proj-id { font-size: 10px; color: var(--blue); font-weight: 600; }
  .proj-name { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
  .proj-meta { font-size: 11px; color: var(--text3); display: flex; gap: 8px; }
  .email-badge { background: var(--pill-blue); color: var(--blue); border-radius: 10px; padding: 1px 6px; font-size: 10px; }
  .prior-badge { background: rgba(168,85,247,.15); color: var(--purple); border-radius: 10px; padding: 1px 6px; font-size: 10px; }
  
  /* Pipeline bar */
  .pipeline { display: flex; height: 6px; border-radius: 3px; overflow: hidden; margin: 6px 0; gap: 1px; }
  .pipe-seg { height: 100%; border-radius: 2px; min-width: 2px; }
  .pipe-setup { background: var(--blue); }
  .pipe-field { background: var(--amber); }
  .pipe-reporting { background: var(--purple); }
  .pipe-done { background: var(--green); }
  
  .pct-label { font-size: 10px; color: var(--text3); }
  
  /* Chip row */
  .chip-row { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
  .chip { font-size: 10px; padding: 1px 7px; border-radius: 10px; }
  .chip-setup { background: var(--pill-blue); color: var(--blue); }
  .chip-field { background: var(--pill-amber); color: var(--amber); }
  .chip-reporting { background: var(--pill-purple); color: var(--purple); }
  .chip-done { background: var(--pill-green); color: var(--green); }
  
  /* Detail panel */
  .detail { flex: 1; }
  .detail-header { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
  .detail-pid { font-size: 12px; color: var(--blue); background: var(--pill-blue); padding: 3px 10px; border-radius: 20px; }
  .detail-name { font-size: 22px; font-weight: 700; }
  
  .detail-stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 20px; }
  .d-stat { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px; text-align: center; }
  .d-stat .val { font-size: 24px; font-weight: 700; }
  .d-stat .lbl { font-size: 10px; color: var(--text3); margin-top: 2px; }
  
  /* Unit table */
  .unit-table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 20px; max-height: 340px; overflow-y: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { background: var(--surface2); font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: .06em; padding: 8px 12px; text-align: left; position: sticky; top: 0; z-index: 1; }
  td { padding: 7px 12px; font-size: 12px; border-top: 1px solid var(--border); }
  tr:hover td { background: var(--surface2); }
  
  .seg-badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 600; }
  .seg-Setup { background: var(--pill-blue); color: var(--blue); }
  .seg-Field { background: var(--pill-amber); color: var(--amber); }
  .seg-Reporting { background: var(--pill-purple); color: var(--purple); }
  .seg-Done { background: var(--pill-green); color: var(--green); }
  
  /* Gmail threads */
  .gmail-section { margin-bottom: 20px; }
  .thread-list { display: flex; flex-direction: column; gap: 8px; }
  .thread-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; }
  .thread-subject { font-size: 13px; font-weight: 600; margin-bottom: 3px; }
  .thread-meta { font-size: 11px; color: var(--text3); margin-bottom: 4px; }
  .thread-snippet { font-size: 12px; color: var(--text2); line-height: 1.5; }
  
  /* Loading */
  .loading { color: var(--text3); font-size: 13px; text-align: center; padding: 20px; }
  
  /* No-detail state */
  .no-detail { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text3); gap: 8px; }
  .no-detail .icon { font-size: 48px; opacity: .3; }
  
  @media (max-width: 900px) {
    .layout { flex-direction: column; }
    .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border); max-height: 300px; }
    .summary-row { grid-template-columns: repeat(2, 1fr); }
    .detail-stats { grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>

function segCounts(units) {

  return c;
}

              <td><span class="seg-badge seg-${u.seg}">${u.seg}</span></td>
              ${hasACM?`<td style="color:var(--green)">${u.m||'—'}</td>`:''}
            </tr>`).join('')}
          </tbody>
        </table>
      </div>`;
    
    // Gmail threads
    if (emails.length > 0) {
      detailHTML += `<div class="gmail-section">
        <div class="section-title">Recent Email Activity (${emails.length} threads)</div>
        <div class="thread-list">
          ${emails.map(t=>`<div class="thread-card">
            <div class="thread-subject">${t.subject}</div>
            <div class="thread-meta">From: ${t.sender} · ${t.date}</div>
            <div class="thread-snippet">${t.snippet}</div>
          </div>`).join('')}
        </div>
      </div>`;
    } else {
      detailHTML += `<div class="section-title">Email Activity</div><div class="loading">No recent threads for this project</div>`;
    }
  }
  
  main.innerHTML = summaryHTML + actionsHTML + detailHTML;
}

// ---- Select project ----
function selectProject(pid) {
  activeProject = PROJECTS.find(p=>p.pid===pid) || null;
  renderSidebar();
  renderMain();
  // scroll detail into view
  const main = document.getElementById('main');
  main.scrollTop = main.scrollHeight;
}

// ---- Gmail refresh (live artifact version) ----
async function refreshGmail() {
  const badge = document.getElementById('gmailBadge');
  badge.textContent = '✉ Loading…';
  try {
    if (false) {
      const result = await window.cowork.callMcpTool(
        'mcp__67d183fc-6aa9-4a14-9fa5-be0bb1098825__search_threads',
        { query: 'newer_than:14d (new london OR newport OR earle OR lakehurst OR charleston OR "fort jackson" OR "fort detrick" OR "fort eustis" OR usma OR minot OR "fort carson" OR portsmouth)', pageSize: 50 }
      );
      if (result && result.threads) {
        // Parse threads into signals
        const pidRe = /\b(2[4-6]-\d{3})\b/gi;
        const nameMap = {
          'fort carson':'24-101','new london':'26-001','newport':'26-002',
          'earle':'26-003','lakehurst':'26-004','charleston':'26-005',
          'fort jackson':'26-006','fort detrick':'26-007','fort eustis':'26-009',
          'usma':'26-010','minot':'26-024','portsmouth':'26-025'
        };
        const fresh = {};
        for (const t of result.threads) {
          const msgs = t.messages || [];
          if (!msgs.length) continue;
          const last = msgs[msgs.length-1];
          const combined = ((last.subject||'')+(last.snippet||'')).toLowerCase();
          const matched = new Set();
          let m;
          while ((m=pidRe.exec(combined))!==null) matched.add(m[1].toLowerCase());
          for (const [nm,pid] of Object.entries(nameMap)) {
            if (combined.includes(nm)) matched.add(pid);
          }
          for (const pid of matched) {
            if (!fresh[pid]) fresh[pid]=[];
            fresh[pid].push({subject:last.subject||'',snippet:(last.snippet||'').slice(0,120),sender:last.sender||'',date:(last.date||'').slice(0,10)});
          }
        }
        gmailSignals = fresh;
        const total = Object.values(fresh).reduce((a,v)=>a+v.length,0);
        badge.textContent = `✉ ${total} live threads`;
      }
    } else {
      badge.textContent = `✉ ${Object.values(gmailSignals).reduce((a,v)=>a+v.length,0)} cached threads`;
    }
  } catch(e) {
    badge.textContent = '✉ Error refreshing';
    console.error(e);
  }
  renderSidebar();
  renderMain();
}

// ---- Init ----
(function init() {
  renderSidebar();
  renderMain();
  // Update gmail badge with static count
  const total = Object.values(gmailSignals).reduce((a,v)=>a+v.length,0);
  document.getElementById('gmailBadge').textContent = `✉ ${total} threads (click to refresh)`;
  
})();
</script>
