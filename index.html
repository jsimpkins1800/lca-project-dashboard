<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LCA Project Command Center</title>
<style>
  :root {
    --bg: #0f1117; --surface: #1a1d27; --surface2: #22263a;
    --border: #2e3350; --text: #e2e8f0; --muted: #8892b0;
    --blue: #3b82f6; --amber: #f59e0b; --purple: #8b5cf6;
    --green: #22c55e; --red: #ef4444; --teal: #14b8a6;
    --hi: #ef4444; --md: #f59e0b; --lo: #6b7280;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; }
  
  /* Header */
  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .logo { font-size: 18px; font-weight: 700; color: var(--text); letter-spacing: -0.5px; }
  .logo span { color: var(--blue); }
  .snapshot-badge { background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 4px 10px; font-size: 11px; color: var(--muted); }
  .live-badge { background: rgba(34,197,94,0.15); border: 1px solid rgba(34,197,94,0.4); border-radius: 20px; padding: 4px 10px; font-size: 11px; color: var(--green); cursor: pointer; }
  
  /* Summary bar */
  .summary-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--border); border-bottom: 1px solid var(--border); }
  .summary-stat { background: var(--surface); padding: 12px 20px; }
  .summary-stat .val { font-size: 22px; font-weight: 700; }
  .summary-stat .lbl { font-size: 11px; color: var(--muted); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px; }
  
  /* Main layout */
  .main { display: grid; grid-template-columns: 1fr 320px; min-height: calc(100vh - 110px); }
  .projects-panel { padding: 16px; overflow-y: auto; }
  .sidebar { background: var(--surface); border-left: 1px solid var(--border); padding: 16px; overflow-y: auto; }
  
  /* Project cards */
  .section-title { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
  .project-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 10px; cursor: pointer; transition: border-color 0.15s; }
  .project-card:hover { border-color: var(--blue); }
  .project-card.active { border-color: var(--blue); background: #1a2035; }
  .card-header { padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; }
  .card-meta { display: flex; align-items: center; gap: 10px; }
  .pid-badge { background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; padding: 2px 7px; font-size: 11px; font-family: monospace; color: var(--muted); }
  .pid-badge.prior { background: rgba(139,92,246,0.15); border-color: rgba(139,92,246,0.4); color: var(--purple); }
  .proj-name { font-weight: 600; font-size: 14px; }
  .card-right { display: flex; align-items: center; gap: 8px; }
  .email-badge { background: rgba(59,130,246,0.15); border: 1px solid rgba(59,130,246,0.4); border-radius: 12px; padding: 2px 8px; font-size: 11px; color: var(--blue); }
  .pct-label { font-size: 13px; font-weight: 600; color: var(--muted); }
  
  /* Pipeline bar */
  .pipeline-wrap { padding: 0 14px 12px; }
  .pipeline-bar { height: 6px; border-radius: 3px; background: var(--surface2); display: flex; overflow: hidden; }
  .pipe-seg { height: 100%; transition: width 0.3s; }
  .pipe-seg.Setup    { background: var(--blue); }
  .pipe-seg.Field    { background: var(--amber); }
  .pipe-seg.Reporting { background: var(--purple); }
  .pipe-seg.Done     { background: var(--green); }
  .pipeline-legend { display: flex; gap: 12px; margin-top: 6px; flex-wrap: wrap; }
  .pipe-leg { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); }
  .pipe-dot { width: 8px; height: 8px; border-radius: 2px; }
  
  /* Detail panel */
  .detail-panel { display: none; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 10px; padding: 16px; }
  .detail-panel.visible { display: block; }
  .stat-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; text-align: center; }
  .stat-card .sv { font-size: 20px; font-weight: 700; }
  .stat-card .sl { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }
  .stat-card.setup .sv { color: var(--blue); }
  .stat-card.field .sv { color: var(--amber); }
  .stat-card.reporting .sv { color: var(--purple); }
  .stat-card.done .sv { color: var(--green); }
  
  /* Unit table */
  .unit-table-wrap { max-height: 280px; overflow-y: auto; border: 1px solid var(--border); border-radius: 6px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { background: var(--surface); position: sticky; top: 0; padding: 7px 10px; text-align: left; color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); }
  td { padding: 6px 10px; border-bottom: 1px solid var(--border); color: var(--text); }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(255,255,255,0.03); }
  
  /* Status chips */
  .chip { display: inline-flex; align-items: center; border-radius: 4px; padding: 1px 7px; font-size: 10px; font-weight: 500; white-space: nowrap; }
  .chip.Setup    { background: rgba(59,130,246,0.15); color: #93c5fd; border: 1px solid rgba(59,130,246,0.3); }
  .chip.Field    { background: rgba(245,158,11,0.15); color: #fcd34d; border: 1px solid rgba(245,158,11,0.3); }
  .chip.Reporting { background: rgba(139,92,246,0.15); color: #c4b5fd; border: 1px solid rgba(139,92,246,0.3); }
  .chip.Done     { background: rgba(34,197,94,0.15);  color: #86efac; border: 1px solid rgba(34,197,94,0.3); }
  
  /* Email threads */
  .email-section { margin-top: 14px; }
  .email-thread { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; margin-bottom: 6px; }
  .email-subject { font-weight: 600; font-size: 12px; color: var(--text); margin-bottom: 4px; }
  .email-meta { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .email-snippet { font-size: 11px; color: #94a3b8; line-height: 1.4; }
  
  /* Sidebar actions */
  .action-item { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; margin-bottom: 8px; display: flex; gap: 10px; align-items: flex-start; }
  .action-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
  .action-body { flex: 1; min-width: 0; }
  .action-text { font-size: 12px; line-height: 1.4; margin-bottom: 4px; }
  .action-src { font-size: 10px; color: var(--muted); }
  .action-pri-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }
  .pri-hi { background: var(--hi); }
  .pri-md { background: var(--md); }
  .pri-lo { background: var(--lo); }
  
  .tab-bar { display: flex; gap: 2px; margin-bottom: 12px; background: var(--surface2); border-radius: 6px; padding: 3px; }
  .tab { flex: 1; text-align: center; padding: 5px; border-radius: 4px; font-size: 11px; font-weight: 500; cursor: pointer; color: var(--muted); transition: all 0.15s; }
  .tab.active { background: var(--surface); color: var(--text); }

  .gmail-loading { text-align: center; padding: 20px; color: var(--muted); font-size: 12px; }
  
  @media (max-width: 768px) {
    .main { grid-template-columns: 1fr; }
    .sidebar { border-left: none; border-top: 1px solid var(--border); }
    .summary-bar { grid-template-columns: repeat(2, 1fr); }
    .stat-cards { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>

    return a.localeCompare(b);
  });
  
  let totalActive=0, totalUnits=0, totalField=0, totalReporting=0;
  
  let html = '';
  for (const pid of pids) {
    const p = PROJECTS[pid];
    if (!p.active) continue;
    totalActive++;
    totalUnits += p.total||0;
    totalField += (p.seg_counts&&p.seg_counts.Field)||0;
    totalReporting += (p.seg_counts&&p.seg_counts.Reporting)||0;
    
    const sc = p.seg_counts||{};
    const emailCount = gmailData[pid] ? gmailData[pid].length : (p.emailCount||0);
    const isPrior = pid.startsWith('24');
    
    html += `
    <div class="project-card ${selectedPid===pid?'active':''}" id="card-${pid}" onclick="selectProject('${pid}')">
      <div class="card-header">
        <div class="card-meta">
          <span class="pid-badge ${isPrior?'prior':''}">${pid}</span>
          <span class="proj-name">${p.name}</span>
          ${isPrior ? '<span style="font-size:10px;color:#8b5cf6;background:rgba(139,92,246,0.1);padding:1px 6px;border-radius:3px;border:1px solid rgba(139,92,246,0.3)">Prior Year</span>' : ''}
        </div>
        <div class="card-right">
          ${emailCount > 0 ? `<span class="email-badge">📧 ${emailCount}</span>` : ''}
          <span class="pct-label">${p.pct||0}%</span>
        </div>
      </div>
      <div class="pipeline-wrap">
        ${pipelineBar(sc, p.total)}
        <div class="pipeline-legend">
          ${['Setup','Field','Reporting','Done'].map(s => sc[s]>0 ? `<span class="pipe-leg"><span class="pipe-dot" style="background:${SEG_COLORS[s]}"></span>${sc[s]} ${s}</span>` : '').join('')}
        </div>
      </div>
    </div>
    <div class="detail-panel ${selectedPid===pid?'visible':''}" id="detail-${pid}">
      ${renderDetail(pid, p)}
    </div>`;
  }
  
  document.getElementById('projectList').innerHTML = html;
  document.getElementById('sumActive').textContent = totalActive;
  document.getElementById('sumUnits').textContent = totalUnits;
  document.getElementById('sumField').textContent = totalField;
  document.getElementById('sumReporting').textContent = totalReporting;
}

function renderDetail(pid, p) {
  const sc = p.seg_counts||{};
  const emailsForPid = gmailData[pid] || p.emails || [];
  
  let acmHeader = p.acmLabel ? `<th>${p.acmLabel}</th>` : '';
  let rows = (p.units||[]).map(u => {
    const acmCell = p.acmLabel ? `<td>${u.m||''}</td>` : '';
    return `<tr><td style="max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${u.a}">${u.a}</td><td>${segChip(u.seg)}</td>${acmCell}</tr>`;
  }).join('');
  
  let emailHtml = '';
  if (emailsForPid.length > 0) {
    emailHtml = `<div class="email-section"><div style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px">Recent Emails</div>`;
    for (const e of emailsForPid.slice(0,4)) {
      emailHtml += `<div class="email-thread">
        <div class="email-subject">${e.subject.substring(0,80)}</div>
        <div class="email-meta">${e.sender} · ${fmt(e.date)}</div>
        <div class="email-snippet">${e.snippet.substring(0,120)}</div>
      </div>`;
    }
    emailHtml += '</div>';
  }
  
  return `
    <div class="stat-cards">
      <div class="stat-card setup"><div class="sv">${sc.Setup||0}</div><div class="sl">Setup</div></div>
      <div class="stat-card field"><div class="sv">${sc.Field||0}</div><div class="sl">Field</div></div>
      <div class="stat-card reporting"><div class="sv">${sc.Reporting||0}</div><div class="sl">Reporting</div></div>
      <div class="stat-card done"><div class="sv">${sc.Done||0}</div><div class="sl">Done</div></div>
    </div>
    <div class="unit-table-wrap">
      <table>
        <thead><tr><th>Address / Unit</th><th>Status</th>${acmHeader}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    ${emailHtml}
  `;
}

function selectProject(pid) {
  if (selectedPid === pid) {
    selectedPid = null;
  } else {
    selectedPid = pid;
  }
  renderProjects();
}

function renderActions() {
  const byPri = {'hi':[],'md':[],'lo':[]};
  for (const a of ACTION_ITEMS) byPri[a.pri].push(a);
  
  let html = '';
  const labels = {'hi':'🔴 High Priority','md':'🟡 Medium Priority','lo':'⚪ Low Priority'};
  for (const pri of ['hi','md','lo']) {
    if (!byPri[pri].length) continue;
    html += `<div style="font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin:10px 0 6px">${labels[pri]}</div>`;
    for (const a of byPri[pri]) {
      html += `<div class="action-item">
        <div class="action-pri-dot pri-${a.pri}"></div>
        <div class="action-icon">${a.icon}</div>
        <div class="action-body">
          <div class="action-text">${a.text}</div>
          <div class="action-src">${a.src} · ${a.pid}</div>
        </div>
      </div>`;
    }
  }
  document.getElementById('actionsPane').innerHTML = html;
}

function renderEmailsSidebar() {
  // Show all email signals grouped by project
  let html = '<div style="font-size:11px;color:var(--muted);margin-bottom:12px">All email threads from last 14 days matching active projects</div>';
  
  const allPids = Object.keys(PROJECTS).filter(pid => {
    const emails = gmailData[pid] || PROJECTS[pid].emails || [];
    return emails.length > 0;
  }).sort();
  
  if (!allPids.length) {
    html += '<div class="gmail-loading">No email signals found</div>';
  }
  
  for (const pid of allPids) {
    const emails = gmailData[pid] || PROJECTS[pid].emails || [];
    if (!emails.length) continue;
    const pname = PROJECTS[pid].name;
    html += `<div style="font-size:11px;font-weight:600;color:var(--blue);margin:12px 0 6px">${pid} · ${pname} (${emails.length})</div>`;
    for (const e of emails.slice(0,3)) {
      html += `<div class="email-thread" style="margin-bottom:6px">
        <div class="email-subject" style="font-size:11px">${e.subject.substring(0,70)}</div>
        <div class="email-meta">${e.sender.split('@')[0]} · ${fmt(e.date)}</div>
        <div class="email-snippet">${e.snippet.substring(0,100)}</div>
      </div>`;
    }
  }
  document.getElementById('emailsPane').innerHTML = html;
}

function switchTab(tab) {
  activeTab = tab;
  document.getElementById('tabActions').className = 'tab' + (tab==='actions'?' active':'');
  document.getElementById('tabEmails').className = 'tab' + (tab==='emails'?' active':'');
  document.getElementById('actionsPane').style.display = tab==='actions'?'block':'none';
  document.getElementById('emailsPane').style.display = tab==='emails'?'block':'none';
}

async function refreshGmail_disabled() {
  const badge = document.getElementById('gmailBadge');
  badge.textContent = '📧 Loading…';
  try {
    const result = await window.cowork.callMcpTool(
      'mcp__67d183fc-6aa9-4a14-9fa5-be0bb1098825__search_threads',
      {query: 'newer_than:14d', pageSize: 50}
    );
    
    const PID_NAMES = {
      'new london':'26-001','beacon point':'26-001','groton':'26-001','cole street':'26-001','raintree':'26-001','pelican':'26-001',
      'newport':'26-002','fort adams':'26-002','firehouse':'26-002',
      'earle':'26-003','lakehurst':'26-004',
      'charleston':'26-005','knutson':'26-005','hickory hall':'26-005',
      'fort jackson':'26-006','fort detrick':'26-007',
      'fort eustis':'26-009','madison avenue':'26-009',
      'usma':'26-010','west point':'26-010',
      'minot':'26-024','dundee':'26-024',
      'portsmouth':'26-025','bicknell':'26-025','kempf':'26-025',
      'fort carson':'24-101','cherbourg':'24-101','harr ave':'24-101','remagen':'24-101','phii':'24-101',
    };
    
    const liveSignals = {};
    let threads = [];
    if (result && result.content) {
      for (const c of result.content) {
        if (c.type==='text') { try { threads = JSON.parse(c.text).threads||[]; } catch(e){} }
      }
    }
    
    for (const t of threads) {
      const msg = t.messages[t.messages.length-1];
      const text = ((msg.subject||'')+' '+(msg.snippet||'')).toLowerCase();
      const matched = new Set();
      
      // Check explicit IDs
      const m = text.matchAll(/\b(2[4-6]-\d{3})\b/g);
      for (const hit of m) matched.add(hit[1]);
      
      // Check names
      for (const [kw,pid] of Object.entries(PID_NAMES)) {
        if (text.includes(kw)) matched.add(pid);
      }
      
      for (const pid of matched) {
        if (!liveSignals[pid]) liveSignals[pid] = [];
        liveSignals[pid].push({
          subject: msg.subject||'',
          snippet: (msg.snippet||'').substring(0,120),
          sender: msg.sender||'',
          date: msg.date||'',
          tid: t.id
        });
      }
    }
    
    let total = Object.values(liveSignals).reduce((s,a)=>s+a.length,0);
    gmailData = liveSignals;
    badge.textContent = `📧 ${total} live thread${total!==1?'s':''}`;
    badge.title = 'Click to refresh';
    renderProjects();
    renderEmailsSidebar();
  } catch(e) {
    badge.textContent = '📧 Offline';
    console.error('Gmail refresh error:', e);
  }
}

// Init
renderProjects();
renderActions();
renderEmailsSidebar();
document.getElementById('gmailBadge').textContent='Static snapshot · {now}'; document.getElementById('gmailBadge').style.cursor='default';
</script>
