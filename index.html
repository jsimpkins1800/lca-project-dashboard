<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LCA Project Command Center</title>
<style>
  :root {
    --setup: #3b82f6; --field: #f59e0b; --reporting: #8b5cf6; --done: #22c55e;
    --bg: #0f172a; --card: #1e293b; --card2: #263245; --border: #334155;
    --text: #e2e8f0; --muted: #94a3b8; --accent: #38bdf8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
         background: var(--bg); color: var(--text); font-size: 13px; }
  #header { background: var(--card); border-bottom: 1px solid var(--border);
             padding: 10px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #header h1 { font-size: 15px; font-weight: 700; color: #fff; flex: 1; }
  .badge { background: #1e3a5f; color: var(--accent); padding: 2px 8px; border-radius: 99px;
           font-size: 11px; font-weight: 600; }
  .badge.snap { background: #1f2d3d; color: var(--muted); cursor: default; }
  .badge.pri { background: #7c3aed22; color: #a78bfa; }
  .badge.loading { background: #1a2535; color: #64748b; animation: pulse 1.5s infinite; }
  .badge.live { background: #052e16; color: var(--done); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
  #main { display: flex; height: calc(100vh - 43px); overflow: hidden; }
  #sidebar { width: 265px; min-width: 200px; overflow-y: auto; border-right: 1px solid var(--border);
             background: var(--card); display: flex; flex-direction: column; }
  .section-hdr { padding: 8px 12px; font-size: 10px; font-weight: 700; letter-spacing: .08em;
                 color: var(--muted); text-transform: uppercase; border-bottom: 1px solid var(--border); }
  .proj-item { padding: 9px 12px; border-bottom: 1px solid #1e293b; cursor: pointer;
               transition: background .15s; position: relative; }
  .proj-item:hover, .proj-item.active { background: var(--card2); }
  .proj-item .pid { font-size: 10px; color: var(--muted); font-weight: 600; }
  .proj-item .pname { font-weight: 600; font-size: 12px; margin: 1px 0; color: #fff; }
  .prior-tag { font-size: 9px; background: #854d0e44; color: #fbbf24;
               border-radius: 3px; padding: 1px 4px; margin-left: 4px; }
  .stale-tag { font-size: 9px; background: #1e293b; color: #64748b;
               border-radius: 3px; padding: 1px 4px; margin-left: 4px; }
  .proj-item .bar { height: 4px; border-radius: 2px; background: var(--border); margin-top: 5px;
                    overflow: hidden; display: flex; }
  .proj-item .bar .seg { height: 100%; }
  .proj-item .chips { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
  .chip { font-size: 9px; padding: 1px 5px; border-radius: 3px; font-weight: 600; }
  .chip.Setup { background: #1d3461; color: var(--setup); }
  .chip.Field { background: #451a03; color: var(--field); }
  .chip.Reporting { background: #2e1065; color: var(--reporting); }
  .chip.Done { background: #052e16; color: var(--done); }
  .email-dot { position: absolute; top: 9px; right: 10px; background: var(--accent);
               color: #000; font-size: 9px; font-weight: 700; border-radius: 99px;
               padding: 1px 5px; }
  .action-item { padding: 8px 12px; border-bottom: 1px solid #1e293b; font-size: 11px;
                 display: flex; gap: 6px; align-items: flex-start; cursor: pointer; transition: background .15s; }
  .action-item:hover { background: var(--card2); }
  .action-item .icon { flex-shrink: 0; }
  .action-item .atxt { color: var(--text); line-height: 1.4; }
  .action-item .asrc { color: var(--muted); font-size: 10px; margin-top: 2px; }
  .pri-hi { border-left: 3px solid #ef4444; }
  .pri-md { border-left: 3px solid #f59e0b; }
  .pri-lo { border-left: 3px solid #475569; }
  #content { flex: 1; overflow-y: auto; padding: 16px; }
  .overview { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px;
              margin-bottom: 16px; }
  .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
  .stat-card .label { font-size: 10px; color: var(--muted); text-transform: uppercase;
                      letter-spacing: .06em; margin-bottom: 4px; }
  .stat-card .value { font-size: 24px; font-weight: 700; color: #fff; }
  .stat-card .sub { font-size: 10px; color: var(--muted); margin-top: 2px; }
  #detail { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
  #detail h2 { font-size: 15px; font-weight: 700; color: #fff; margin-bottom: 12px;
               display: flex; align-items: center; gap: 8px; }
  .detail-stats { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .dscard { background: var(--card2); border-radius: 6px; padding: 8px 14px; text-align: center; flex: 1; min-width: 80px; }
  .dscard .dv { font-size: 20px; font-weight: 700; }
  .dscard .dl { font-size: 10px; color: var(--muted); }
  .dv.Setup { color: var(--setup); }
  .dv.Field { color: var(--field); }
  .dv.Reporting { color: var(--reporting); }
  .dv.Done { color: var(--done); }
  .pipeline-bar { height: 8px; border-radius: 4px; display: flex; overflow: hidden; margin-bottom: 14px; }
  .pipeline-bar .seg { height: 100%; }
  .email-section { margin-bottom: 14px; }
  .email-section h3 { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase;
                      letter-spacing: .06em; margin-bottom: 6px; }
  .email-thread { background: var(--card2); border-radius: 6px; padding: 8px 10px; margin-bottom: 5px; }
  .email-thread .esubj { font-weight: 600; font-size: 11px; color: #fff; }
  .email-thread .esnip { color: var(--muted); font-size: 10px; margin-top: 2px; line-height: 1.4; }
  .email-thread .emeta { color: #475569; font-size: 10px; margin-top: 3px; }
  .unit-table { width: 100%; border-collapse: collapse; font-size: 11px; }
  .unit-table th { text-align: left; padding: 5px 8px; color: var(--muted); font-size: 10px;
                   text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid var(--border); }
  .unit-table td { padding: 5px 8px; border-bottom: 1px solid #1e293b; }
  .unit-table tr:hover td { background: var(--card2); }
  .seg-badge { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 10px; font-weight: 600; }
  .seg-badge.Setup { background: #1d3461; color: var(--setup); }
  .seg-badge.Field { background: #451a03; color: var(--field); }
  .seg-badge.Reporting { background: #2e1065; color: var(--reporting); }
  .seg-badge.Done { background: #052e16; color: var(--done); }
  .unit-scroll { max-height: 400px; overflow-y: auto; margin-top: 10px; }
  #welcome { color: var(--muted); text-align: center; padding: 60px 20px; }
  #welcome .big { font-size: 32px; margin-bottom: 8px; }
  #welcome p { font-size: 13px; line-height: 1.6; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
  .pct-badge { font-size: 9px; color: var(--muted); }
  .gmail-loading { color: #64748b; font-size: 10px; font-style: italic; }
</style>
</head>

        <p>Select a project from the sidebar to view details,<br>pipeline status, and recent email activity.</p>

    </div>
  </div>
</div>

const SEG_COLORS = { Setup: '#3b82f6', Field: '#f59e0b', Reporting: '#8b5cf6', Done: '#22c55e' };
let liveEmails = {};
let selectedPid = null;

function segs(units) {
  const s = { Setup: 0, Field: 0, Reporting: 0, Done: 0 };
  units.forEach(u => { s[u.seg] = (s[u.seg] || 0) + 1; });
  return s;
}

function pct(units) {
  const total = units.length;
  if (!total) return 0;
  return Math.round(units.filter(u => u.seg === 'Done').length / total * 100);
}

function renderOverview() {
  const totalUnits = PROJECTS.reduce((a,p) => a + p.units.length, 0);
  const doneUnits = PROJECTS.reduce((a,p) => a + p.units.filter(u=>u.seg==='Done').length, 0);
  const activeProjects = PROJECTS.filter(p => p.units.some(u=>u.seg!=='Done')).length;
  const emailCount = PROJECTS.reduce((a,p) => a + (liveEmails[p.pid]||[]).length, 0) ||
                     PROJECTS.reduce((a,p) => a + p.emailCount, 0);
  const el = document.getElementById('overview-stats');
  el.innerHTML = `
    <div class="stat-card"><div class="label">Active Projects</div><div class="value">${activeProjects}</div><div class="sub">of 13 tracked</div></div>
    <div class="stat-card"><div class="label">Total Units</div><div class="value">${totalUnits}</div><div class="sub">${doneUnits} done · ${totalUnits-doneUnits} active</div></div>
    <div class="stat-card"><div class="label">Overall Progress</div><div class="value">${Math.round(doneUnits/totalUnits*100)||0}%</div><div class="sub">${doneUnits} of ${totalUnits} units</div></div>
    <div class="stat-card"><div class="label">Email Signals</div><div class="value">${emailCount}</div><div class="sub">threads last 14d</div></div>
  `;
}

function renderSidebar() {
  const el = document.getElementById('proj-list');
  el.innerHTML = PROJECTS.map(p => {
    const s = segs(p.units);
    const total = p.units.length;
    const pctDone = pct(p.units);
    const emailCt = (liveEmails[p.pid]||[]).length || p.emailCount;
    const barSegs = ['Setup','Field','Reporting','Done'].map(seg => {
      const w = total ? (s[seg]||0)/total*100 : 0;
      return w > 0 ? `<div class="seg" style="width:${w}%;background:${SEG_COLORS[seg]}"></div>` : '';
    }).join('');
    const chips = ['Setup','Field','Reporting','Done'].filter(seg => s[seg]).map(seg =>
      `<span class="chip ${seg}">${s[seg]} ${seg}</span>`
    ).join('');
    const emailDot = emailCt ? `<span class="email-dot">${emailCt}</span>` : '';
    const priorTag = p.prior ? '<span class="prior-tag">Prior Yr</span>' : '';
    const staleTag = p.note ? '<span class="stale-tag">cached</span>' : '';
    return `<div class="proj-item${selectedPid===p.pid?' active':''}" onclick="selectProject('${p.pid}')">
      ${emailDot}
      <div class="pid">${p.pid}</div>
      <div class="pname">${p.name}${priorTag}${staleTag}</div>
      <div class="bar">${barSegs}</div>
      <div class="chips">${chips}<span class="pct-badge">${pctDone}%</span></div>
    </div>`;
  }).join('');

  const al = document.getElementById('action-list');
  al.innerHTML = ACTION_ITEMS.map(a =>
    `<div class="action-item pri-${a.pri}" onclick="selectProject('${a.pid}')">
      <span class="icon">${a.icon}</span>
      <div><div class="atxt">${a.text}</div><div class="asrc">${a.src} · ${a.pid}</div></div>
    </div>`
  ).join('');
  document.getElementById('action-count').textContent = `${ACTION_ITEMS.length} actions`;
}

function selectProject(pid) {
  selectedPid = pid;
  const p = PROJECTS.find(x => x.pid === pid);
  renderSidebar();

  const threads = liveEmails[pid] || [];
  const s = segs(p.units);
  const total = p.units.length;
  const pctDone = pct(p.units);

  const statCards = ['Setup','Field','Reporting','Done'].map(seg =>
    `<div class="dscard"><div class="dv ${seg}">${s[seg]||0}</div><div class="dl">${seg}</div></div>`
  ).join('');

  const barSegs = ['Setup','Field','Reporting','Done'].map(seg => {
    const w = total ? (s[seg]||0)/total*100 : 0;
    return w > 0 ? `<div class="seg" style="width:${w}%;background:${SEG_COLORS[seg]}"></div>` : '';
  }).join('');

  const emailHTML = threads.length ? threads.map(t =>
    `<div class="email-thread">
      <div class="esubj">${t.subject||''}</div>
      <div class="esnip">${t.snippet||''}</div>
      <div class="emeta">${t.sender||''} · ${t.date||''}</div>
    </div>`
  ).join('') : `<div class="gmail-loading">Loading live Gmail threads…</div>`;

  const hasM = p.hasAcm || p.isWater;
  const mLabel = p.acmLabel || 'ACM';
  const thM = hasM ? `<th>${mLabel}</th>` : '';
  const rows = p.units.map(u => {
    const tdM = hasM ? `<td>${u.m||''}</td>` : '';
    return `<tr><td>${u.a}</td><td><span class="seg-badge ${u.seg}">${u.s||u.seg}</span></td>${tdM}</tr>`;
  }).join('');

  const priorTag = p.prior ? ' <span class="prior-tag" style="font-size:11px">Prior Year</span>' : '';
  const staleNote = p.note ? `<div style="font-size:10px;color:#64748b;margin-bottom:8px;">ℹ️ ${p.note}</div>` : '';

  document.getElementById('detail').innerHTML = `
    <h2>${p.name} <span style="font-size:11px;color:var(--muted);font-weight:400">${p.pid}</span>${priorTag}
      <span style="font-size:11px;color:var(--muted);font-weight:400;margin-left:auto">${pctDone}% complete</span>
    </h2>
    ${staleNote}
    <div class="detail-stats">${statCards}</div>
    <div class="pipeline-bar">${barSegs}</div>
    <div class="email-section">
      <h3>📧 Recent Email Activity (${threads.length || 'loading…'})</h3>
      ${emailHTML}
    </div>
    <div>
      <h3 style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">
        Units / Properties (${total})
      </h3>
      <div class="unit-scroll">
        <table class="unit-table">
          <thead><tr><th>Address / Unit</th><th>Status</th>${thM}</tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>
  `;
}

async function fetchGmail() { return; // static snapshot
  if(false) {
  const badge = document.getElementById('gmail-badge');
  badge.textContent = '⟳ Loading Gmail…';
  badge.className = 'badge loading';
  const pidPatterns = {
    '26-001': ['26-001','new london','beacon point','groton','sycamore','burningtree','poplar'],
    '26-002': ['26-002','newport','navsta newport','radon','quarters k'],
    '26-003': ['26-003','earle','blandy'],
    '26-004': ['26-004','lakehurst','pinehurst'],
    '26-005': ['26-005','charleston','goose creek','jbws charleston','hickory hall','knutson','chanticleer'],
    '26-006': ['26-006','fort jackson'],
    '26-007': ['26-007','fort detrick'],
    '26-009': ['26-009','fort eustis','summerall','sternberg','madison avenue'],
    '26-010': ['26-010','usma','west point','bowman','biddle','schofield','wilby'],
    '26-011': ['26-011','biddle','renovations','west point lbp'],
    '26-024': ['26-024','minot','minot afb','polar place','dundee'],
    '26-025': ['26-025','portsmouth','water testing','qtrs'],
    '24-101': ['24-101','fort carson','cherbourg','remagen','arapahoe'],
  };
  try {
    const r = await window.cowork.callMcpTool(
      'mcp__67d183fc-6aa9-4a14-9fa5-be0bb1098825__search_threads',
      { query: 'newer_than:14d (26-001 OR 26-002 OR 26-003 OR 26-004 OR 26-005 OR 26-006 OR 26-007 OR 26-009 OR 26-010 OR 26-011 OR 26-024 OR 26-025 OR 24-101 OR "new london" OR "newport" OR "earle" OR "lakehurst" OR "charleston" OR "fort jackson" OR "fort detrick" OR "fort eustis" OR "usma" OR "minot" OR "portsmouth" OR "fort carson")', pageSize: 50 }
    );
    const parsed = r.structuredContent ?? JSON.parse(r.content[0].text);
    const threads = (parsed && parsed.threads) ? parsed.threads : [];
    liveEmails = {};
    threads.forEach(thread => {
      const last = thread.messages[thread.messages.length - 1];
      const text = ((last.subject||'') + ' ' + (last.snippet||'')).toLowerCase();
      for (const [pid, terms] of Object.entries(pidPatterns)) {
        if (terms.some(t => text.includes(t.toLowerCase()))) {
          if (!liveEmails[pid]) liveEmails[pid] = [];
          liveEmails[pid].push({
            subject: last.subject || '',
            snippet: (last.snippet || '').substring(0, 140),
            sender: last.sender || '',
            date: last.date ? new Date(last.date).toLocaleDateString() : ''
          });
          break;
        }
      }
    });
    badge.textContent = `📧 ${threads.length} threads · live`;
    badge.className = 'badge live';
    badge.style.cursor = 'default';
    renderOverview();
    if (selectedPid) selectProject(selectedPid);
  } catch(e) {
    badge.textContent = 'Gmail unavailable';
    badge.className = 'badge snap';
    console.error('Gmail fetch error:', e);
  }
}

renderOverview();
renderSidebar();
