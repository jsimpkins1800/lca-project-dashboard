<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LCA Project Command Center</title>
<style>
  :root {
    --setup: #3b82f6; --field: #f59e0b; --reporting: #8b5cf6; --done: #22c55e; --unknown: #94a3b8;
    --bg: #0f172a; --surface: #1e293b; --surface2: #334155; --text: #f1f5f9; --muted: #94a3b8;
    --border: #334155; --accent: #38bdf8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; }
  
  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  .header-title { display: flex; align-items: center; gap: 10px; }
  .header-title h1 { font-size: 17px; font-weight: 700; color: var(--accent); }
  .badge { background: var(--surface2); color: var(--muted); font-size: 11px; padding: 2px 8px; border-radius: 99px; }
  .badge.live { background: #14532d; color: #4ade80; }
  .header-meta { font-size: 12px; color: var(--muted); }

  .toolbar { padding: 10px 20px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .search-box { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 6px 12px; color: var(--text); font-size: 13px; width: 220px; outline: none; }
  .search-box:focus { border-color: var(--accent); }
  .filter-btn { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 5px 12px; color: var(--text); font-size: 12px; cursor: pointer; transition: background 0.15s; }
  .filter-btn:hover, .filter-btn.active { background: var(--accent); color: #0f172a; border-color: var(--accent); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; padding: 16px 20px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px; cursor: pointer; transition: border-color 0.15s, transform 0.1s; }
  .card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .card.prior-year { border-left: 3px solid var(--field); }
  
  .card-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 10px; }
  .card-title { font-weight: 600; font-size: 14px; line-height: 1.3; }
  .card-pid { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .card-badges { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  
  .pill { font-size: 10px; padding: 2px 7px; border-radius: 99px; white-space: nowrap; }
  .pill-email { background: #1e3a5f; color: #60a5fa; }
  .pill-prior { background: #451a03; color: #fb923c; }
  
  .pipeline { display: flex; height: 6px; border-radius: 3px; overflow: hidden; gap: 1px; margin-bottom: 8px; }
  .pipeline-seg { transition: width 0.3s; }
  .seg-setup { background: var(--setup); }
  .seg-field { background: var(--field); }
  .seg-reporting { background: var(--reporting); }
  .seg-done { background: var(--done); }
  .seg-unknown { background: var(--unknown); }
  
  .stats-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .stat-chip { background: var(--surface2); border-radius: 6px; padding: 4px 8px; font-size: 11px; text-align: center; flex: 1; }
  .stat-chip .num { font-size: 16px; font-weight: 700; display: block; }
  .stat-chip .lbl { color: var(--muted); font-size: 10px; }
  .stat-chip.setup .num { color: var(--setup); }
  .stat-chip.field .num { color: var(--field); }
  .stat-chip.reporting .num { color: var(--reporting); }
  .stat-chip.done .num { color: var(--done); }
  
  .progress-bar { background: var(--surface2); border-radius: 99px; height: 4px; overflow: hidden; margin-bottom: 6px; }
  .progress-fill { background: var(--done); height: 100%; border-radius: 99px; transition: width 0.4s; }
  .progress-label { font-size: 10px; color: var(--muted); text-align: right; }

  /* Detail Panel */
  .detail-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; align-items: flex-end; }
  .detail-overlay.open { display: flex; }
  .detail-panel { background: var(--surface); width: 100%; max-height: 85vh; border-radius: 16px 16px 0 0; overflow: hidden; display: flex; flex-direction: column; }
  .detail-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .detail-header h2 { font-size: 16px; font-weight: 700; }
  .close-btn { background: var(--surface2); border: none; color: var(--text); width: 28px; height: 28px; border-radius: 99px; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }
  .detail-body { overflow-y: auto; flex: 1; padding: 16px 20px; }
  
  .detail-stats { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .detail-stat { background: var(--surface2); border-radius: 8px; padding: 10px 14px; text-align: center; min-width: 80px; }
  .detail-stat .n { font-size: 22px; font-weight: 700; }
  .detail-stat .l { font-size: 11px; color: var(--muted); margin-top: 2px; }
  
  .section-title { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin: 14px 0 8px; }
  
  .email-list { display: flex; flex-direction: column; gap: 6px; }
  .email-item { background: var(--surface2); border-radius: 8px; padding: 10px 12px; }
  .email-subject { font-size: 13px; font-weight: 500; margin-bottom: 3px; }
  .email-meta { font-size: 11px; color: var(--muted); }
  .email-snippet { font-size: 12px; color: #cbd5e1; margin-top: 4px; }
  
  .unit-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .unit-table th { text-align: left; padding: 6px 8px; color: var(--muted); border-bottom: 1px solid var(--border); font-weight: 500; position: sticky; top: 0; background: var(--surface); }
  .unit-table td { padding: 6px 8px; border-bottom: 1px solid #1e293b; }
  .unit-table tr:hover td { background: var(--surface2); }
  
  .seg-tag { font-size: 10px; padding: 2px 6px; border-radius: 99px; font-weight: 500; }
  .seg-tag.Setup { background: #1e3a5f; color: var(--setup); }
  .seg-tag.Field { background: #451a03; color: var(--field); }
  .seg-tag.Reporting { background: #2e1065; color: #c084fc; }
  .seg-tag.Done { background: #14532d; color: var(--done); }
  .seg-tag.Unknown { background: #1e293b; color: var(--muted); }
  
  .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); }
  
  @media (max-width: 600px) {
    .grid { grid-template-columns: 1fr; padding: 12px; }
    .detail-panel { max-height: 90vh; }
  }
</style>
</head>
<body>

<header>
  <div class="header-title">
    <h1>⚡ LCA Project Command Center</h1>
    <span class="badge live">Live xlsx data</span>
  </div>
  <div class="header-meta">Snapshot: May 01, 2026 · 13 projects parsed</div>
</header>

<div class="toolbar">
  <input class="search-box" type="text" placeholder="Search projects…" id="searchInput" oninput="filterCards()">
  <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
  <button class="filter-btn" onclick="setFilter('active',this)">Active</button>
  <button class="filter-btn" onclick="setFilter('email',this)">📧 Has Email</button>
  <button class="filter-btn" onclick="setFilter('prior',this)">Prior Year</button>
</div>

<div class="grid" id="projectGrid"></div>

<div class="detail-overlay" id="detailOverlay" onclick="closeDetail(event)">
  <div class="detail-panel" id="detailPanel">
    <div class="detail-header">

      <button class="close-btn" onclick="closeDetail()">✕</button>
    </div>
    <div class="detail-body" id="detailBody"></div>
  </div>
</div>

let currentFilter = 'all';
let currentSearch = '';
let selectedPid = null;

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderGrid();
}

function filterCards() {
  currentSearch = document.getElementById('searchInput').value.toLowerCase();
  renderGrid();
}

function segColor(seg) {
  return {Setup:'var(--setup)',Field:'var(--field)',Reporting:'var(--reporting)',Done:'var(--done)',Unknown:'var(--unknown)'}[seg] || 'var(--unknown)';
}

function pipelineHTML(segs, total) {
  if (total === 0) return '<div class="pipeline"><div class="pipeline-seg seg-unknown" style="width:100%"></div></div>';
  const order = ['Setup','Field','Reporting','Done','Unknown'];
  return '<div class="pipeline">' + order.map(s => {
    const w = total > 0 ? (segs[s]||0)/total*100 : 0;
    if (w === 0) return '';
    return `<div class="pipeline-seg seg-${s.toLowerCase()}" style="width:${w}%"></div>`;
  }).join('') + '</div>';
}

function renderGrid() {
  const grid = document.getElementById('projectGrid');
  let filtered = PROJECTS.filter(p => {
    if (currentFilter === 'active' && p.pct === 100) return false;
    if (currentFilter === 'email' && p.emails.length === 0) return false;
    if (currentFilter === 'prior' && !p.isPrior) return false;
    if (currentSearch && !p.name.toLowerCase().includes(currentSearch) && !p.id.includes(currentSearch)) return false;
    return true;
  });
  
  if (filtered.length === 0) {
    grid.innerHTML = '<div class="empty-state">No projects match your filter.</div>';
    return;
  }
  
  grid.innerHTML = filtered.map(p => {
    const emailBadge = p.emails.length > 0 ? `<span class="pill pill-email">📧 ${p.emails.length}</span>` : '';
    const priorBadge = p.isPrior ? `<span class="pill pill-prior">Prior Year</span>` : '';
    return `
    <div class="card ${p.isPrior ? 'prior-year' : ''}" onclick="openDetail('${p.id}')">
      <div class="card-header">
        <div>
          <div class="card-title">${p.name}</div>
          <div class="card-pid">${p.id} · ${p.total} units</div>
        </div>
        <div class="card-badges">${emailBadge}${priorBadge}</div>
      </div>
      ${pipelineHTML(p.segs, p.total)}
      <div class="stats-row">
        <div class="stat-chip setup"><span class="num">${p.segs.Setup}</span><span class="lbl">Setup</span></div>
        <div class="stat-chip field"><span class="num">${p.segs.Field}</span><span class="lbl">Field</span></div>
        <div class="stat-chip reporting"><span class="num">${p.segs.Reporting}</span><span class="lbl">Report</span></div>
        <div class="stat-chip done"><span class="num">${p.segs.Done}</span><span class="lbl">Done</span></div>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${p.pct}%"></div></div>
      <div class="progress-label">${p.pct}% complete</div>
    </div>`;
  }).join('');
}

function openDetail(pid) {
  const p = PROJECTS.find(x => x.id === pid);
  if (!p) return;
  selectedPid = pid;
  document.getElementById('detailTitle').textContent = p.name + ' (' + p.id + ')';
  
  const segsOrder = ['Setup','Field','Reporting','Done','Unknown'];
  const statsHtml = segsOrder.filter(s => p.segs[s] > 0).map(s => `
    <div class="detail-stat">
      <div class="n" style="color:${segColor(s)}">${p.segs[s]}</div>
      <div class="l">${s}</div>
    </div>`).join('');
  
  const emailHtml = p.emails.length > 0
    ? p.emails.map(e => `
      <div class="email-item">
        <div class="email-subject">${e.subject}</div>
        <div class="email-meta">${e.sender} · ${e.date}</div>
        <div class="email-snippet">${e.snippet}</div>
      </div>`).join('')
    : '<div style="color:var(--muted);font-size:12px">No recent emails matched.</div>';
  
  const hasAcm = !!p.acmLabel;
  const acmHeader = hasAcm ? `<th>${p.acmLabel}</th>` : '';
  
  const unitRows = p.units.map(u => `
    <tr>
      <td>${u.a}</td>
      <td><span class="seg-tag ${u.g}">${u.g}</span></td>
      <td style="color:var(--muted)">${u.s}</td>
      ${hasAcm ? `<td>${u.m||''}</td>` : ''}
    </tr>`).join('');
  
  document.getElementById('detailBody').innerHTML = `
    <div class="detail-stats">
      <div class="detail-stat"><div class="n">${p.total}</div><div class="l">Total Units</div></div>
      ${statsHtml}
      <div class="detail-stat"><div class="n" style="color:var(--done)">${p.pct}%</div><div class="l">Complete</div></div>
    </div>
    <div class="section-title">Recent Emails (${p.emails.length})</div>
    <div class="email-list">${emailHtml}</div>
    <div class="section-title">Units (${p.units.length})</div>
    <div style="overflow-x:auto">
      <table class="unit-table">
        <thead><tr><th>Address / Unit</th><th>Stage</th><th>Status</th>${acmHeader}</tr></thead>
        <tbody>${unitRows}</tbody>
      </table>
    </div>
  `;
  
  document.getElementById('detailOverlay').classList.add('open');
}

function closeDetail(e) {
  if (e && e.target !== document.getElementById('detailOverlay')) return;
  document.getElementById('detailOverlay').classList.remove('open');
}

renderGrid();
</script>
