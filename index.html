<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LCA Project Command Center</title>
<style>
  :root {
    --setup: #3b82f6; --field: #f59e0b; --reporting: #8b5cf6; --done: #22c55e;
    --bg: #0f172a; --card: #1e293b; --card2: #263245; --border: #334155;
    --text: #e2e8f0; --muted: #94a3b8; --accent: #38bdf8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
         background: var(--bg); color: var(--text); font-size: 13px; }
  
  #header { background: var(--card); border-bottom: 1px solid var(--border);
             padding: 10px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #header h1 { font-size: 15px; font-weight: 700; color: #fff; flex: 1; }
  .badge { background: #1e3a5f; color: var(--accent); padding: 2px 8px; border-radius: 99px;
           font-size: 11px; font-weight: 600; }
  .badge.snap { background: #1f2d3d; color: var(--muted); cursor: default; }
  .badge.pri { background: #7c3aed22; color: #a78bfa; }
  
  #main { display: flex; height: calc(100vh - 43px); overflow: hidden; }
  
  #sidebar { width: 260px; min-width: 200px; overflow-y: auto; border-right: 1px solid var(--border);
             background: var(--card); display: flex; flex-direction: column; }
  
  .section-hdr { padding: 8px 12px; font-size: 10px; font-weight: 700; letter-spacing: .08em;
                 color: var(--muted); text-transform: uppercase; border-bottom: 1px solid var(--border); }
  
  .proj-item { padding: 9px 12px; border-bottom: 1px solid #1e293b; cursor: pointer;
               transition: background .15s; position: relative; }
  .proj-item:hover, .proj-item.active { background: var(--card2); }
  .proj-item .pid { font-size: 10px; color: var(--muted); font-weight: 600; }
  .proj-item .pname { font-weight: 600; font-size: 12px; margin: 1px 0; color: #fff; }
  .proj-item .pname .prior-tag { font-size: 9px; background: #854d0e44; color: #fbbf24;
                                  border-radius: 3px; padding: 1px 4px; margin-left: 4px; }
  .proj-item .bar { height: 4px; border-radius: 2px; background: var(--border); margin-top: 5px;
                    overflow: hidden; display: flex; }
  .proj-item .bar .seg { height: 100%; }
  .proj-item .chips { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
  .chip { font-size: 9px; padding: 1px 5px; border-radius: 3px; font-weight: 600; }
  .chip.setup { background: #1d3461; color: var(--setup); }
  .chip.field { background: #451a03; color: var(--field); }
  .chip.reporting { background: #2e1065; color: var(--reporting); }
  .chip.done { background: #052e16; color: var(--done); }
  .email-dot { position: absolute; top: 9px; right: 10px; background: var(--accent);
               color: #000; font-size: 9px; font-weight: 700; border-radius: 99px;
               padding: 1px 5px; }
  
  .action-item { padding: 8px 12px; border-bottom: 1px solid #1e293b; font-size: 11px;
                 display: flex; gap: 6px; align-items: flex-start; }
  .action-item .icon { flex-shrink: 0; }
  .action-item .atxt { color: var(--text); line-height: 1.4; }
  .action-item .asrc { color: var(--muted); font-size: 10px; margin-top: 2px; }
  .pri-hi { border-left: 3px solid #ef4444; }
  .pri-md { border-left: 3px solid #f59e0b; }
  .pri-lo { border-left: 3px solid #475569; }
  
  #content { flex: 1; overflow-y: auto; padding: 16px; }
  
  .overview { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px;
              margin-bottom: 16px; }
  .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px;
               padding: 12px; }
  .stat-card .label { font-size: 10px; color: var(--muted); text-transform: uppercase;
                      letter-spacing: .06em; margin-bottom: 4px; }
  .stat-card .value { font-size: 24px; font-weight: 700; color: #fff; }
  .stat-card .sub { font-size: 10px; color: var(--muted); margin-top: 2px; }
  
  #detail { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
  #detail h2 { font-size: 15px; font-weight: 700; color: #fff; margin-bottom: 12px; 
               display: flex; align-items: center; gap: 8px; }
  
  .detail-stats { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .dscard { background: var(--card2); border-radius: 6px; padding: 8px 14px; text-align: center; flex: 1; min-width: 80px; }
  .dscard .dv { font-size: 20px; font-weight: 700; }
  .dscard .dl { font-size: 10px; color: var(--muted); }
  .dv.setup { color: var(--setup); }
  .dv.field { color: var(--field); }
  .dv.reporting { color: var(--reporting); }
  .dv.done { color: var(--done); }
  
  .pipeline-bar { height: 8px; border-radius: 4px; display: flex; overflow: hidden; margin-bottom: 14px; }
  .pipeline-bar .seg { height: 100%; }
  
  .email-section { margin-bottom: 14px; }
  .email-section h3 { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase;
                      letter-spacing: .06em; margin-bottom: 6px; }
  .email-thread { background: var(--card2); border-radius: 6px; padding: 8px 10px; margin-bottom: 5px; }
  .email-thread .esubj { font-weight: 600; font-size: 11px; color: #fff; }
  .email-thread .esnip { color: var(--muted); font-size: 10px; margin-top: 2px; line-height: 1.4; }
  .email-thread .emeta { color: #475569; font-size: 10px; margin-top: 3px; }
  
  .unit-table { width: 100%; border-collapse: collapse; font-size: 11px; }
  .unit-table th { text-align: left; padding: 5px 8px; color: var(--muted); font-size: 10px;
                   text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid var(--border); }
  .unit-table td { padding: 5px 8px; border-bottom: 1px solid #1e293b; }
  .unit-table tr:hover td { background: var(--card2); }
  .seg-badge { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 10px; font-weight: 600; }
  .seg-badge.setup { background: #1d3461; color: var(--setup); }
  .seg-badge.field { background: #451a03; color: var(--field); }
  .seg-badge.reporting { background: #2e1065; color: var(--reporting); }
  .seg-badge.done { background: #052e16; color: var(--done); }
  
  .unit-scroll { max-height: 380px; overflow-y: auto; margin-top: 10px; }
  
  #welcome { color: var(--muted); text-align: center; padding: 60px 20px; }
  #welcome .big { font-size: 32px; margin-bottom: 8px; }
  #welcome p { font-size: 13px; line-height: 1.6; }
  
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
</style>
</head>

</div>

// Render overview stats
function renderOverview() {
  const totalUnits = PROJECTS.reduce((a,p) => a + p.units.length, 0);
  const totalDone = PROJECTS.reduce((a,p) => a + p.units.filter(u=>u.seg==='Done').length, 0);
  const totalReporting = PROJECTS.reduce((a,p) => a + p.units.filter(u=>u.seg==='Reporting').length, 0);
  const totalField = PROJECTS.reduce((a,p) => a + p.units.filter(u=>u.seg==='Field').length, 0);
  const totalSetup = PROJECTS.reduce((a,p) => a + p.units.filter(u=>u.seg==='Setup').length, 0);
  const pct = totalUnits > 0 ? Math.round(totalDone/totalUnits*100) : 0;

  const statsEl = document.getElementById('overview-stats');
  statsEl.innerHTML = `
    <div class="stat-card"><div class="label">Active Projects</div><div class="value">${PROJECTS.length}</div><div class="sub">across all bases</div></div>
    <div class="stat-card"><div class="label">Total Units</div><div class="value">${totalUnits}</div><div class="sub">${pct}% complete</div></div>
    <div class="stat-card"><div class="label">In Setup</div><div class="value" style="color:var(--setup)">${totalSetup}</div><div class="sub">awaiting inspection</div></div>
    <div class="stat-card"><div class="label">In Field</div><div class="value" style="color:var(--field)">${totalField}</div><div class="sub">inspection/lab active</div></div>
    <div class="stat-card"><div class="label">In Reporting</div><div class="value" style="color:var(--reporting)">${totalReporting}</div><div class="sub">report stage</div></div>
    <div class="stat-card"><div class="label">Done</div><div class="value" style="color:var(--done)">${totalDone}</div><div class="sub">invoiced/closed</div></div>
  `;
}

function segColor(seg) {
  return {Setup:'var(--setup)',Field:'var(--field)',Reporting:'var(--reporting)',Done:'var(--done)'}[seg] || '#666';
}

function renderProjects() {
  const el = document.getElementById('proj-list');
  el.innerHTML = '';
  PROJECTS.forEach(p => {
    const segs = {Setup:0, Field:0, Reporting:0, Done:0};
    p.units.forEach(u => { if(segs[u.seg]!==undefined) segs[u.seg]++; });
    const total = p.units.length || 1;
    const bar = Object.entries(segs).map(([s,n]) => n > 0 ?
      `<div class="seg" style="width:${n/total*100}%;background:${segColor(s)}"></div>` : '').join('');
    const chips = Object.entries(segs).filter(([s,n])=>n>0).map(([s,n]) =>
      `<span class="chip ${s.toLowerCase()}">${s[0]}:${n}</span>`).join('');
    const emailDot = p.emailCount > 0 ? `<span class="email-dot">${p.emailCount}</span>` : '';
    const priorTag = p.prior ? `<span class="prior-tag">Prior Yr</span>` : '';
    const div = document.createElement('div');
    div.className = 'proj-item';
    div.dataset.pid = p.pid;
    div.innerHTML = `
      <div class="pid">${p.pid}</div>
      <div class="pname">${p.name}${priorTag}</div>
      <div class="bar">${bar}</div>
      <div class="chips">${chips}</div>
      ${emailDot}
    `;
    div.onclick = () => showDetail(p.pid);
    el.appendChild(div);
  });
}

function renderActions() {
  const el = document.getElementById('action-list');
  el.innerHTML = '';
  document.getElementById('action-count').textContent = `${ACTION_ITEMS.length} actions`;
  
  // Sort: hi > md > lo
  const order = {hi:0,md:1,lo:2};
  const sorted = [...ACTION_ITEMS].sort((a,b) => (order[a.pri]||2)-(order[b.pri]||2));
  sorted.forEach(a => {
    const div = document.createElement('div');
    div.className = `action-item pri-${a.pri}`;
    div.innerHTML = `<span class="icon">${a.icon}</span><div><div class="atxt">${a.text}</div><div class="asrc">${a.src}</div></div>`;
    el.appendChild(div);
  });
}

function showDetail(pid) {
  document.querySelectorAll('.proj-item').forEach(el => {
    el.classList.toggle('active', el.dataset.pid === pid);
  });
  
  const p = PROJECTS.find(x => x.pid === pid);
  if (!p) return;
  
  const segs = {Setup:0, Field:0, Reporting:0, Done:0};
  p.units.forEach(u => { if(segs[u.seg]!==undefined) segs[u.seg]++; });
  const total = p.units.length || 1;
  const pct = Math.round(segs.Done / total * 100);
  
  // Pipeline bar
  const barHtml = Object.entries(segs).map(([s,n]) => n > 0 ?
    `<div class="seg" style="width:${n/total*100}%;background:${segColor(s)}" title="${s}: ${n}"></div>` : '').join('');
  
  // Emails
  const emails = EMAIL_THREADS[pid] || [];
  let emailHtml = '';
  if (emails.length > 0) {
    emailHtml = `<div class="email-section">
      <h3>📧 Recent Email Activity (${emails.length} thread${emails.length>1?'s':''})</h3>
      ${emails.map(e => `
        <div class="email-thread">
          <div class="esubj">${e.subject || '(no subject)'}</div>
          <div class="esnip">${e.snippet || ''}</div>
          <div class="emeta">${e.sender || ''} · ${(e.date||'').substring(0,16)}</div>
        </div>
      `).join('')}
    </div>`;
  }
  
  // Unit table
  const acmHeader = p.hasAcm ? `<th>${p.acmLabel}</th>` : '';
  const unitRows = p.units.map(u => {
    const acmCell = p.hasAcm ? `<td>${u.m || ''}</td>` : '';
    return `<tr>
      <td>${u.a}</td>
      <td><span class="seg-badge ${(u.seg||'').toLowerCase()}">${u.seg}</span></td>
      <td style="color:var(--muted)">${u.s || ''}</td>
      ${acmCell}
    </tr>`;
  }).join('');
  
  const detail = document.getElementById('detail');
  detail.innerHTML = `
    <h2>
      ${p.name}
      <span style="font-size:11px;color:var(--muted);font-weight:400">${p.pid}</span>
      ${p.prior ? '<span style="font-size:10px;background:#854d0e44;color:#fbbf24;border-radius:3px;padding:1px 6px">Prior Year</span>' : ''}
      <span style="margin-left:auto;font-size:11px;color:var(--done);font-weight:600">${pct}% complete</span>
    </h2>
    <div class="detail-stats">
      <div class="dscard"><div class="dv setup">${segs.Setup}</div><div class="dl">Setup</div></div>
      <div class="dscard"><div class="dv field">${segs.Field}</div><div class="dl">Field</div></div>
      <div class="dscard"><div class="dv reporting">${segs.Reporting}</div><div class="dl">Reporting</div></div>
      <div class="dscard"><div class="dv done">${segs.Done}</div><div class="dl">Done</div></div>
      <div class="dscard"><div class="dv" style="color:#fff">${total}</div><div class="dl">Total Units</div></div>
    </div>
    <div class="pipeline-bar">${barHtml}</div>
    ${emailHtml}
    <h3 style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">Unit Tracker (${total} units)</h3>
    <div class="unit-scroll">
      <table class="unit-table">
        <thead><tr><th>Address / Unit</th><th>Stage</th><th>Status</th>${acmHeader}</tr></thead>
        <tbody>${unitRows}</tbody>
      </table>
    </div>
  `;
}

// Init
renderOverview();
renderProjects();
renderActions();
</script>
