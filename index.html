<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LCA Project Command Center</title>
<style>
  :root {
    --bg: #0f1117; --surface: #1a1d27; --surface2: #242736; --border: #2d3148;
    --text: #e2e8f0; --text2: #94a3b8; --text3: #64748b;
    --blue: #3b82f6; --amber: #f59e0b; --purple: #a855f7; --green: #22c55e;
    --red: #ef4444; --teal: #14b8a6;
    --blue-bg: rgba(59,130,246,.15); --amber-bg: rgba(245,158,11,.15);
    --purple-bg: rgba(168,85,247,.15); --green-bg: rgba(34,197,94,.15);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--text); font-size: 13px; height: 100vh;
    display: flex; flex-direction: column; overflow: hidden; }
  /* Header */
  .header { background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 10px 16px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .header h1 { font-size: 15px; font-weight: 700; color: var(--text); flex: 1; }
  .badge { padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .badge-blue { background: var(--blue-bg); color: var(--blue); }
  .badge-green { background: var(--green-bg); color: var(--green); }
  .badge-amber { background: var(--amber-bg); color: var(--amber); }
  /* Layout */
  .layout { display: flex; flex: 1; overflow: hidden; }
  /* Sidebar */
  .sidebar { width: 260px; background: var(--surface); border-right: 1px solid var(--border);
    overflow-y: auto; flex-shrink: 0; padding: 8px 0; }
  .section-label { padding: 6px 12px 4px; font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .08em; color: var(--text3); }
  .proj-row { display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    cursor: pointer; border-radius: 0; transition: background .15s; }
  .proj-row:hover { background: var(--surface2); }
  .proj-row.active { background: var(--blue-bg); border-right: 2px solid var(--blue); }
  .proj-id { font-size: 10px; font-weight: 700; color: var(--text3); min-width: 42px; }
  .proj-name { flex: 1; font-size: 12px; color: var(--text); line-height: 1.3; }
  .proj-pct { font-size: 10px; color: var(--text3); }
  .email-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--blue); flex-shrink: 0; }
  /* Mini pipeline bar */
  .mini-bar { height: 3px; border-radius: 2px; overflow: hidden; display: flex; margin-top: 3px; }
  .mini-seg { height: 100%; }
  /* Main content */
  .main { flex: 1; overflow-y: auto; padding: 16px; }
  /* Action items panel */
  .actions-panel { background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; margin-bottom: 16px; overflow: hidden; }
  .actions-header { padding: 10px 14px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px; }
  .actions-header h2 { font-size: 13px; font-weight: 700; flex: 1; }
  .action-item { display: flex; align-items: flex-start; gap: 10px; padding: 9px 14px;
    border-bottom: 1px solid var(--border); }
  .action-item:last-child { border-bottom: none; }
  .action-pri { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 4px; margin-top: 1px; flex-shrink: 0; }
  .pri-hi { background: rgba(239,68,68,.15); color: var(--red); }
  .pri-md { background: var(--amber-bg); color: var(--amber); }
  .pri-lo { background: rgba(100,116,139,.15); color: var(--text3); }
  .action-text { flex: 1; line-height: 1.5; color: var(--text); font-size: 12px; }
  .action-meta { font-size: 10px; color: var(--text3); margin-top: 2px; }
  /* Project detail */
  .proj-detail { background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; overflow: hidden; }
  .detail-header { padding: 12px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px; }
  .detail-title { font-size: 14px; font-weight: 700; flex: 1; }
  /* Pipeline bar */
  .pipeline-bar { height: 8px; border-radius: 4px; overflow: hidden; display: flex;
    margin: 0 16px 0; }
  .pipe-seg { height: 100%; transition: width .3s; }
  .pipe-labels { display: flex; padding: 4px 16px 12px; gap: 0; }
  .pipe-label { flex: 1; font-size: 10px; text-align: center; }
  /* Stat cards */
  .stat-cards { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; padding: 0 16px 12px; }
  .stat-card { background: var(--surface2); border-radius: 6px; padding: 10px 12px; }
  .stat-val { font-size: 20px; font-weight: 800; }
  .stat-lbl { font-size: 10px; color: var(--text3); margin-top: 2px; text-transform: uppercase; letter-spacing: .05em; }
  .c-setup { color: var(--blue); }
  .c-field { color: var(--amber); }
  .c-reporting { color: var(--purple); }
  .c-done { color: var(--green); }
  /* Email threads */
  .email-section { padding: 0 16px 12px; }
  .email-section h3 { font-size: 11px; font-weight: 700; color: var(--text3);
    text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; }
  .email-thread { background: var(--surface2); border-radius: 6px; padding: 9px 12px;
    margin-bottom: 6px; border-left: 3px solid var(--blue); }
  .email-subject { font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 3px; }
  .email-snippet { font-size: 11px; color: var(--text2); line-height: 1.4; }
  .email-meta { font-size: 10px; color: var(--text3); margin-top: 4px; }
  /* Unit table */
  .unit-section { padding: 0 16px 16px; }
  .unit-section h3 { font-size: 11px; font-weight: 700; color: var(--text3);
    text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; }
  .unit-table-wrap { max-height: 280px; overflow-y: auto; border-radius: 6px;
    border: 1px solid var(--border); }
  table { width: 100%; border-collapse: collapse; }
  thead th { background: var(--surface2); padding: 7px 10px; font-size: 10px;
    font-weight: 700; color: var(--text3); text-align: left; position: sticky; top: 0;
    text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid var(--border); }
  tbody tr { border-bottom: 1px solid var(--border); }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--surface2); }
  tbody td { padding: 7px 10px; font-size: 11px; color: var(--text); }
  .seg-chip { display: inline-block; padding: 2px 8px; border-radius: 999px;
    font-size: 10px; font-weight: 600; }
  .seg-Setup { background: var(--blue-bg); color: var(--blue); }
  .seg-Field { background: var(--amber-bg); color: var(--amber); }
  .seg-Reporting { background: var(--purple-bg); color: var(--purple); }
  .seg-Done { background: var(--green-bg); color: var(--green); }
  /* Gmail pill in header */
  .gmail-pill { display: flex; align-items: center; gap: 5px; background: var(--surface2);
    border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px;
    font-size: 11px; cursor: pointer; }
  .gmail-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  /* Scrollbar */
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .prior-badge { font-size: 9px; padding: 1px 5px; background: rgba(168,85,247,.2); color: var(--purple); border-radius: 3px; margin-left: 4px; }
  .no-proj { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 300px; color: var(--text3); gap: 8px; }
  .no-proj .icon { font-size: 32px; }
</style>
</head>

function segColor(seg) {

  main.innerHTML = actHTML + `
  <div class="proj-detail">
    <div class="detail-header">
      <div class="detail-title">${p.id} — ${p.name} ${p.priorYear?'<span class="prior-badge">Prior Year</span>':''}</div>
      <span class="badge badge-${pct===100?'green':'amber'}">${pct}% complete</span>
    </div>
    <div class="stat-cards">
      <div class="stat-card"><div class="stat-val c-setup">${counts.Setup||0}</div><div class="stat-lbl">Setup</div></div>
      <div class="stat-card"><div class="stat-val c-field">${counts.Field||0}</div><div class="stat-lbl">Field</div></div>
      <div class="stat-card"><div class="stat-val c-reporting">${counts.Reporting||0}</div><div class="stat-lbl">Reporting</div></div>
      <div class="stat-card"><div class="stat-val c-done">${counts.Done||0}</div><div class="stat-lbl">Done</div></div>
    </div>
    <div style="padding:0 16px 4px"><div class="pipeline-bar">${barSegs}</div></div>
    <div class="pipe-labels">${barLabels}</div>
    <div class="email-section">
      <h3>📧 Recent Email Signals (${threads.length})</h3>
      ${emailHTML}
    </div>
    <div class="unit-section">
      <h3>🏠 All Units (${total})</h3>
      <div class="unit-table-wrap">
        <table>
          <thead><tr><th>Address / Unit</th><th>Status</th>${acmHeader}</tr></thead>
          <tbody>${tableRows}</tbody>
        </table>
      </div>
    </div>
  </div>`;
}

function renderActions() {
  const hiItems = ACTION_ITEMS.filter(a => a.pri === 'hi');
  const otherItems = ACTION_ITEMS.filter(a => a.pri !== 'hi');
  const allItems = [...hiItems, ...otherItems];
  const rows = allItems.map(a => `
    <div class="action-item">
      <span class="action-pri pri-${a.pri}">${a.pri.toUpperCase()}</span>
      <div>
        <div class="action-text">${a.icon} ${a.text}</div>
        <div class="action-meta">${a.src}${a.pid ? ' · ' + a.pid : ''}</div>
      </div>
    </div>`).join('');
  return `<div class="actions-panel" style="margin-bottom:16px">
    <div class="actions-header">
      <h2>⚡ Action Items</h2>
      <span class="badge badge-amber">${hiItems.length} high priority</span>
    </div>
    ${rows}
  </div>`;
}

function selectProject(pid) {
  selectedPid = pid;
  renderSidebar();
  renderMain();
  document.getElementById('main').scrollTop = 0;
}

async function refreshGmail() {
  const el = document.getElementById('gmail-status');
  el.textContent = 'Refreshing…';
  try {
    if (window.cowork && window.cowork.callMcpTool) {
      const result = await window.cowork.callMcpTool(
        'mcp__67d183fc-6aa9-4a14-9fa5-be0bb1098825__search_threads',
        { query: 'newer_than:14d', pageSize: 50 }
      );
      // parse and re-match signals
      const threads = result.threads || [];
      const PROJ_NAMES = {
        '24-101': ['24-101','fort carson'],
        '26-001': ['26-001','new london'],
        '26-002': ['26-002','newport','fort adams'],
        '26-003': ['26-003','earle'],
        '26-004': ['26-004','lakehurst'],
        '26-005': ['26-005','charleston'],
        '26-006': ['26-006','fort jackson'],
        '26-007': ['26-007','fort detrick'],
        '26-009': ['26-009','fort eustis'],
        '26-010': ['26-010','usma'],
        '26-011': ['26-011','usma'],
        '26-024': ['26-024','minot'],
        '26-025': ['26-025','portsmouth'],
      };
      const fresh = {};
      threads.forEach(t => {
        const msg = t.messages[t.messages.length-1];
        const text = ((msg.subject||'')+(msg.snippet||'')).toLowerCase();
        Object.entries(PROJ_NAMES).forEach(([pid,kws]) => {
          if (kws.some(kw => text.includes(kw))) {
            if (!fresh[pid]) fresh[pid] = [];
            fresh[pid].push({
              subject: msg.subject || '(no subject)',
              snippet: msg.snippet || '',
              sender: msg.sender || '',
              date: (msg.date||'').split('T')[0]
            });
          }
        });
      });
      gmailData = fresh;
      el.textContent = 'Live Gmail ✓';
    } else {
      el.textContent = 'Static snapshot · 2026-04-28'; el.style.cursor='default';
    }
  } catch(e) {
    el.textContent = 'Refresh failed';
  }
  renderSidebar();
  renderMain();
}

// Initial render
renderSidebar();
renderMain();

// Auto-refresh Gmail on load
