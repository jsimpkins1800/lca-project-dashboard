<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LCA Project Command Center</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f1117;color:#e2e8f0;min-height:100vh}
  .header{background:linear-gradient(135deg,#1a1f2e 0%,#1e2740 100%);border-bottom:1px solid #2d3748;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
  .header-left h1{font-size:18px;font-weight:700;color:#fff;letter-spacing:.5px}
  .header-left p{font-size:11px;color:#7fa3c8;margin-top:2px}
  .header-badges{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .badge{padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600}
  .badge-blue{background:#1d4ed8;color:#bfdbfe}
  .badge-green{background:#166534;color:#bbf7d0}
  .badge-gray{background:#374151;color:#9ca3af;cursor:default}
  .gmail-pill{background:#1f2937;border:1px solid #374151;color:#6b7280;padding:3px 10px;border-radius:12px;font-size:11px;cursor:pointer}
  .gmail-pill:hover{border-color:#4b5563;color:#9ca3af}
  .main{padding:16px;max-width:1400px;margin:0 auto}
  /* Summary bar */
  .summary-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
  .stat-card{background:#1a1f2e;border:1px solid #2d3748;border-radius:8px;padding:12px;text-align:center}
  .stat-card .num{font-size:24px;font-weight:700;color:#60a5fa}
  .stat-card .lbl{font-size:11px;color:#6b7280;margin-top:2px}
  /* Action items */
  .section-title{font-size:13px;font-weight:600;color:#9ca3af;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
  .actions-list{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
  .action-item{background:#1a1f2e;border:1px solid #2d3748;border-radius:6px;padding:10px 12px;display:flex;align-items:flex-start;gap:10px;cursor:pointer;transition:border-color .15s}
  .action-item:hover{border-color:#4b5563}
  .action-item .icon{font-size:14px;flex-shrink:0;margin-top:1px}
  .action-item .text{font-size:12px;color:#d1d5db;line-height:1.4;flex:1}
  .pri-hi{border-left:3px solid #ef4444}
  .pri-md{border-left:3px solid #f59e0b}
  .pri-lo{border-left:3px solid #6b7280}
  /* Project grid */
  .projects-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-bottom:20px}
  .project-card{background:#1a1f2e;border:1px solid #2d3748;border-radius:10px;padding:14px;cursor:pointer;transition:all .15s;position:relative}
  .project-card:hover{border-color:#3b82f6;transform:translateY(-1px);box-shadow:0 4px 12px rgba(59,130,246,.15)}
  .project-card.selected{border-color:#3b82f6;background:#1e2740}
  .card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .card-pid{font-size:11px;color:#6b7280;font-weight:600}
  .card-name{font-size:14px;font-weight:600;color:#e2e8f0;margin-top:1px}
  .email-badge{background:#1e3a5f;color:#60a5fa;border:1px solid #1d4ed8;border-radius:10px;padding:2px 7px;font-size:11px;font-weight:600}
  .prior-badge{background:#2d1f3d;color:#a78bfa;border:1px solid #7c3aed;border-radius:10px;padding:2px 7px;font-size:10px;margin-left:4px}
  /* Pipeline bar */
  .pipeline-bar{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-bottom:8px;gap:1px}
  .seg-setup{background:#3b82f6}
  .seg-field{background:#f59e0b}
  .seg-reporting{background:#8b5cf6}
  .seg-done{background:#22c55e}
  .seg-unknown{background:#374151}
  /* Chips */
  .chips{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
  .chip{padding:2px 7px;border-radius:10px;font-size:11px;font-weight:600}
  .chip-setup{background:#1e3a5f;color:#60a5fa}
  .chip-field{background:#3d2c00;color:#fbbf24}
  .chip-reporting{background:#2d1f3d;color:#a78bfa}
  .chip-done{background:#14312a;color:#4ade80}
  .chip-unknown{background:#1f2937;color:#6b7280}
  .pct-text{font-size:11px;color:#6b7280}
  /* Detail panel */
  .detail-panel{background:#1a1f2e;border:1px solid #3b82f6;border-radius:10px;padding:16px;margin-bottom:20px}
  .detail-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .detail-title{font-size:16px;font-weight:700;color:#fff}
  .close-btn{background:#374151;border:none;color:#9ca3af;width:24px;height:24px;border-radius:4px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
  .close-btn:hover{background:#4b5563;color:#e2e8f0}
  .detail-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin-bottom:14px}
  .d-stat{background:#111827;border-radius:6px;padding:10px;text-align:center}
  .d-stat .n{font-size:20px;font-weight:700}
  .d-stat .l{font-size:11px;color:#6b7280;margin-top:1px}
  .n-setup{color:#60a5fa} .n-field{color:#fbbf24} .n-reporting{color:#a78bfa} .n-done{color:#4ade80} .n-unknown{color:#6b7280}
  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:640px){.detail-grid{grid-template-columns:1fr}}
  .thread-list{display:flex;flex-direction:column;gap:6px}
  .thread-item{background:#111827;border-radius:6px;padding:10px;border-left:2px solid #3b82f6}
  .thread-subject{font-size:12px;font-weight:600;color:#e2e8f0;margin-bottom:3px}
  .thread-meta{font-size:11px;color:#6b7280;margin-bottom:4px}
  .thread-snippet{font-size:11px;color:#9ca3af;line-height:1.4}
  .unit-table-wrap{overflow-y:auto;max-height:280px}
  table{width:100%;border-collapse:collapse;font-size:11px}
  th{background:#111827;color:#6b7280;font-weight:600;padding:6px 8px;text-align:left;position:sticky;top:0;z-index:1;border-bottom:1px solid #374151}
  td{padding:5px 8px;border-bottom:1px solid #1f2937;color:#d1d5db}
  tr:hover td{background:#1f2937}
  .status-pill{padding:2px 6px;border-radius:8px;font-size:10px;font-weight:600;white-space:nowrap}
  .sp-setup{background:#1e3a5f;color:#60a5fa}
  .sp-field{background:#3d2c00;color:#fbbf24}
  .sp-reporting{background:#2d1f3d;color:#a78bfa}
  .sp-done{background:#14312a;color:#4ade80}
  .sp-unknown{background:#1f2937;color:#6b7280}
  /* Loading */
  .loading{color:#6b7280;font-size:12px;padding:8px 0}
  /* Scrollbar */
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-track{background:#111827}
  ::-webkit-scrollbar-thumb{background:#374151;border-radius:3px}
</style>
</head>

const ACTION_ITEMS = [{"pri":"hi","icon":"\u26a0\ufe0f","text":"Fort Carson (24-101): Finalize DRAFT Hazmat Letter of Findings \u2014 update for structural steel & handrail LBP; finalize 2 reports for next abatement phase.","src":"Gmail","pid":"24-101"},{"pri":"hi","icon":"\u26a0\ufe0f","text":"Minot AFB (26-024): ACM results awaited by Balfour (David Booth). Radon passed; ACM delivery still pending.","src":"Gmail","pid":"26-024"},{"pri":"hi","icon":"\ud83d\udccb","text":"New London (26-001): Update tracker for 281 Osprey Drive \u2014 missing entry. Add PO/WO for 15 Day St and 31 Edison Dr.","src":"Gmail","pid":"26-001"},{"pri":"hi","icon":"\ud83d\udccb","text":"Newport (26-002): Schedule T86 Firehouse ACM testing \u2014 BBC following up since Apr 17. Fort Adams PSA in DocuSign.","src":"Gmail","pid":"26-002"},{"pri":"md","icon":"\ud83d\udccb","text":"USMA West Point (26-010): Signed PSA returned. Coordinate LBP stabilization testing schedule with Trini Gonzalez.","src":"Gmail","pid":"26-010"},{"pri":"md","icon":"\ud83d\udd01","text":"Portsmouth Water (26-025): Water testing postponed (main break). Reschedule Qtrs I & P; radon mitigation proposal from Credere received.","src":"Gmail","pid":"26-025"},{"pri":"md","icon":"\ud83d\udccb","text":"New London (26-001): BBC requesting historical LBP/ACM reports for 3 Lake, 32 Ibis, 324 Burningtree and other addresses.","src":"Gmail","pid":"26-001"},{"pri":"md","icon":"\ud83d\udcac","text":"Fort Eustis (26-009): 303B/C Madison LBP test completed Thu. Confirm results and proceed with report.","src":"Gmail","pid":"26-009"},{"pri":"lo","icon":"\ud83d\udccb","text":"Earle (26-003) & Lakehurst (26-004): Proposals for outstanding work under BBC review. Follow up with Scott Foster.","src":"Gmail","pid":"26-003"},{"pri":"lo","icon":"\ud83d\udcac","text":"Newport (26-002): FM Building Soils Test deal stalled 17+ days at Proposal Sent. Follow up.","src":"Gmail","pid":"26-002"}];
const PRIOR_YEAR = new Set(["24-101"]);
const HAS_ACM = {"26-024": "ACM Detected", "24-101": "ACM Summary"};
const SNAP_DATE = "April 29, 2026";

let gmailData = GMAIL_STATIC;
let selectedPid = null;

// Segment colors/labels
const SEG = {
  Setup:     {chip:'chip-setup',    sp:'sp-setup',    bar:'seg-setup',    nc:'n-setup',    label:'Setup'},
  Field:     {chip:'chip-field',    sp:'sp-field',    bar:'seg-field',    nc:'n-field',    label:'Field'},
  Reporting: {chip:'chip-reporting',sp:'sp-reporting',bar:'seg-reporting',nc:'n-reporting',label:'Reporting'},
  Done:      {chip:'chip-done',     sp:'sp-done',     bar:'seg-done',     nc:'n-done',     label:'Done'},
  Unknown:   {chip:'chip-unknown',  sp:'sp-unknown',  bar:'seg-unknown',  nc:'n-unknown',  label:'Unknown'},
};

function segCounts(units) {
  const c = {Setup:0,Field:0,Reporting:0,Done:0,Unknown:0};
  units.forEach(u => { c[u.g] = (c[u.g]||0)+1; });
  return c;
}

function pipelineBar(counts, total) {
  const segs = ['Setup','Field','Reporting','Done','Unknown'];
  return segs.map(s => {
    const pct = total ? (counts[s]||0)/total*100 : 0;
    return pct > 0 ? `<div class="${SEG[s].bar}" style="flex:${pct}"></div>` : '';
  }).join('');
}

function renderSummary() {
  const pids = Object.keys(PROJECTS);
  const totals = {Setup:0,Field:0,Reporting:0,Done:0,Unknown:0};
  let totalUnits = 0;
  pids.forEach(pid => {
    const c = segCounts(PROJECTS[pid].units);
    Object.keys(totals).forEach(s => totals[s]+=c[s]||0);
    totalUnits += PROJECTS[pid].units.length;
  });
  document.getElementById('project-count').textContent = pids.length+' projects';
  document.getElementById('unit-count').textContent = totalUnits+' units';
  const cards = [
    {n:totals.Setup, l:'Setup', c:'n-setup'},
    {n:totals.Field, l:'Field', c:'n-field'},
    {n:totals.Reporting, l:'Reporting', c:'n-reporting'},
    {n:totals.Done, l:'Done', c:'n-done'},
    {n:totals.Unknown, l:'Needs Status', c:'n-unknown'},
  ];
  document.getElementById('summary-row').innerHTML = cards.map(c=>
    `<div class="stat-card"><div class="num ${c.c}">${c.n}</div><div class="lbl">${c.l}</div></div>`
  ).join('');
}

function renderActions() {
  document.getElementById('actions-list').innerHTML = ACTION_ITEMS.map(a => `
    <div class="action-item pri-${a.pri}" onclick="selectProject('${a.pid}')">
      <span class="icon">${a.icon}</span>
      <span class="text">${a.text}</span>
    </div>
  `).join('');
}

function renderProjectCard(pid) {
  const proj = PROJECTS[pid];
  const units = proj.units;
  const counts = segCounts(units);
  const total = units.length;
  const done = counts.Done||0;
  const pct = total ? Math.round(done/total*100) : 0;
  const emailCount = (gmailData[pid]||[]).length;
  const isSelected = selectedPid === pid;
  const isPrior = PRIOR_YEAR.has(pid);
  
  const chips = ['Setup','Field','Reporting','Done','Unknown'].filter(s=>(counts[s]||0)>0).map(s=>
    `<span class="chip ${SEG[s].chip}">${counts[s]} ${SEG[s].label}</span>`
  ).join('');
  
  return `
  <div class="project-card ${isSelected?'selected':''}" id="card-${pid}" onclick="selectProject('${pid}')">
    <div class="card-header">
      <div>
        <div class="card-pid">${pid}${isPrior?'<span class="prior-badge">Prior Yr</span>':''}</div>
        <div class="card-name">${proj.name}</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
        ${emailCount>0?`<span class="email-badge">📧 ${emailCount}</span>`:''}
        <span class="pct-text">${pct}% done</span>
      </div>
    </div>
    <div class="pipeline-bar">${pipelineBar(counts, total)}</div>
    <div class="chips">${chips}</div>
  </div>`;
}

function renderProjects() {
  document.getElementById('projects-grid').innerHTML = Object.keys(PROJECTS).map(pid=>renderProjectCard(pid)).join('');
}

function selectProject(pid) {
  if(selectedPid === pid) {
    selectedPid = null;
    document.getElementById('detail-panel').style.display='none';
    renderProjects();
    return;
  }
  selectedPid = pid;
  renderProjects();
  renderDetail(pid);
  document.getElementById('detail-panel').scrollIntoView({behavior:'smooth',block:'nearest'});
}

function renderDetail(pid) {
  const proj = PROJECTS[pid];
  const units = proj.units;
  const counts = segCounts(units);
  const total = units.length;
  const isPrior = PRIOR_YEAR.has(pid);
  const acmLabel = HAS_ACM[pid]||null;
  const threads = gmailData[pid]||[];
  
  const statCards = ['Setup','Field','Reporting','Done','Unknown'].map(s=>
    `<div class="d-stat"><div class="n ${SEG[s].nc}">${counts[s]||0}</div><div class="l">${SEG[s].label}</div></div>`
  ).join('');
  
  const threadHTML = threads.length > 0 ? threads.map(t=>`
    <div class="thread-item">
      <div class="thread-subject">${t.subject}</div>
      <div class="thread-meta">${t.sender} · ${t.date}</div>
      <div class="thread-snippet">${t.snippet}</div>
    </div>
  `).join('') : '<div class="loading">No recent email threads found for this project.</div>';
  
  const tableRows = units.map(u=>`
    <tr>
      <td>${u.a}</td>
      <td><span class="status-pill sp-${u.g.toLowerCase()}">${u.s||'—'}</span></td>
      ${acmLabel?`<td>${u.m||'—'}</td>`:''}</tr>
  `).join('');
  
  document.getElementById('detail-panel').style.display='block';
  document.getElementById('detail-panel').innerHTML = `
    <div class="detail-header">
      <div>
        <div class="detail-title">${pid} — ${proj.name}${isPrior?' <span class="prior-badge">Prior Year</span>':''}</div>
        <div style="font-size:11px;color:#6b7280;margin-top:2px">${total} units total</div>
      </div>
      <button class="close-btn" onclick="selectProject('${pid}')">✕</button>
    </div>
    <div class="detail-stats">${statCards}</div>
    <div class="detail-grid">
      <div>
        <div class="section-title" style="margin-bottom:8px">Recent Email Threads (${threads.length})</div>
        <div class="thread-list">${threadHTML}</div>
      </div>
      <div>
        <div class="section-title" style="margin-bottom:8px">Unit Status</div>
        <div class="unit-table-wrap">
          <table>
            <thead><tr><th>Address</th><th>Status</th>${acmLabel?`<th>${acmLabel}</th>`:''}</tr></thead>
            <tbody>${tableRows}</tbody>
          </table>
        </div>
      </div>
    </div>
  `;
}

function refreshGmail() {
  const pill = document.getElementById('gmail-pill');
  pill.textContent = '📧 Refreshing…';
  
  if(false) {
    const queries = [
      'newer_than:14d (26-001 OR 26-002 OR 26-003 OR 26-004 OR 26-005 OR 26-006 OR 26-007 OR 26-009 OR 26-010 OR 26-011 OR 26-024 OR 26-025 OR 24-101)',
      'newer_than:14d (newport OR earle OR lakehurst OR "fort jackson" OR "fort detrick" OR "fort eustis" OR usma OR minot OR "fort carson" OR "new london" OR portsmouth OR charleston)'
    ];
    Promise.all(queries.map(q =>
      window.cowork.callMcpTool('mcp__67d183fc-6aa9-4a14-9fa5-be0bb1098825__search_threads', {query:q, pageSize:50})
    )).then(results => {
      const threadMap = {};
      const allThreads = [];
      results.forEach(r => {
        if(r && r.threads) allThreads.push(...r.threads);
      });
      // Deduplicate by thread ID
      const seen = new Set();
      const unique = allThreads.filter(t => { const dup=seen.has(t.id); seen.add(t.id); return !dup; });
      
      // Project name patterns
      const patterns = [
        {pid:'26-001', re:/new.?london/i},
        {pid:'26-002', re:/newport|fort.?adams/i},
        {pid:'26-003', re:/earle/i},
        {pid:'26-004', re:/lakehurst/i},
        {pid:'26-005', re:/charleston/i},
        {pid:'26-006', re:/fort.?jackson/i},
        {pid:'26-007', re:/fort.?detrick/i},
        {pid:'26-009', re:/fort.?eustis/i},
        {pid:'26-010', re:/usma|west.?point/i},
        {pid:'26-011', re:/usma|west.?point/i},
        {pid:'26-024', re:/minot/i},
        {pid:'26-025', re:/portsmouth/i},
        {pid:'24-101', re:/fort.?carson|24-101/i},
      ];
      const idRe = /\b2[4-6]-\d{3}\b/g;
      
      const fresh = {};
      unique.forEach(t => {
        const last = t.messages[t.messages.length-1];
        const text = (last.subject||'')+' '+(last.snippet||'');
        const matched = new Set();
        // by ID pattern
        const idMatches = text.match(idRe)||[];
        idMatches.forEach(id => matched.add(id));
        // by name
        patterns.forEach(p => { if(p.re.test(text)) matched.add(p.pid); });
        matched.forEach(pid => {
          if(!fresh[pid]) fresh[pid]=[];
          fresh[pid].push({
            subject: last.subject||'(no subject)',
            snippet: last.snippet||'',
            sender: last.sender||'',
            date: new Date(last.date).toLocaleDateString('en-US',{month:'short',day:'numeric'})
          });
        });
      });
      
      // Merge with static (fresh takes priority)
      gmailData = Object.assign({}, GMAIL_STATIC, fresh);
      const emailCount = Object.values(gmailData).reduce((a,b)=>a+b.length,0);
      pill.textContent = 'Static snapshot · {SNAP_DATE}'; pill.style.cursor='default';
      renderProjects();
      if(selectedPid) renderDetail(selectedPid);
    }).catch(()=>{
      pill.textContent = '📧 '+Object.values(GMAIL_STATIC).reduce((a,b)=>a+b.length,0)+' cached threads';
    });
  } else {
    pill.textContent = '📧 Static snapshot · April 29, 2026';
    pill.style.cursor = 'default';
  }
}

// Init
renderSummary();
renderActions();
renderProjects();
refreshGmail();
</script>
