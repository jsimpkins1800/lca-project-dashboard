const ACTION_ITEMS = [{"pri": "hi", "icon": "\u2620\ufe0f", "text": "Scott: close the loop on USMA 532B Winans Road \u2014 the report went out Aug 10 on a case triggered by a 9-month-old testing positive for lead, and BOTH BBC recipients auto-replied out of office. Call West Point Family Homes to confirm someone has read it, then answer Rob's Renovations-vs-Facilities billing question.", "src": "Daily Snapshot Aug 5\u201311", "pid": "26-010"}, {"pri": "hi", "icon": "\ud83d\udcde", "text": "Scott: Franklin Township NJ asked Aug 8 for lead AND radon at 149 Girard Ave, 24 Austin Ave and more \u2014 still unanswered, and Christine Woodbury is on vacation with no email until Aug 24. Soos is already in the thread. Phone the township office; email will not reach her.", "src": "Daily Snapshot Aug 5\u201311", "pid": null}, {"pri": "hi", "icon": "\ud83d\udcc4", "text": "Scott: the EHC Impact license package is 4 days overdue (asked Aug 6, due Aug 7) \u2014 NY and PA asbestos + lead inspector licenses, expired copies acceptable. EHC is the subcontractor for the proposed Friday Aug 14 Fort Eustis round; unmet credentialing stops mobilization.", "src": "Daily Snapshot Aug 5\u201311", "pid": "26-009"}, {"pri": "hi", "icon": "\ud83d\udcb0", "text": "Rob/Scott: 647 Chanticleer has no proposal and nothing in QuickBooks, yet work may already have been performed \u2014 Kirtland admitted his original request 'slipped through the cracks'. Reconstruct what was done, invoice against PO 1876396 or write it off deliberately, and confirm whether 649 is in scope.", "src": "Daily Snapshot Aug 5\u201311", "pid": "26-005"}, {"pri": "hi", "icon": "\ud83e\uddfe", "text": "Rob/Scott: Fort Eustis 304D Madison Avenue was reported to the customer Aug 10 with no proposal on file \u2014 there is no priced basis to invoice against. Same failure mode as 647 Chanticleer, twice in one window. Confirm the WO/PO or request one from Mendy O'Connor.", "src": "Daily Snapshot Aug 5\u201311", "pid": "26-009"}, {"pri": "hi", "icon": "\ud83d\udd0d", "text": "Justin: QC coverage is 0 / 7 and it is a harder zero than usual \u2014 all seven deliverables sent this window never entered Trace at all, and there is still not one QC-named record in any of the 18 LCA projects. Either adopt the convention or stop measuring coverage against all sent work.", "src": "Daily Snapshot Aug 5\u201311", "pid": null}, {"pri": "md", "icon": "\ud83d\udcc5", "text": "Scott: two separate Friday Aug 14 Fort Eustis commitments are open and neither is confirmed \u2014 338A 26th Street + 2942B Summerall with Laurie Becker (POs 1877321 / 1877310 already issued), and Tehsin's EHC Impact round. Send one message confirming both, with the licenses attached.", "src": "Daily Snapshot Aug 5\u201311", "pid": "26-009"}, {"pri": "md", "icon": "\u2753", "text": "Scott: the Aug 10 Charleston field round is unverified \u2014 five addresses were expected (647 Chanticleer, 813 Petrel, 215 Fletcher, 404 Parnassus, 37 Hamilton) and no post-inspection confirmation, COC or lab submittal has appeared. 215 Fletcher had an unconfirmed resident as of Aug 7. Confirm what was actually accessed before promising reports.", "src": "Daily Snapshot Aug 5\u201311", "pid": "26-005"}, {"pri": "md", "icon": "\ud83d\udce6", "text": "Rob/Scott: three JBWS Charleston work orders from Tamangala Ross are still unreturned \u2014 WO 10840109 and WO 10540142 (Aug 4) and WO 10550777 (Aug 6). Unreturned WOs stall BBC payment runs, and 10840109 is tangled up in the 647 Chanticleer billing question.", "src": "Daily Snapshot Aug 5\u201311", "pid": "26-005"}, {"pri": "md", "icon": "\ud83d\udccb", "text": "Scott: 6 Polk is authorized (PO 1878135, roof covering only) with no date offered. Fold it into the same scheduling pass as 215 Fletcher, 37 Hamilton (PO 1877990) and 404 Parnassus (PO 1877986).", "src": "Gmail Aug 5\u201311", "pid": "26-005"}, {"pri": "md", "icon": "\ud83d\udcc4", "text": "Scott: Big East delivered the 273 Ohio Avenue PCM clearance report Aug 10 and invoiced $450 (invoice 26503). LCA is paying for lab work it has not turned into a billable deliverable \u2014 issue the clearance letter and raise the matching invoice.", "src": "Daily Snapshot Aug 5\u201311", "pid": "26-001"}, {"pri": "md", "icon": "\ud83d\udcb5", "text": "Justin/Rob: set the rush-lab markup rule. EMSL charged $19.75/sample for 6-hour PLM and $81.90/sample for 24-hour TEM against LCA's $20/$80 invoicing \u2014 that is billing at or below cost. Decide the standing markup before the 104 Farley Lane invoice goes out.", "src": "Daily Snapshot Aug 5\u201311", "pid": null}, {"pri": "md", "icon": "\ud83d\uddfa", "text": "Scott/Justin: Grand Forks AFB was approved by BBC Environmental on Jul 28 with instructions to submit an ESR, and nothing has moved in two weeks. It is priced at $1,250/unit against Minot's $875 and is the successor to a wound-down program. Email Gabriel Hayes; escalate to Ken Sperry if no answer this week.", "src": "Daily Snapshot Aug 5\u201311", "pid": null}, {"pri": "md", "icon": "\ud83c\udfd7", "text": "Justin: Fort Carson has gone silent \u2014 no email traffic at all in 20 days, last activity the Jul 20 Draw 51 reconciliation. This has been LCA's largest recurring draw. Contact Elliott Johnson on the demolition schedule and confirm where Draw 52 stands.", "src": "Daily Snapshot Aug 5\u201311", "pid": "24-101"}, {"pri": "md", "icon": "\ud83c\udfe5", "text": "Justin/Rob: send the Paychex ICHRA and HSA pricing request. Justin drafted it Aug 8 and asked Rob to discuss first; a September 1 effective date leaves about three weeks, which is tight for benefits onboarding.", "src": "Daily Snapshot Aug 5\u201311", "pid": null}, {"pri": "md", "icon": "\ud83d\udcc1", "text": "Create unit folders for the nine Charleston addresses now in play with no folder under Buildings:Units \u2014 647 Chanticleer, 813 Petrel, 215 Fletcher, 404 Parnassus, 37 Hamilton, 6 Polk, 933 Tringa, 288 Fletcher, 306 Guadalcanal. Note 643/646 Chanticleer, 217/233 Fletcher and 818 Petrel already exist and are different properties.", "src": "Folder audit Aug 11", "pid": "26-005"}, {"pri": "md", "icon": "\ud83d\udcc1", "text": "Create unit folders for Fort Eustis 338A 26th Street and 2942B Summerall Circle \u2014 both have POs issued and Friday Aug 14 proposed, but neither has a folder. 2946A/2946B Summerall exist and are different units.", "src": "Folder audit Aug 11", "pid": "26-009"}, {"pri": "lo", "icon": "\ud83d\udcc2", "text": "Create a project folder and number for Franklin Township NJ \u2014 a municipal lead and radon request with named addresses and no folder, no tracker and no Trace project.", "src": "Folder audit Aug 11", "pid": null}, {"pri": "lo", "icon": "\ud83e\uddff", "text": "Six revenue-bearing sites still have no spine at all \u2014 no tracker xlsx and no Trace project: Picatinny 104 Farley Lane (26-014), Lower Bucks Hospital 827 Old Orchard Lane, Franklin Township NJ, 86 Wood Avenue Middlesex, 1 Cottage Place Freehold, and the Groton CT addresses. This is real invoiced work invisible to every project tool.", "src": "Daily Snapshot Aug 5\u201311", "pid": null}, {"pri": "lo", "icon": "\ud83d\udcdd", "text": "Write down the Renovations-vs-Facilities rule. Rob has now asked it three times \u2014 USMA 532B Winans Road (Aug 10), the Lusk Roofing proposals (Jul 9) and radon testing (Jun 26) \u2014 and each time it stalls invoicing. One page ends it permanently.", "src": "Daily Snapshot Aug 5\u201311", "pid": null}, {"pri": "lo", "icon": "\ud83d\udee0", "text": "Scott: reply to RDS Renovate on 86 Wood Avenue, Middlesex NJ. The contractor photographed the replaced basement door and frame Aug 4 and asked what else LCA needs \u2014 the cheapest possible item to close, and it is holding a lead safe certificate.", "src": "Daily Snapshot Aug 5\u201311", "pid": null}, {"pri": "lo", "icon": "\ud83d\udcde", "text": "Scott: close out the offer to source abatement contractors for Lower Bucks Hospital (827 Old Orchard Lane). LCA does not bid abatement, but the referral keeps LCA in line for the eventual clearance work.", "src": "Daily Snapshot Aug 5\u201311", "pid": null}, {"pri": "lo", "icon": "\ud83d\udccb", "text": "Justin: finish the Zycus supplier onboarding for Balfour Beatty and record who owns it. The OTP arrived Aug 4 and it was forwarded to Scott Aug 6 with no owner \u2014 supplier onboarding gates payment on the BBC side.", "src": "Daily Snapshot Aug 5\u201311", "pid": null}, {"pri": "lo", "icon": "\ud83d\udd0e", "text": "Ask who updated the Fort Carson Pre-Demolition ACM & LBP Survey Template in Trace on Aug 6 \u2014 the only Trace activity in the window, on a project with no email traffic. It may mean work is queued that has not reached the mailbox.", "src": "Daily Snapshot Aug 5\u201311", "pid": "24-101"}, {"pri": "lo", "icon": "\ud83d\udcea", "text": "Mark the 26-024 Minot tracker closed. Minot is dormant by design \u2014 final invoice May 2026, no Trace project, no email since June \u2014 but the tracker still reads active. Grand Forks is the successor and has no tracker at all.", "src": "Daily Snapshot Aug 5\u201311", "pid": "26-024"}];

function segCounts(units) {
  const c = {Setup:0,Field:0,Reporting:0,Done:0};
  units.forEach(u => { if(c[u.seg]!==undefined) c[u.seg]++; });
  return c;
}
function pct(units) {
  const done = units.filter(u=>u.seg==='Done').length;
  return units.length ? Math.round(done/units.length*100) : 0;
}

let currentPid = PROJECTS[0].pid;


function buildSidebar() {
  const sb = document.getElementById('sidebar');
  const active = PROJECTS.filter(p=>!p.prior);
  const prior = PROJECTS.filter(p=>p.prior);
  const hiActions = ACTION_ITEMS.filter(a=>a.pri==='hi');

  let html = '<div class="section-label">Active Projects</div>';
  active.forEach((p,i) => {
    const pctDone = pct(p.units);
    html += `<div class="proj-row${p.pid===currentPid?' active':''}" onclick="selectProject('${p.pid}')" id="row-${p.pid}">
      <div class="proj-info">
        <span class="proj-name">${p.name}</span>
        <div class="proj-id">${p.pid}</div>
        <div class="pct-bar"><div class="pct-fill" style="width:${pctDone}%"></div></div>
      </div>
      <div class="proj-meta">
        <span class="email-badge${p.emailCount>0?'':' zero'}">${p.emailCount}✉</span>
      </div>
    </div>`;
  });

  if(prior.length) {
    html += '<div class="section-label">Prior Year</div>';
    prior.forEach(p => {
      const pctDone = pct(p.units);
      html += `<div class="proj-row prior${p.pid===currentPid?' active':''}" onclick="selectProject('${p.pid}')" id="row-${p.pid}">
        <div class="proj-info">
          <div style="display:flex;align-items:center;gap:6px"><span class="proj-name">${p.name}</span><span class="prior-tag">PY</span></div>
          <div class="proj-id">${p.pid}</div>
          <div class="pct-bar"><div class="pct-fill" style="width:${pctDone}%"></div></div>
        </div>
        <div class="proj-meta"><span class="email-badge${p.emailCount>0?'':' zero'}">${p.emailCount}✉</span></div>
      </div>`;
    });
  }

  if(hiActions.length) {
    html += '<div class="section-label" style="color:#ef4444">🔴 High Priority</div>';
    hiActions.forEach(a => {
      html += `<div style="padding:7px 16px;font-size:11px;border-left:3px solid var(--red);background:#1e293b;margin:1px 0;cursor:pointer;line-height:1.4" onclick="selectProject('${a.pid}')">${a.text.substring(0,65)}</div>`;
    });
  }

  sb.innerHTML = html;
}

function selectProject(pid) {
  currentPid = pid;
  buildSidebar();
  renderProject(pid);
}

function renderProject(pid) {
  const p = PROJECTS.find(x=>x.pid===pid);
  if(!p) return;
  const sc = segCounts(p.units);
  const pctDone = pct(p.units);
  const actions = ACTION_ITEMS.filter(a=>a.pid===pid);
  const emails = gmailThreads[pid]||[];

  let html = `
    <div class="proj-header">
      <h2>${p.name}${p.prior?' <span class="prior-tag">Prior Year</span>':''}</h2>
      <div class="sub">${p.pid} · ${p.units.length} units · ${pctDone}% complete · ${p.emailCount} email threads (14d)</div>
    </div>
    <div class="stats-row">
      <div class="stat-card"><div class="val" style="color:var(--blue)">${sc.Setup}</div><div class="lbl">Setup</div></div>
      <div class="stat-card"><div class="val" style="color:var(--amber)">${sc.Field}</div><div class="lbl">Field</div></div>
      <div class="stat-card"><div class="val" style="color:var(--purple)">${sc.Reporting}</div><div class="lbl">Reporting</div></div>
      <div class="stat-card"><div class="val" style="color:var(--green)">${sc.Done}</div><div class="lbl">Done</div></div>
      <div class="stat-card"><div class="val">${pctDone}%</div><div class="lbl">Complete</div></div>
    </div>
    <div class="pipeline">
      <div class="seg Setup"><span class="count">${sc.Setup}</span>Setup</div>
      <div class="seg Field"><span class="count">${sc.Field}</span>Field</div>
      <div class="seg Reporting"><span class="count">${sc.Reporting}</span>Reporting</div>
      <div class="seg Done"><span class="count">${sc.Done}</span>Done</div>
    </div>`;

  if(actions.length) {
    html += `<div class="action-board"><h3>⚡ Action Items</h3>`;
    actions.forEach(a => { html += `<div class="action-item ${a.pri}">${a.icon} ${a.text}</div>`; });
    html += `</div>`;
  }

  if(emails.length) {
    html += `<div class="email-section" style="margin-top:20px"><h3>📧 Recent Email Threads (${emails.length})</h3>`;
    emails.forEach(e => {
      html += `<div class="email-card">
        <div class="email-subject">${e.subject||'(no subject)'}</div>
        <div class="email-meta">From: ${e.sender} · ${e.date?new Date(e.date).toLocaleDateString():''}</div>
        <div class="email-snippet">${e.snippet||''}</div>
      </div>`;
    });
    html += `</div>`;
  }

  html += `<div style="margin-top:20px"><h3 style="font-size:13px;font-weight:700;margin-bottom:10px">Units (${p.units.length})</h3>
    <div class="unit-table-wrap"><table>
      <tr><th>Address</th><th>Status</th><th>Stage</th>${p.hasAcm?'<th>'+p.acmLabel+'</th>':''}${p.isWater?'<th>Notes</th>':''}</tr>`;
  p.units.forEach(u => {
    html += `<tr>
      <td>${u.a||'—'}</td><td>${u.s||'—'}</td>
      <td><span class="seg-chip ${u.seg}">${u.seg}</span></td>
      ${p.hasAcm?`<td>${u.m||'—'}</td>`:''}
      ${p.isWater?`<td>${u.m||'—'}</td>`:''}
    </tr>`;
  });
  html += `</table></div></div>`;

  document.getElementById('main').innerHTML = html;
}

// Boot
buildSidebar();
renderProject(currentPid);

</script>
