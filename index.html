<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LCA Project Command Center</title>
<style>
  :root {
    --blue: #3b82f6; --amber: #f59e0b; --purple: #8b5cf6; --green: #22c55e;
    --red: #ef4444; --bg: #0f172a; --card: #1e293b; --border: #334155;
    --text: #e2e8f0; --muted: #94a3b8; --accent: #38bdf8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; }
  header { background: var(--card); border-bottom: 1px solid var(--border); padding: 14px 20px; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 18px; font-weight: 700; color: var(--accent); flex: 1; }
  .badge { background: #1d4ed8; color: #bfdbfe; font-size: 11px; padding: 2px 8px; border-radius: 99px; font-weight: 600; }
  .badge.snap { background: #1e3a5f; color: var(--muted); cursor: default; }
  .badge.prior { background: #7c3aed; color: #ddd6fe; }
  .badge.email { background: #064e3b; color: #6ee7b7; }
  .snap-date { color: var(--muted); font-size: 12px; }
  .layout { display: grid; grid-template-columns: 1fr 320px; gap: 0; height: calc(100vh - 57px); overflow: hidden; }
  .main { overflow-y: auto; padding: 16px; }
  .sidebar { border-left: 1px solid var(--border); overflow-y: auto; background: #151f2e; }
  .sidebar-hdr { padding: 12px 16px; border-bottom: 1px solid var(--border); font-weight: 700; font-size: 13px; color: var(--accent); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; cursor: pointer; transition: border-color .15s, box-shadow .15s; }
  .card:hover { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent)22; }
  .card.active { border-color: var(--accent); background: #1a2d45; }
  .card-hdr { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .pid { font-size: 11px; font-weight: 700; color: var(--muted); font-family: monospace; }
  .cname { font-weight: 700; font-size: 14px; flex: 1; }
  .pct { font-size: 12px; font-weight: 700; color: var(--green); }
  .bar { height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; margin-bottom: 8px; display: flex; }
  .bar span { height: 100%; }
  .chips { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
  .chip { font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; }
  .chip.Setup { background: #1d4ed833; color: var(--blue); border: 1px solid var(--blue)44; }
  .chip.Field { background: #d9770633; color: var(--amber); border: 1px solid var(--amber)44; }
  .chip.Reporting { background: #7c3aed33; color: var(--purple); border: 1px solid var(--purple)44; }
  .chip.Done { background: #16653133; color: var(--green); border: 1px solid var(--green)44; }
  .email-pill { font-size: 10px; background: #06406444; color: #67e8f9; border: 1px solid #0e748044; padding: 1px 6px; border-radius: 99px; }
  /* Detail panel */
  #detail { display: none; background: var(--card); border: 1px solid var(--border); border-radius: 10px; margin-top: 16px; padding: 16px; }
  #detail.show { display: block; }
  .detail-hdr { font-size: 16px; font-weight: 700; margin-bottom: 12px; color: var(--accent); display: flex; align-items: center; gap: 10px; }
  .stats-row { display: flex; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .stat-box { background: #0f172a; border: 1px solid var(--border); border-radius: 8px; padding: 10px 16px; flex: 1; min-width: 100px; text-align: center; }
  .stat-val { font-size: 22px; font-weight: 800; }
  .stat-lbl { font-size: 11px; color: var(--muted); }
  .stat-val.blue { color: var(--blue); } .stat-val.amber { color: var(--amber); }
  .stat-val.purple { color: var(--purple); } .stat-val.green { color: var(--green); }
  .section-title { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 14px 0 8px; }
  .thread-list { display: flex; flex-direction: column; gap: 6px; max-height: 200px; overflow-y: auto; }
  .thread { background: #0f172a; border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; }
  .thread-subj { font-weight: 600; font-size: 12px; color: var(--text); }
  .thread-meta { font-size: 10px; color: var(--muted); margin-top: 2px; }
  .thread-snip { font-size: 11px; color: #8893a8; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .unit-table-wrap { max-height: 280px; overflow-y: auto; border: 1px solid var(--border); border-radius: 6px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { background: #0f172a; padding: 6px 10px; text-align: left; color: var(--muted); font-weight: 600; position: sticky; top: 0; }
  td { padding: 5px 10px; border-top: 1px solid var(--border)88; }
  tr:hover td { background: #ffffff08; }
  .seg-badge { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 4px; }
  .seg-Setup { background: #1d4ed822; color: var(--blue); }
  .seg-Field { background: #d9770622; color: var(--amber); }
  .seg-Reporting { background: #7c3aed22; color: var(--purple); }
  .seg-Done { background: #16653122; color: var(--green); }
  /* Sidebar */
  .action-item { padding: 10px 14px; border-bottom: 1px solid var(--border)66; }
  .action-item:last-child { border-bottom: none; }
  .ai-pri { display: inline-block; font-size: 9px; font-weight: 800; padding: 1px 5px; border-radius: 3px; margin-right: 6px; text-transform: uppercase; }
  .ai-pri.hi { background: #7f1d1d; color: #fca5a5; }
  .ai-pri.md { background: #78350f; color: #fcd34d; }
  .ai-pri.lo { background: #14532d; color: #86efac; }
  .ai-text { font-size: 12px; line-height: 1.4; color: var(--text); }
  .ai-pid { font-size: 10px; color: var(--muted); margin-top: 2px; font-family: monospace; }
  .no-data { color: var(--muted); font-size: 12px; text-align: center; padding: 20px; }
  .close-btn { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 4px; padding: 2px 8px; cursor: pointer; font-size: 11px; margin-left: auto; }
  .close-btn:hover { color: var(--text); border-color: var(--muted); }
  @media (max-width: 700px) { .layout { grid-template-columns: 1fr; } .sidebar { display: none; } }
</style>
</head>

const SEG_COLORS = {Setup:'#3b82f6', Field:'#f59e0b', Reporting:'#8b5cf6', Done:'#22c55e'};
const SEG_ORDER = ['Setup','Field','Reporting','Done'];

function segCounts(units) {
  const c = {Setup:0,Field:0,Reporting:0,Done:0};
  units.forEach(u => { c[u.g] = (c[u.g]||0)+1; });
  return c;
}

function pct(units) {
  if (!units.length) return 0;
  return Math.round(units.filter(u=>u.g==='Done').length/units.length*100);
}

function renderCard(p) {
  const counts = segCounts(p.units);
  const total = p.units.length;
  const done = pct(p.units);
  const signals = (GMAIL_SIGNALS[p.pid]||[]).length;
  const segs = SEG_ORDER.filter(s=>counts[s]>0);
  
  let barHtml = SEG_ORDER.map(s => {
    const w = total ? (counts[s]||0)/total*100 : 0;
    return w>0 ? `<span style="width:${w}%;background:${SEG_COLORS[s]}"></span>` : '';
  }).join('');
  
  let chips = segs.map(s=>`<span class="chip ${s}">${s} ${counts[s]}</span>`).join('');
  if (signals) chips += `<span class="email-pill">✉ ${signals}</span>`;
  if (p.priorYear) chips += `<span class="badge prior" style="font-size:9px">PY</span>`;

  return `<div class="card" id="card-${p.pid}" onclick="showDetail('${p.pid}')">
    <div class="card-hdr">
      <span class="pid">${p.pid}</span>
      <span class="cname">${p.name}</span>
      <span class="pct">${done}%</span>
    </div>
    <div class="bar">${barHtml}</div>
    <div class="chips">${chips}</div>
    <div style="font-size:10px;color:var(--muted)">${total} units</div>
  </div>`;
}

function showDetail(pid) {
  const p = PROJECTS.find(x=>x.pid===pid);
  if (!p) return;
  document.querySelectorAll('.card').forEach(c=>c.classList.remove('active'));
  const card = document.getElementById('card-'+pid);
  if (card) card.classList.add('active');
  
  const counts = segCounts(p.units);
  const total = p.units.length;
  const done = pct(p.units);
  const signals = GMAIL_SIGNALS[pid]||[];
  
  const statsHtml = SEG_ORDER.map(s=>`
    <div class="stat-box">
      <div class="stat-val ${s==='Setup'?'blue':s==='Field'?'amber':s==='Reporting'?'purple':'green'}">${counts[s]||0}</div>
      <div class="stat-lbl">${s}</div>
    </div>`).join('') + `<div class="stat-box"><div class="stat-val green">${done}%</div><div class="stat-lbl">Done</div></div>`;

  const threadsHtml = signals.length ? signals.map(t=>`
    <div class="thread">
      <div class="thread-subj">${t.subject}</div>
      <div class="thread-meta">${t.sender} · ${t.date}</div>
      <div class="thread-snip">${t.snippet}</div>
    </div>`).join('') : '<div class="no-data">No recent emails</div>';

  const hasACM = p.acmLabel && p.units.some(u=>'m' in u);
  let thACM = hasACM ? `<th>${p.acmLabel}</th>` : '';
  let rows = p.units.map(u=>`
    <tr>
      <td>${u.a}</td>
      <td><span class="seg-badge seg-${u.g}">${u.g}</span></td>
      <td>${u.s||'—'}</td>
      ${hasACM?`<td>${u.m||'—'}</td>`:''}
    </tr>`).join('');

  const det = document.getElementById('detail');
  det.className = 'show';
  det.innerHTML = `
    <div class="detail-hdr">
      <span style="font-size:11px;font-family:monospace;color:var(--muted)">${p.pid}</span>
      ${p.name}
      ${p.priorYear?'<span class="badge prior">Prior Year</span>':''}
      <button class="close-btn" onclick="closeDetail()">✕ close</button>
    </div>
    <div class="stats-row">${statsHtml}</div>
    <div class="section-title">📧 Recent Emails (${signals.length})</div>
    <div class="thread-list">${threadsHtml}</div>
    <div class="section-title">📋 All Units (${total})</div>
    <div class="unit-table-wrap">
      <table>
        <thead><tr><th>Address</th><th>Segment</th><th>Status</th>${thACM}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
  det.scrollIntoView({behavior:'smooth', block:'start'});
}

function closeDetail() {
  document.getElementById('detail').className = '';
  document.querySelectorAll('.card').forEach(c=>c.classList.remove('active'));
}

function renderActions() {
  const el = document.getElementById('actionList');
  el.innerHTML = ACTION_ITEMS.map(a=>`
    <div class="action-item" onclick="showDetail('${a.pid}')">
      <span class="ai-pri ${a.pri}">${a.pri}</span>
      <span style="font-size:14px">${a.icon}</span>
      <div class="ai-text">${a.text}</div>
      <div class="ai-pid">${a.pid} · ${a.src}</div>
    </div>`).join('');
}
