<title>LCA Project Command Center</title>
<style>
:root{color-scheme:light}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f1f5f9;color:#0f172a;font-size:13px;min-height:100vh}
.hdr{background:#1e3a5f;color:#fff;padding:11px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.hdr-l{display:flex;align-items:center;gap:11px}
.lcabadge{background:#38bdf8;color:#0c1a2e;font-weight:900;font-size:10px;padding:3px 8px;border-radius:4px;letter-spacing:.5px}
.hdrtitle{font-size:14px;font-weight:700}
.hdr-r{display:flex;align-items:center;gap:12px;font-size:11px;color:#94a3b8}
.snap{color:#cbd5e1;font-size:11px}
.gpill{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);padding:3px 10px;border-radius:12px;font-size:11px;color:#cbd5e1;cursor:pointer;transition:background .15s;white-space:nowrap}
.gpill:hover{background:rgba(255,255,255,.18)}.gpill.ok{color:#6ee7b7;border-color:rgba(110,231,183,.3)}.gpill.err{color:#fca5a5;border-color:rgba(252,165,165,.3)}
.page{padding:16px 20px;max-width:1080px;margin:0 auto}
.slabel{font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px}
.card{background:#fff;border-radius:10px;border:1px solid #e2e8f0;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06)}
table{width:100%;border-collapse:collapse}
thead th{background:#f8fafc;padding:9px 13px;text-align:left;font-size:10px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid #e2e8f0}
tbody tr{cursor:pointer;transition:background .08s;border-bottom:1px solid #f1f5f9}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:#f8fafc}
td{padding:9px 13px;vertical-align:middle}
.pid{font-size:10px;font-weight:700;color:#94a3b8;letter-spacing:.04em}
.pname{font-weight:700;color:#0f172a;font-size:13px}
.ptype{font-size:10px;color:#94a3b8;margin-top:1px}
.pybadge{display:inline-block;background:#fff7ed;color:#c2410c;border:1px solid #fed7aa;font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;margin-left:5px;vertical-align:middle}
.pipewrap{min-width:170px}
.pipebar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:#f1f5f9;gap:1px}
.pseg{height:100%;min-width:3px}
.pleg{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.plegitem{display:flex;align-items:center;gap:3px;font-size:10px;color:#64748b}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.chips{display:flex;flex-wrap:wrap;gap:3px}
.chip{font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;white-space:nowrap}
.cs{background:#dbeafe;color:#1d4ed8}.cf{background:#fef3c7;color:#92400e}.cr{background:#ede9fe;color:#5b21b6}.cd{background:#d1fae5;color:#065f46}
.pct{font-size:15px;font-weight:800}
.pthin{height:3px;background:#e2e8f0;border-radius:2px;margin-top:3px;width:55px}
.pfill{height:100%;border-radius:2px}
.ebadge{display:none;align-items:center;gap:3px;font-size:10px;font-weight:700;color:#ea580c;background:#fff7ed;border:1px solid #fdba74;padding:2px 8px;border-radius:10px}
.ebadge.on{display:inline-flex}
.aigrid{display:flex;flex-direction:column;gap:7px}
.aicard{display:flex;align-items:flex-start;gap:10px;background:#fff;border:1px solid #e2e8f0;border-left:4px solid #f59e0b;border-radius:0 8px 8px 0;padding:10px 14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.aicard.hi{border-left-color:#ef4444}.aicard.md{border-left-color:#f59e0b}.aicard.lo{border-left-color:#3b82f6}
.aiicon{font-size:17px;line-height:1;flex-shrink:0}
.aitxt{font-size:12px;color:#1e293b;line-height:1.55}
.aisrc{font-size:10px;color:#94a3b8;margin-top:3px}
.dvhdr{background:#fff;border-bottom:1px solid #e2e8f0;padding:12px 20px;display:flex;align-items:center;gap:13px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.backbtn{background:#f1f5f9;border:1px solid #e2e8f0;color:#475569;cursor:pointer;padding:5px 12px;border-radius:6px;font-size:12px;font-weight:600;transition:all .1s}
.backbtn:hover{background:#e2e8f0;color:#0f172a}
.dvtitle{font-size:16px;font-weight:800;color:#0f172a}
.dvmeta{font-size:11px;color:#94a3b8;margin-top:2px}
.dvstats{display:flex;gap:10px;padding:12px 20px;background:#f8fafc;border-bottom:1px solid #e2e8f0;flex-wrap:wrap}
.stat{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:9px 15px;text-align:center;min-width:68px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.statv{font-size:21px;font-weight:900}
.statl{font-size:10px;color:#94a3b8;text-transform:uppercase;letter-spacing:.06em;margin-top:1px}
.dvbody{padding:16px 20px}
.tcard{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:10px 13px;margin-bottom:7px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.tsub{font-weight:700;color:#0f172a;font-size:12px}
.tmeta{font-size:10px;color:#94a3b8;margin-top:2px}
.tsnip{font-size:11px;color:#64748b;margin-top:4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.nothreads{color:#94a3b8;font-size:12px;text-align:center;padding:14px;font-style:italic}
.ucard{background:#fff;border-radius:8px;border:1px solid #e2e8f0;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04);max-height:460px;overflow-y:auto}
.utbl{width:100%;border-collapse:collapse}
.utbl thead th{background:#f8fafc;padding:8px 13px;text-align:left;font-size:10px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid #e2e8f0;position:sticky;top:0}
.utbl tbody tr{border-bottom:1px solid #f8fafc;transition:background .08s}
.utbl tbody tr:last-child{border-bottom:none}
.utbl tbody tr:hover td{background:#f8fafc}
.utbl td{padding:7px 13px;font-size:12px;color:#334155}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700}
.pS{background:#dbeafe;color:#1d4ed8}.pF{background:#fef3c7;color:#92400e}.pR{background:#ede9fe;color:#5b21b6}.pD{background:#d1fae5;color:#065f46}

let gsig={},curPid=null;
function sg(st){return SEG[st]||"S"}
function cnt(units){const c={S:0,F:0,R:0,D:0};for(const u of units)c[sg(u.s)]++;return c}
function prg(units){if(!units.length)return 0;return Math.round(units.filter(u=>sg(u.s)==="D").length/units.length*100)}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function pc(p){return p>=75?"#10b981":p>=40?"#f59e0b":"#64748b"}
function pipebar(c,t){if(!t)return`<div style="flex:1;background:#e2e8f0;border-radius:4px"></div>`;return["S","F","R","D"].filter(k=>c[k]>0).map(k=>`<div class="pseg" style="flex:${c[k]};background:${SC[k]}"></div>`).join("");}

function renderTable(){
  let html="",tot=0;
  for(const p of PROJECTS){
    const c=cnt(p.units),t=p.units.length,pv=prg(p.units);tot+=t;
    const sigs=gsig[p.id]||[];
    html+=`<tr onclick="openDetail('${p.id}')"><td><div class="pid">${esc(p.id)}</div><div class="pname">${esc(p.name)}${p.py?'<span class="pybadge">Prior Yr</span>':''}</div><div class="ptype">${esc(p.type)}</div></td><td><div class="pipewrap"><div class="pipebar">${pipebar(c,t)}</div><div class="pleg">${["S","F","R","D"].filter(k=>c[k]>0).map(k=>`<span class="plegitem"><span class="dot" style="background:${SC[k]}"></span>${c[k]} ${SL[k]}</span>`).join("")}</div></div></td><td><div class="chips">${c.S?`<span class="chip cs">${c.S} Setup</span>`:""} ${c.F?`<span class="chip cf">${c.F} Field</span>`:""} ${c.R?`<span class="chip cr">${c.R} Rpt</span>`:""} ${c.D?`<span class="chip cd">${c.D} Done</span>`:""}</div></td><td><div class="pct" style="color:${pc(pv)}">${pv}%</div><div class="pthin"><div class="pfill" style="width:${pv}%;background:${pc(pv)}"></div></div></td><td><span class="ebadge${sigs.length?" on":""}" id="eb-${p.id}">📧 ${sigs.length}</span></td></tr>`;
  }
  document.getElementById("ptbody").innerHTML=html;
  document.getElementById("tblmeta").textContent=`Active Projects · ${PROJECTS.length} projects · ${tot} units tracked`;
}

function renderAI(){
  document.getElementById("ailist").innerHTML=ACTION_ITEMS.map(a=>`<div class="aicard ${a.pri}"><span class="aiicon">${a.icon}</span><div><div class="aitxt">${esc(a.text)}</div><div class="aisrc">${esc(a.src)}${a.pid?` · ${a.pid}`:""}</div></div></div>`).join("");
  document.getElementById("aimeta").textContent=`Action Items · ${ACTION_ITEMS.length}`;
}

function openDetail(pid){
  const p=PROJECTS.find(x=>x.id===pid);if(!p)return;curPid=pid;
  const c=cnt(p.units),t=p.units.length,pv=prg(p.units),sigs=gsig[pid]||[];
  document.getElementById("dvtitle").textContent=`${p.id} · ${p.name}`;
  document.getElementById("dvmeta").textContent=`${p.type}${p.py?" · Prior Year (active email signals)":""}`;
  document.getElementById("dvstats").innerHTML=["S","F","R","D"].map(k=>`<div class="stat"><div class="statv" style="color:${SC[k]}">${c[k]}</div><div class="statl">${SL[k]}</div></div>`).join("")+`<div class="stat"><div class="statv" style="color:${pc(pv)}">${pv}%</div><div class="statl">Complete</div></div><div class="stat"><div class="statv">${t}</div><div class="statl">Total</div></div><div class="stat"><div class="statv" style="color:${sigs.length?"#ea580c":"#94a3b8"}">${sigs.length}</div><div class="statl">Email Signals</div></div>`;
  document.getElementById("dvthreads").innerHTML=sigs.length?sigs.map(th=>`<div class="tcard"><div class="tsub">${esc(th.subject)}</div><div class="tmeta">${esc(th.sender)} · ${th.date?new Date(th.date).toLocaleDateString():""}</div><div class="tsnip">${esc(th.snippet)}</div></div>`).join(""):`<div class="nothreads">No recent Gmail threads matched for ${pid}</div>`;
  const ha=p.acm,hl=p.acmLabel||"ACM";
  document.getElementById("uthead").innerHTML=`<tr><th>Address</th><th>Status</th><th>Stage</th>${ha?`<th>${esc(hl)}</th>`:""}</tr>`;
  document.getElementById("utbody").innerHTML=p.units.map(u=>{const s=sg(u.s);let ac="";if(ha){const mv=u.m||"";if(mv==="Yes")ac=`<td><span class="acmY">Yes ⚠</span></td>`;else if(mv==="No")ac=`<td><span class="acmN">No</span></td>`;else if(mv==="✓")ac=`<td><span class="acmX">✓ Done</span></td>`;else ac=`<td><span class="acmU">–</span></td>`;}return`<tr><td>${esc(u.a)}</td><td><span class="pill ${SP[s]}">${esc(u.s)}</span></td><td style="color:#94a3b8;font-size:11px">${SL[s]}</td>${ac}</tr>`;}).join("");
  document.getElementById("vtable").style.display="none";document.getElementById("vdetail").style.display="block";window.scrollTo(0,0);
}
