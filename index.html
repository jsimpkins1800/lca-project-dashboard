  return c;
}
function pct(units) {
  if (!units.length) return 0;
  return Math.round(units.filter(u=>u.g==='Done').length/units.length*100);
}

const PID_RE = /\b2[4-6]-\d{3}\b/;
const NAME_MAP = {
  'new london':'26-001','newport':'26-002','earle':'26-003','lakehurst':'26-004',
  'charleston':'26-005','fort jackson':'26-006','fort detrick':'26-007',
  'fort eustis':'26-009','usma':'26-010','minot':'26-024','portsmouth':'26-025',
  'fort carson':'24-101','grand forks':'26-999','carlisle':'26-998','red bank':'26-997'
};

function matchPid(text) {
  const t = (text||'').toLowerCase();
  const m = (text||'').match(PID_RE);
  if (m) return m[0];
  for (const [k,v] of Object.entries(NAME_MAP)) {
    if (t.includes(k)) return v;
  }
  return null;
}

async function fetchLiveEmail() {
  if (!window.cowork) return;
  try {
    const res = await window.cowork.callMcpTool(
      'mcp__67d183fc-6aa9-4a14-9fa5-be0bb1098825__search_threads',
      { query: 'newer_than:14d', pageSize: 50 }
    );
    const threads = (res && res.threads) ? res.threads : [];
    const fresh = {};
    threads.forEach(t => {
      const msgs = t.messages || [];
      const last = msgs[msgs.length-1];
      if (!last) return;
      const pid = matchPid(last.subject + ' ' + (last.snippet||''));
      if (!pid) return;
      if (!fresh[pid]) fresh[pid] = [];
      fresh[pid].push({
        subject: last.subject,
        snippet: (last.snippet||'').substring(0,120),
        sender: last.sender,
        date: (last.date||'').substring(0,10)
      });
    });
    for (const [pid, sigs] of Object.entries(fresh)) {
      liveSignals[pid] = sigs;
    }
    renderGrid();
  } catch(e) {
    console.warn('Live email fetch failed:', e);
  }
}

function renderCard(p) {
  const counts = segCounts(p.units);
  const total = p.units.length;
  const done = pct(p.units);
  const signals = (liveSignals[p.pid]||[]).length;
  const segs = SEG_ORDER.filter(s=>counts[s]>0);
  
  let barHtml = SEG_ORDER.map(s => {
    const w = total ? (counts[s]||0)/total*100 : 0;
    return w>0 ? `<span style="width:${w}%;background:${SEG_COLORS[s]}"></span>` : '';
  }).join('');
  
  let chips = segs.map(s=>`<span class="chip ${s}">${s} ${counts[s]}</span>`).join('');
  if (signals) chips += `<span class="email-pill">✉ ${signals}</span>`;
  if (p.priorYear) chips += `&nbsp;<span class="badge prior" style="font-size:9px">PY</span>`;

  return `<div class="card" id="card-${p.pid}" onclick="showDetail('${p.pid}')">
    <div class="card-hdr">
      <span class="pid">${p.pid}</span>
      <span class="cname">${p.name}</span>
      <span class="pct">${done}%</span>
    </div>
    <div class="bar">${barHtml}</div>
    <div class="chips">${chips}</div>
    <div style="font-size:10px;color:var(--muted)">${total} units</div>
  </div>`;
}

function renderGrid() {
  document.getElementById('projectGrid').innerHTML = PROJECTS.map(renderCard).join('');
}

let activeDetail = null;
function showDetail(pid) {
  activeDetail = pid;
  const p = PROJECTS.find(x=>x.pid===pid);
  if (!p) return;
  document.querySelectorAll('.card').forEach(c=>c.classList.remove('active'));
  const card = document.getElementById('card-'+pid);
  if (card) card.classList.add('active');
  
  const counts = segCounts(p.units);
  const total = p.units.length;
  const done = pct(p.units);
  const signals = liveSignals[pid]||[];
  
  const statsHtml = ['Setup','Field','Reporting','Done'].map(s=>`
    <div class="stat-box">
      <div class="stat-val ${s==='Setup'?'blue':s==='Field'?'amber':s==='Reporting'?'purple':'green'}">${counts[s]||0}</div>
      <div class="stat-lbl">${s}</div>
    </div>`).join('') + `<div class="stat-box"><div class="stat-val green">${done}%</div><div class="stat-lbl">Complete</div></div>`;

  const threadsHtml = signals.length ? signals.map(t=>`
    <div class="thread">
      <div class="thread-subj">${t.subject}</div>
      <div class="thread-meta">${t.sender} · ${t.date}</div>
      <div class="thread-snip">${t.snippet}</div>
    </div>`).join('') : '<div class="no-data">No recent emails</div>';

  const hasACM = p.acmLabel && p.units.some(u=>'m' in u);
  let thACM = hasACM ? `<th>${p.acmLabel}</th>` : '';
  let rows = p.units.map(u=>`
    <tr>
      <td>${u.a}</td>
      <td><span class="seg-badge seg-${u.g}">${u.g}</span></td>
      <td>${u.s||'—'}</td>
      ${hasACM?`<td>${u.m||'—'}</td>`:''}
    </tr>`).join('');

  const det = document.getElementById('detail');
  det.className = 'show';
  det.innerHTML = `
    <div class="detail-hdr">
      <span style="font-size:11px;font-family:monospace;color:var(--muted)">${p.pid}</span>
      ${p.name}
      ${p.priorYear?'<span class="badge prior">Prior Year</span>':''}
      <button class="close-btn" onclick="closeDetail()">✕ close</button>
    </div>
    <div class="stats-row">${statsHtml}</div>
    <div class="section-title">📧 Recent Emails (${signals.length})</div>
    <div class="thread-list">${threadsHtml}</div>
    <div class="section-title">📋 All Units (${total})</div>
    <div class="unit-table-wrap">
      <table>
        <thead><tr><th>Address</th><th>Segment</th><th>Status</th>${thACM}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
  det.scrollIntoView({behavior:'smooth', block:'start'});
}

function closeDetail() {
  activeDetail = null;
  document.getElementById('detail').className = '';
  document.querySelectorAll('.card').forEach(c=>c.classList.remove('active'));
}

function renderActions() {
  const el = document.getElementById('actionList');
  el.innerHTML = ACTION_ITEMS.map(a=>`
    <div class="action-item" onclick="showDetail('${a.pid}')">
      <div class="ai-row">
        <span class="ai-pri ${a.pri}">${a.pri}</span>
        <span style="font-size:14px">${a.icon}</span>
        <div>
          <div class="ai-text">${a.text}</div>
          <div class="ai-pid">${a.pid} · ${a.src}</div>
        </div>
      </div>
    </div>`).join('');
}

renderGrid();
renderActions();
fetchLiveEmail();
</script>
</body>
</html>
