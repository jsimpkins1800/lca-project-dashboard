<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LCA Project Command Center</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f1117;color:#e2e8f0;min-height:100vh}
  .header{background:linear-gradient(135deg,#1e2533 0%,#16213e 100%);padding:16px 24px;display:flex;align-items:center;gap:16px;border-bottom:1px solid #2d3748}
  .header h1{font-size:20px;font-weight:700;color:#fff}
  .header .meta{font-size:12px;color:#718096;margin-left:auto;display:flex;gap:12px;align-items:center}
  .badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:12px;font-size:11px;font-weight:600}
  .badge-blue{background:#1e40af22;color:#60a5fa;border:1px solid #1e40af}
  .badge-green{background:#06652222;color:#34d399;border:1px solid #065f46}
  .badge-amber{background:#92400e22;color:#fbbf24;border:1px solid #92400e}
  .badge-purple{background:#6b21a822;color:#c084fc;border:1px solid #6b21a8}
  .badge-gray{background:#37415122;color:#9ca3af;border:1px solid #374151}
  .badge-red{background:#7f1d1d22;color:#f87171;border:1px solid #7f1d1d}
  .main{display:grid;grid-template-columns:1fr 320px;gap:0;height:calc(100vh - 58px)}
  .left{padding:16px;overflow-y:auto}
  .right{background:#1a1f2e;border-left:1px solid #2d3748;padding:16px;overflow-y:auto}
  .section-title{font-size:13px;font-weight:600;color:#9ca3af;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
  .project-grid{display:grid;gap:10px}
  .project-card{background:#1e2533;border:1px solid #2d3748;border-radius:10px;padding:14px;cursor:pointer;transition:all .15s;position:relative}
  .project-card:hover{border-color:#4a5568;background:#242b3d}
  .project-card.active{border-color:#3b82f6;background:#1e2d47}
  .project-card .top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .project-card .pid{font-size:11px;color:#6b7280;font-family:monospace}
  .project-card .name{font-size:14px;font-weight:600;color:#e2e8f0}
  .project-card .email-badge{margin-left:auto;background:#7c3aed22;color:#c084fc;border:1px solid #7c3aed44;padding:2px 6px;border-radius:8px;font-size:11px}
  .pipeline{display:flex;height:6px;border-radius:3px;overflow:hidden;gap:1px;margin-bottom:8px}
  .seg-setup{background:#3b82f6}
  .seg-field{background:#f59e0b}
  .seg-reporting{background:#8b5cf6}
  .seg-done{background:#10b981}
  .seg-empty{background:#2d3748}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{font-size:11px;padding:2px 7px;border-radius:10px;font-weight:500}
  .chip-setup{background:#1e40af22;color:#93c5fd}
  .chip-field{background:#92400e22;color:#fcd34d}
  .chip-reporting{background:#5b21b622;color:#c084fc}
  .chip-done{background:#06520022;color:#6ee7b7}
  .pct{font-size:11px;color:#6b7280;margin-left:auto}
  .prior-badge{position:absolute;top:10px;right:10px;background:#374151;color:#9ca3af;font-size:10px;padding:2px 6px;border-radius:6px}
  
  /* Detail panel */
  .detail{display:none}
  .detail.open{display:block}
  .detail-header{margin-bottom:12px}
  .detail-name{font-size:16px;font-weight:700;color:#fff;margin-bottom:4px}
  .detail-pid{font-size:12px;color:#6b7280;font-family:monospace}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
  .stat-card{background:#242b3d;border-radius:8px;padding:10px}
  .stat-card .val{font-size:22px;font-weight:700;color:#fff}
  .stat-card .lbl{font-size:11px;color:#6b7280;margin-top:2px}
  .email-list{margin-bottom:14px}
  .email-item{background:#242b3d;border-radius:6px;padding:8px 10px;margin-bottom:6px;border-left:3px solid #7c3aed}
  .email-item .subj{font-size:12px;font-weight:600;color:#e2e8f0;margin-bottom:3px}
  .email-item .snip{font-size:11px;color:#9ca3af;line-height:1.4}
  .email-item .meta{font-size:10px;color:#6b7280;margin-top:3px}
  .unit-table{width:100%;border-collapse:collapse;font-size:11px}
  .unit-table th{color:#9ca3af;text-align:left;padding:4px 6px;border-bottom:1px solid #2d3748;font-weight:500}
  .unit-table td{padding:3px 6px;border-bottom:1px solid #1a1f2e;color:#d1d5db}
  .unit-table tr:hover td{background:#242b3d}
  .seg-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}
  .dot-setup{background:#3b82f6}
  .dot-field{background:#f59e0b}
  .dot-reporting{background:#8b5cf6}
  .dot-done{background:#10b981}
  
  /* Actions panel */
  .action-item{display:flex;gap:8px;padding:8px;background:#1e2533;border-radius:6px;margin-bottom:6px;border-left:3px solid transparent}
  .action-item.hi{border-color:#ef4444}
  .action-item.md{border-color:#f59e0b}
  .action-item.lo{border-color:#374151}
  .action-item .icon{font-size:14px;flex-shrink:0}
  .action-item .text{font-size:12px;color:#d1d5db;line-height:1.4}
  .action-item .src{font-size:10px;color:#6b7280;margin-top:2px}
  
  .overview-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
  .ov-stat{background:#1e2533;border-radius:8px;padding:10px;text-align:center}
  .ov-stat .val{font-size:20px;font-weight:700}
  .ov-stat .lbl{font-size:10px;color:#6b7280;margin-top:2px}
  .ov-stat.blue .val{color:#60a5fa}
  .ov-stat.amber .val{color:#fbbf24}
  .ov-stat.purple .val{color:#c084fc}
  .ov-stat.green .val{color:#34d399}
  
  .tabs{display:flex;gap:2px;margin-bottom:12px;background:#0f1117;border-radius:8px;padding:3px}
  .tab{flex:1;text-align:center;padding:6px;font-size:12px;border-radius:6px;cursor:pointer;color:#6b7280;transition:all .15s}
  .tab.active{background:#1e2533;color:#e2e8f0;font-weight:600}
  
  .gmail-live-section{margin-bottom:12px;padding:10px;background:#1a1f2e;border-radius:8px;border:1px solid #2d3748}
  .gmail-pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#34d399;background:#06520022;border:1px solid #065f4644;padding:3px 8px;border-radius:10px;cursor:pointer}
  .gmail-pill.static{color:#6b7280;background:#37415122;border-color:#37415144;cursor:default}
</style>

function segDotClass(seg) {
  return {Setup:'dot-setup',Field:'dot-field',Reporting:'dot-reporting',Done:'dot-done'}[seg] || '';
}
function chipClass(seg) {
  return {Setup:'chip-setup',Field:'chip-field',Reporting:'chip-reporting',Done:'chip-done'}[seg] || '';
}

function renderOverviewStats() {
  const segs = {Setup:0,Field:0,Reporting:0,Done:0};
  let totalUnits = 0;
  PROJECTS.forEach(p => {
    if (!p.isPrior) {
      Object.entries(p.segs).forEach(([k,v]) => { segs[k] = (segs[k]||0)+v; totalUnits += v; });
    }
  });
  document.getElementById('overview-stats').innerHTML = `
    <div class="ov-stat blue"><div class="val">${segs.Setup}</div><div class="lbl">Setup</div></div>
    <div class="ov-stat amber"><div class="val">${segs.Field}</div><div class="lbl">Field</div></div>
    <div class="ov-stat purple"><div class="val">${segs.Reporting}</div><div class="lbl">Reporting</div></div>
    <div class="ov-stat green"><div class="val">${segs.Done}</div><div class="lbl">Done</div></div>
  `;
}

function renderPipeline(p) {
  const t = p.total || 1;
  const segs = ['Setup','Field','Reporting','Done'];
  return segs.map(s => {
    const w = Math.round((p.segs[s]||0)/t*100);
    return w > 0 ? `<div class="seg-${s.toLowerCase()}" style="flex:${w}"></div>` : '';
  }).join('') + `<div class="seg-empty" style="flex:${100 - Object.values(p.segs).reduce((a,b)=>a+b,0)/t*100}"></div>`;
}

function renderProjectGrid() {
  const grid = document.getElementById('project-grid');
  grid.innerHTML = PROJECTS.map(p => `
    <div class="project-card${p.isPrior?' prior':''}${activeProject===p.id?' active':''}" onclick="openDetail('${p.id}')">
      ${p.isPrior ? '<span class="prior-badge">Prior Year</span>' : ''}
      <div class="top">
        <span class="pid">${p.id}</span>
        <span class="name">${p.name}</span>
        ${p.emailCount > 0 ? `<span class="email-badge">✉ ${p.emailCount}</span>` : ''}
      </div>
      <div class="pipeline">${renderPipeline(p)}</div>
      <div class="chips">
        ${Object.entries(p.segs).filter(([,v])=>v>0).map(([s,v])=>`<span class="chip chip-${s.toLowerCase()}">${v} ${s}</span>`).join('')}
        <span class="pct">${p.pct}% done</span>
      </div>
    </div>
  `).join('');
}

function openDetail(pid) {
  activeProject = pid;
  const p = PROJECTS.find(x=>x.id===pid);
  if (!p) return;
  document.getElementById('overview-panel').style.display = 'none';
  document.getElementById('detail-panel').className = 'detail open';
  document.getElementById('d-name').textContent = `${p.id} — ${p.name}`;
  document.getElementById('d-pid').textContent = p.isPrior ? 'Prior Year Project' : 'Active Project';
  document.getElementById('d-stats').innerHTML = `
    <div class="stat-card"><div class="val">${p.total}</div><div class="lbl">Total Units</div></div>
    <div class="stat-card"><div class="val">${p.pct}%</div><div class="lbl">Complete</div></div>
    <div class="stat-card"><div class="val" style="color:#f59e0b">${p.segs.Field||0}</div><div class="lbl">In Field</div></div>
    <div class="stat-card"><div class="val" style="color:#8b5cf6">${p.segs.Reporting||0}</div><div class="lbl">Reporting</div></div>
  `;
  renderUnitTable(p);
  renderEmailTab(p);
}

function closeDetail() {
  activeProject = null;
  document.getElementById('overview-panel').style.display = 'block';
  document.getElementById('detail-panel').className = 'detail';
}

function setTab(tab, el) {
  activeTab = tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('tab-units').style.display = tab==='units'?'block':'none';
  document.getElementById('tab-emails').style.display = tab==='emails'?'block':'none';
}

function renderUnitTable(p) {
  const hasAcm = p.hasAcm;
  const rows = p.units.map(u => `
    <tr>
      <td>${u.a}</td>
      <td><span class="seg-dot ${segDotClass(u.g)}"></span>${u.s || u.g}</td>
      ${hasAcm ? `<td>${u.m||''}</td>` : ''}
    </tr>
  `).join('');
  document.getElementById('tab-units').innerHTML = `
    <div style="max-height:400px;overflow-y:auto">
    <table class="unit-table">
      <thead><tr>
        <th>Address</th><th>Status</th>${hasAcm?`<th>${p.acmLabel}</th>`:''}
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
    </div>
  `;
}

function renderEmailTab(p) {
  if (!p.emails || p.emails.length === 0) {
    document.getElementById('tab-emails').innerHTML = '<div style="color:#6b7280;font-size:12px;padding:8px">No recent emails found for this project.</div>';
    return;
  }
  document.getElementById('tab-emails').innerHTML = p.emails.map(e => `
    <div class="email-item">
      <div class="subj">${e.subject}</div>
      <div class="snip">${e.snippet}</div>
      <div class="meta">${e.sender} · ${e.date}</div>
    </div>
  `).join('');
}

function renderActionItems() {
  document.getElementById('action-items-list').innerHTML = ACTION_ITEMS.map(a => `
    <div class="action-item ${a.pri}" onclick="${a.pid ? `openDetail('${a.pid}')` : ''}">
      <span class="icon">${a.icon}</span>
      <div>
        <div class="text">${a.text}</div>
        <div class="src">${a.src}${a.pid?' · '+a.pid:''}</div>
      </div>
    </div>
  `).join('');
}

async function loadGmailLive() {
  const pill = document.getElementById('gmail-pill');
  const content = document.getElementById('gmail-live-content');
  if (typeof window.cowork === 'undefined') return;
  pill.textContent = '⟳ Loading...';
  try {
    const result = await window.cowork.callMcpTool(
      'mcp__67d183fc-6aa9-4a14-9fa5-be0bb1098825__search_threads',
      {query:'newer_than:7d', pageSize:20}
    );
    const threads = result?.threads || [];
    content.innerHTML = threads.slice(0,8).map(t => {
      const msg = t.messages?.[0] || {};
      return `<div style="padding:5px 0;border-bottom:1px solid #2d3748">
        <div style="color:#e2e8f0;font-size:11px;font-weight:600">${msg.subject||'(no subject)'}</div>
        <div style="color:#9ca3af;font-size:10px">${msg.sender||''} · ${(msg.date||'').split('T')[0]}</div>
      </div>`;
    }).join('') || '<div style="color:#6b7280">No threads found</div>';
    pill.textContent = `✓ ${threads.length} threads`;
    pill.style.color = '#34d399';
  } catch(e) {
    content.innerHTML = '<div style="color:#6b7280;font-size:11px">Unable to load live Gmail</div>';
    pill.textContent = '⚠ Error';
  }
}

// Init
renderOverviewStats();
renderProjectGrid();
renderActionItems();
</script>
</body>
</html>
