<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LCA Project Command Center</title>
<style>
  :root {
    --blue:#3b82f6;--amber:#f59e0b;--purple:#8b5cf6;--green:#10b981;
    --red:#ef4444;--gray:#6b7280;--bg:#0f172a;--card:#1e293b;
    --border:#334155;--text:#f1f5f9;--sub:#94a3b8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
  .header{background:var(--card);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
  .header h1{font-size:18px;font-weight:700;letter-spacing:.3px}
  .header-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .badge{font-size:11px;padding:3px 8px;border-radius:999px;font-weight:600}
  .badge-blue{background:#1d4ed8;color:#bfdbfe}
  .badge-gray{background:#374151;color:#d1d5db;cursor:default}
  .badge-amber{background:#92400e;color:#fde68a}
  .content{display:flex;height:calc(100vh - 53px)}
  .sidebar{width:300px;min-width:260px;border-right:1px solid var(--border);overflow-y:auto;background:var(--card)}
  .main{flex:1;overflow-y:auto;padding:20px}
  .section-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--sub);padding:12px 16px 6px}
  .proj-row{display:flex;align-items:center;padding:10px 16px;gap:10px;cursor:pointer;border-left:3px solid transparent;transition:all .15s}
  .proj-row:hover{background:#263245}
  .proj-row.active{background:#1a2942;border-left-color:var(--blue)}
  .proj-row.prior{opacity:.75}
  .proj-info{flex:1;min-width:0}
  .proj-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .proj-id{font-size:11px;color:var(--sub)}
  .proj-meta{display:flex;align-items:center;gap:6px}
  .email-badge{font-size:10px;background:#1d4ed8;color:#bfdbfe;padding:2px 6px;border-radius:999px;font-weight:700}
  .email-badge.zero{background:#374151;color:#6b7280}
  .pct-bar{width:100%;height:4px;background:#334155;border-radius:2px;margin-top:4px}
  .pct-fill{height:4px;border-radius:2px;background:var(--green)}
  /* main view */
  .proj-header{margin-bottom:20px}
  .proj-header h2{font-size:22px;font-weight:700}
  .proj-header .sub{color:var(--sub);font-size:13px;margin-top:4px}
  .stats-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
  .stat-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px 18px;flex:1;min-width:120px}
  .stat-card .val{font-size:28px;font-weight:700}
  .stat-card .lbl{font-size:11px;color:var(--sub);margin-top:2px;text-transform:uppercase;letter-spacing:.5px}
  .pipeline{display:flex;gap:0;border-radius:8px;overflow:hidden;margin-bottom:20px;border:1px solid var(--border)}
  .seg{flex:1;padding:10px;text-align:center;font-size:12px;font-weight:600;cursor:pointer;transition:opacity .15s}
  .seg.Setup{background:#1e3a5f;color:var(--blue)}
  .seg.Field{background:#3d2800;color:var(--amber)}
  .seg.Reporting{background:#2e1065;color:var(--purple)}
  .seg.Done{background:#052e16;color:var(--green)}
  .seg .count{font-size:20px;font-weight:800;display:block}
  .seg:hover{opacity:.8}
  .email-section{margin-bottom:20px}
  .email-section h3{font-size:13px;font-weight:700;margin-bottom:10px;color:var(--sub);text-transform:uppercase;letter-spacing:.5px}
  .email-card{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:12px;margin-bottom:8px}
  .email-subject{font-size:13px;font-weight:600;margin-bottom:3px}
  .email-meta{font-size:11px;color:var(--sub)}
  .email-snippet{font-size:12px;color:#94a3b8;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .unit-table-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{background:#0f172a;color:var(--sub);text-align:left;padding:8px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);position:sticky;top:0}
  td{padding:8px 12px;border-bottom:1px solid #1e293b}
  tr:hover td{background:#1a2942}
  .seg-chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:700}
  .seg-chip.Setup{background:#1e3a5f;color:var(--blue)}
  .seg-chip.Field{background:#3d2800;color:var(--amber)}
  .seg-chip.Reporting{background:#2e1065;color:var(--purple)}
  .seg-chip.Done{background:#052e16;color:var(--green)}
  /* action items */
  .action-board{margin-top:20px}
  .action-board h3{font-size:14px;font-weight:700;margin-bottom:12px}
  .action-item{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:10px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;font-size:13px}
  .action-item.hi{border-left:3px solid var(--red)}
  .action-item.md{border-left:3px solid var(--amber)}
  .action-item.lo{border-left:3px solid var(--green)}
  .loading{color:var(--sub);padding:20px;text-align:center;font-size:13px}
  .prior-tag{font-size:10px;background:#374151;color:#9ca3af;padding:1px 5px;border-radius:3px;margin-left:4px}
</style>
</head>

function segCounts(units) {
  const c = {Setup:0,Field:0,Reporting:0,Done:0};
  units.forEach(u => { if(c[u.seg]!==undefined) c[u.seg]++; });
  return c;
}
function pct(units) {
  const done = units.filter(u=>u.seg==='Done').length;
  return units.length ? Math.round(done/units.length*100) : 0;
}

// Build sidebar
function buildSidebar() {
  const sb = document.getElementById('sidebar');
  const active26 = PROJECTS.filter(p=>!p.prior);
  const prior = PROJECTS.filter(p=>p.prior);

  let html = '<div class="section-label">Active Projects</div>';
  active26.forEach((p,i) => {
    const sc = segCounts(p.units);
    const pctDone = pct(p.units);
    const emailCls = p.emailCount > 0 ? '' : ' zero';
    html += `<div class="proj-row${i===0?' active':''}" onclick="selectProject('${p.pid}')" id="row-${p.pid}">
      <div class="proj-info">
        <div style="display:flex;align-items:center;gap:6px">
          <span class="proj-name">${p.name}</span>
        </div>
        <div class="proj-id">${p.pid}</div>
        <div class="pct-bar"><div class="pct-fill" style="width:${pctDone}%"></div></div>
      </div>
      <div class="proj-meta">
        <span class="email-badge${emailCls}">${p.emailCount}✉</span>
      </div>
    </div>`;
  });

  if(prior.length) {
    html += '<div class="section-label">Prior Year</div>';
    prior.forEach(p => {
      const pctDone = pct(p.units);
      html += `<div class="proj-row prior" onclick="selectProject('${p.pid}')" id="row-${p.pid}">
        <div class="proj-info">
          <div style="display:flex;align-items:center;gap:6px">
            <span class="proj-name">${p.name}</span><span class="prior-tag">PY</span>
          </div>
          <div class="proj-id">${p.pid}</div>
          <div class="pct-bar"><div class="pct-fill" style="width:${pctDone}%"></div></div>
        </div>
        <div class="proj-meta">
          <span class="email-badge${p.emailCount>0?'':' zero'}">${p.emailCount}✉</span>
        </div>
      </div>`;
    });
  }

  html += '<div class="section-label">Action Items</div>';
  ACTION_ITEMS.filter(a=>a.pri==='hi').forEach(a => {
    html += `<div style="padding:8px 16px;font-size:12px;border-left:3px solid var(--red);margin:2px 0;cursor:pointer" onclick="selectProject('${a.pid}')">${a.icon} ${a.text.substring(0,60)}…</div>`;
  });

  sb.innerHTML = html;
}

let currentPid = null;
let gmailData = {};

function selectProject(pid) {
  currentPid = pid;
  document.querySelectorAll('.proj-row').forEach(r => r.classList.remove('active'));
  const row = document.getElementById('row-'+pid);
  if(row) row.classList.add('active');
  renderProject(pid, gmailData[pid]||[]);
}

function renderProject(pid, emails) {
  const p = PROJECTS.find(x=>x.pid===pid);
  if(!p) return;
  const sc = segCounts(p.units);
  const pctDone = pct(p.units);
  const actions = ACTION_ITEMS.filter(a=>a.pid===pid);

  let html = `
    <div class="proj-header">
      <h2>${p.name}${p.prior?' <span class="prior-tag">Prior Year</span>':''}</h2>
      <div class="sub">${p.pid} · ${p.units.length} units · ${pctDone}% complete · ${p.emailCount} email threads (14d)</div>
    </div>
    <div class="stats-row">
      <div class="stat-card"><div class="val" style="color:var(--blue)">${sc.Setup}</div><div class="lbl">Setup</div></div>
      <div class="stat-card"><div class="val" style="color:var(--amber)">${sc.Field}</div><div class="lbl">Field</div></div>
      <div class="stat-card"><div class="val" style="color:var(--purple)">${sc.Reporting}</div><div class="lbl">Reporting</div></div>
      <div class="stat-card"><div class="val" style="color:var(--green)">${sc.Done}</div><div class="lbl">Done</div></div>
      <div class="stat-card"><div class="val">${pctDone}%</div><div class="lbl">Complete</div></div>
    </div>
    <div class="pipeline">
      <div class="seg Setup"><span class="count">${sc.Setup}</span>Setup</div>
      <div class="seg Field"><span class="count">${sc.Field}</span>Field</div>
      <div class="seg Reporting"><span class="count">${sc.Reporting}</span>Reporting</div>
      <div class="seg Done"><span class="count">${sc.Done}</span>Done</div>
    </div>
  `;

  if(actions.length) {
    html += `<div class="action-board"><h3>⚡ Action Items</h3>`;
    actions.forEach(a => {
      html += `<div class="action-item ${a.pri}">${a.icon} ${a.text}</div>`;
    });
    html += `</div>`;
  }

  if(emails.length) {
    html += `<div class="email-section"><h3>📧 Recent Email Threads</h3>`;
    emails.forEach(e => {
      html += `<div class="email-card">
        <div class="email-subject">${e.subject||'(no subject)'}</div>
        <div class="email-meta">From: ${e.sender} · ${e.date?new Date(e.date).toLocaleDateString():''}</div>
        <div class="email-snippet">${e.snippet||''}</div>
      </div>`;
    });
    html += `</div>`;
  }

  html += `<div style="margin-top:20px"><h3 style="font-size:13px;font-weight:700;margin-bottom:10px">Units (${p.units.length})</h3>
    <div class="unit-table-wrap"><table>
      <tr><th>Address</th><th>Status</th><th>Stage</th>${p.hasAcm?'<th>'+p.acmLabel+'</th>':''}${p.isWater?'<th>Notes</th>':''}</tr>`;
  p.units.forEach(u => {
    html += `<tr>
      <td>${u.a||'—'}</td>
      <td>${u.s||'—'}</td>
      <td><span class="seg-chip ${u.seg}">${u.seg}</span></td>
      ${p.hasAcm?`<td>${u.m||'—'}</td>`:''}
      ${p.isWater?`<td>${u.m||'—'}</td>`:''}
    </tr>`;
  });
  html += `</table></div></div>`;

  document.getElementById('main').innerHTML = html;
}
