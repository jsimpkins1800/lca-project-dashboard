<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LCA Project Command Center</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f1117;color:#e2e8f0;min-height:100vh}
.header{background:linear-gradient(135deg,#1e2433,#252d3d);padding:14px 20px;border-bottom:1px solid #2d3748;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.header h1{font-size:17px;font-weight:700;color:#fff;letter-spacing:-.3px}
.header-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{font-size:11px;padding:3px 9px;border-radius:12px;font-weight:600}
.badge-blue{background:#1e3a5f;color:#63b3ed}
.badge-green{background:#1a3a2a;color:#68d391}
.badge-gray{background:#2d3748;color:#a0aec0}
.date-badge{font-size:11px;color:#718096}

.main{display:flex;height:calc(100vh - 52px)}
.sidebar{width:300px;min-width:280px;background:#161b27;border-right:1px solid #2d3748;overflow-y:auto;flex-shrink:0}
.content{flex:1;overflow-y:auto;padding:16px}

.sidebar-section{border-bottom:1px solid #2d3748}
.sidebar-section-title{font-size:11px;font-weight:700;color:#718096;text-transform:uppercase;letter-spacing:.6px;padding:10px 14px 6px}
.proj-item{padding:10px 14px;cursor:pointer;border-left:3px solid transparent;transition:all .15s}
.proj-item:hover{background:#1e2433;border-left-color:#4a90d9}
.proj-item.active{background:#1e2433;border-left-color:#4a90d9}
.proj-name{font-size:13px;font-weight:600;color:#e2e8f0;display:flex;align-items:center;gap:6px}
.proj-id{font-size:11px;color:#718096;margin-top:2px}
.proj-chips{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
.chip{font-size:10px;padding:2px 6px;border-radius:8px;font-weight:600}
.chip-setup{background:#2d3748;color:#a0aec0}
.chip-field{background:#1a2f4a;color:#63b3ed}
.chip-reporting{background:#2d1f4a;color:#b794f4}
.chip-done{background:#1a3a2a;color:#68d391}
.email-dot{width:8px;height:8px;border-radius:50%;background:#f6ad55;flex-shrink:0}
.pct-bar{height:3px;background:#2d3748;border-radius:2px;margin-top:6px;overflow:hidden}
.pct-fill{height:100%;background:linear-gradient(90deg,#3182ce,#805ad5);border-radius:2px;transition:width .3s}

.actions-list{padding:8px 0}
.action-item{padding:8px 14px;display:flex;gap:8px;align-items:flex-start}
.action-icon{font-size:14px;flex-shrink:0;margin-top:1px}
.action-text{font-size:12px;color:#cbd5e0;line-height:1.4}
.action-meta{font-size:10px;color:#718096;margin-top:2px}
.pri-hi .action-text{color:#fc8181}
.pri-md .action-text{color:#fbd38d}

.detail-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.detail-title{font-size:20px;font-weight:700;color:#fff}
.detail-sub{font-size:12px;color:#718096;margin-top:3px}
.stat-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-bottom:16px}
.stat-card{background:#1e2433;border:1px solid #2d3748;border-radius:8px;padding:12px;text-align:center}
.stat-val{font-size:24px;font-weight:700;color:#fff}
.stat-label{font-size:11px;color:#718096;margin-top:2px}
.stat-setup .stat-val{color:#a0aec0}
.stat-field .stat-val{color:#63b3ed}
.stat-reporting .stat-val{color:#b794f4}
.stat-done .stat-val{color:#68d391}

.pipeline-bar{display:flex;height:28px;border-radius:6px;overflow:hidden;margin-bottom:16px;gap:1px}
.pipe-seg{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;transition:flex .3s;min-width:0;overflow:hidden;white-space:nowrap;padding:0 4px}
.pipe-setup{background:#4a5568}
.pipe-field{background:#2b6cb0}
.pipe-reporting{background:#6b46c1}
.pipe-done{background:#276749}

.section-title{font-size:13px;font-weight:700;color:#a0aec0;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid #2d3748}
.email-threads{margin-bottom:16px}
.email-thread{background:#1e2433;border:1px solid #2d3748;border-radius:6px;padding:10px;margin-bottom:6px}
.email-subj{font-size:13px;font-weight:600;color:#e2e8f0}
.email-snip{font-size:11px;color:#718096;margin-top:3px;line-height:1.4}
.email-meta{font-size:10px;color:#4a5568;margin-top:4px}

.units-table{width:100%;border-collapse:collapse;font-size:12px}
.units-table th{text-align:left;padding:6px 8px;background:#1e2433;color:#718096;font-weight:600;font-size:11px;position:sticky;top:0}
.units-table td{padding:6px 8px;border-bottom:1px solid #1e2433;color:#cbd5e0}
.units-table tr:hover td{background:#1e2433}
.seg-badge{font-size:10px;padding:2px 6px;border-radius:8px;font-weight:600;display:inline-block}
.seg-Setup{background:#2d3748;color:#a0aec0}
.seg-Field{background:#1a2f4a;color:#63b3ed}
.seg-Reporting{background:#2d1f4a;color:#b794f4}
.seg-Done{background:#1a3a2a;color:#68d391}
.prior-badge{font-size:10px;padding:2px 6px;border-radius:8px;background:#2d2014;color:#f6ad55;margin-left:6px}

.gmail-loading{font-size:12px;color:#718096;padding:8px 14px}
.no-select{display:flex;align-items:center;justify-content:center;height:200px;color:#4a5568;font-size:14px;text-align:center}
</style>
</head>
<body>

<div class="header">
  <h1>🏗 LCA Project Command Center</h1>
  <div class="header-meta">
    <span class="badge badge-blue" id="proj-count">— projects</span>
    <span class="badge badge-green" id="active-count">— active</span>
    <span class="badge badge-gray" id="gmail-badge">Static snapshot · May 12, 2026</span>
    <span class="date-badge">Live xlsx data · May 12, 2026</span>
  </div>
</div>

<div class="main">
  <div class="sidebar">
    <div class="sidebar-section" id="projects-list">

    </div>
    <div class="sidebar-section">
      <div class="sidebar-section-title">Action Items</div>
      <div class="actions-list" id="actions-list"></div>
    </div>
  </div>
  <div class="content" id="main-content">
    <div class="no-select">← Select a project to view details</div>
  </div>
</div>

const SEG_ORDER = ["Setup","Field","Reporting","Done"];
const SEG_COLORS = {Setup:"#4a5568",Field:"#2b6cb0",Reporting:"#6b46c1",Done:"#276749"};

let gmailData = {};
let selectedPid = null;

function countSegs(units){
  const c={Setup:0,Field:0,Reporting:0,Done:0};
  units.forEach(u=>{ if(c[u.g]!==undefined) c[u.g]++; else c.Setup++; });
  return c;
}

function pctDone(units){
  if(!units.length) return 0;
  return Math.round(units.filter(u=>u.g==="Done").length/units.length*100);
}

function renderSidebar(){
  const list = document.getElementById("projects-list");
  list.innerHTML = '<div class="sidebar-section-title">Projects</div>';

  const active = PROJECTS.filter(p=>p.units.length>0 && p.units.some(u=>u.g!=="Done"));
  document.getElementById("proj-count").textContent = PROJECTS.length+" projects";
  document.getElementById("active-count").textContent = active.length+" active";

  PROJECTS.forEach(p=>{
    const segs = countSegs(p.units);
    const pct = pctDone(p.units);
    const hasEmail = gmailData[p.pid] && gmailData[p.pid].length>0;
    const emailCount = hasEmail ? gmailData[p.pid].length : 0;

    const div = document.createElement("div");
    div.className = "proj-item" + (p.pid===selectedPid?" active":"");
    div.onclick = ()=>selectProject(p.pid);

    let chips = "";
    if(segs.Setup) chips += `<span class="chip chip-setup">${segs.Setup} Setup</span>`;
    if(segs.Field) chips += `<span class="chip chip-field">${segs.Field} Field</span>`;
    if(segs.Reporting) chips += `<span class="chip chip-reporting">${segs.Reporting} Rpt</span>`;
    if(segs.Done) chips += `<span class="chip chip-done">${segs.Done} Done</span>`;

    div.innerHTML = `
      <div class="proj-name">
        <span>${p.name}</span>
        ${p.priorYear?'<span class="prior-badge">Prior Yr</span>':""}
        ${hasEmail?`<span class="email-dot" title="${emailCount} email thread(s)"></span>`:""}
      </div>
      <div class="proj-id">${p.pid} · ${p.units.length} units · ${pct}% done</div>
      <div class="proj-chips">${chips}</div>
      <div class="pct-bar"><div class="pct-fill" style="width:${pct}%"></div></div>
    `;
    list.appendChild(div);
  });
}

function renderActions(){
  const list = document.getElementById("actions-list");
  if(!ACTION_ITEMS.length){
    list.innerHTML = '<div class="gmail-loading">No action items</div>';
    return;
  }
  list.innerHTML = "";
  ACTION_ITEMS.slice(0,15).forEach(item=>{
    const div = document.createElement("div");
    div.className = `action-item pri-${item.pri}`;
    div.innerHTML = `
      <span class="action-icon">${item.icon}</span>
      <div>
        <div class="action-text">${item.text}</div>
        <div class="action-meta">${item.pid} · ${item.src}</div>
      </div>`;
    list.appendChild(div);
  });
}

  SEG_ORDER.forEach(seg=>{
    const cnt = segs[seg]||0;
    const flex = total>0 ? Math.max(cnt/total*100,3) : 25;
    if(cnt>0) pipeHtml += `<div class="pipe-seg pipe-${seg.toLowerCase()}" style="flex:${flex}" title="${seg}: ${cnt}">${cnt}</div>`;
  });

  // Stat cards
  const statCards = SEG_ORDER.map(seg=>`
    <div class="stat-card stat-${seg.toLowerCase()}">
      <div class="stat-val">${segs[seg]||0}</div>
      <div class="stat-label">${seg}</div>
    </div>`).join("") + `
    <div class="stat-card">
      <div class="stat-val" style="color:#f6ad55">${pct}%</div>
      <div class="stat-label">Complete</div>
    </div>`;

  // Email threads
  let emailHtml = "";
  if(threads.length){
    emailHtml = `<div class="email-threads"><div class="section-title">📧 Recent Email (${threads.length} threads)</div>`;
    threads.forEach(t=>{
      const d = t.date ? t.date.substring(0,10) : "";
      emailHtml += `<div class="email-thread">
        <div class="email-subj">${escHtml(t.subject)}</div>
        <div class="email-snip">${escHtml(t.snippet)}</div>
        <div class="email-meta">From: ${escHtml(t.sender)} · ${d}</div>
      </div>`;
    });
    emailHtml += "</div>";
  }

  // Units table
  const hasAcm = p.acmLabel && p.units.some(u=>u.m!==undefined);
  let tableRows = "";
  p.units.forEach((u,i)=>{
    const acmCell = hasAcm ? `<td>${escHtml(u.m||"")}</td>` : "";
    tableRows += `<tr>
      <td>${i+1}</td>
      <td>${escHtml(u.a)}</td>
      <td><span class="seg-badge seg-${u.g}">${u.g}</span></td>
      <td>${escHtml(u.s)}</td>
      ${acmCell}
    </tr>`;
  });

  const acmHeader = hasAcm ? `<th>${escHtml(p.acmLabel)}</th>` : "";

  document.getElementById("main-content").innerHTML = `
    <div class="detail-header">
      <div>
        <div class="detail-title">${escHtml(p.name)} ${p.priorYear?'<span class="prior-badge">Prior Year</span>':""}</div>
        <div class="detail-sub">${p.pid} · ${total} units</div>
      </div>
    </div>
    <div class="stat-cards">${statCards}</div>
    <div class="section-title" style="margin-bottom:8px">Pipeline</div>
    <div class="pipeline-bar" style="margin-bottom:16px">${pipeHtml||'<div class="pipe-seg pipe-setup" style="flex:1">No data</div>'}</div>
    ${emailHtml}
    <div class="section-title">Units (${total})</div>
    <div style="overflow-x:auto;margin-top:8px">
      <table class="units-table">
        <thead><tr><th>#</th><th>Address / Unit</th><th>Stage</th><th>Status</th>${acmHeader}</tr></thead>
        <tbody>${tableRows}</tbody>
      </table>
    </div>`;
}

function escHtml(str){
  return String(str||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

async function loadGmail(){
  try {
    const result = await window.cowork.callMcpTool(
      "mcp__67d183fc-6aa9-4a14-9fa5-be0bb1098825__search_threads",
      { query:"newer_than:14d (26-001 OR 26-002 OR 26-003 OR 26-004 OR 26-005 OR 26-006 OR 26-007 OR 26-009 OR 26-010 OR 26-011 OR 26-024 OR 26-025 OR 24-101 OR \"new london\" OR \"newport\" OR \"earle\" OR \"lakehurst\" OR \"charleston\" OR \"fort jackson\" OR \"fort detrick\" OR \"fort eustis\" OR \"usma\" OR \"minot\" OR \"portsmouth\" OR \"fort carson\")", pageSize:50 }
    );

    const PID_RE = /\b(2[4-6]-\d{3})\b/g;
    const NAME_MAP = {"new london":"26-001","newport":"26-002","earle":"26-003","lakehurst":"26-004","charleston":"26-005","fort jackson":"26-006","fort detrick":"26-007","fort eustis":"26-009","usma":"26-010","minot":"26-024","portsmouth":"26-025","fort carson":"24-101"};

    const threads = (result && result.threads) ? result.threads : [];
    gmailData = {};
    threads.forEach(thread=>{
      const msgs = thread.messages||[];
      if(!msgs.length) return;
      const last = msgs[msgs.length-1];
      const subject = last.subject||"";
      const snippet = last.snippet||"";
      const combined = (subject+" "+snippet).toLowerCase();
      const matched = new Set();
      let m;
      const text = subject+" "+snippet;
      PID_RE.lastIndex=0;
      while((m=PID_RE.exec(text))!==null) matched.add(m[1]);
      for(const [name,pid] of Object.entries(NAME_MAP)){
        if(combined.includes(name)) matched.add(pid);
      }
      matched.forEach(pid=>{
        if(!gmailData[pid]) gmailData[pid]=[];
        gmailData[pid].push({subject,snippet:snippet.substring(0,120),sender:last.sender||"",date:last.date||""});
      });
    });

    const total = threads.length;
    const pids = Object.keys(gmailData).length;
    document.getElementById("gmail-badge").textContent = `${total} emails · ${pids} projects`;
    document.getElementById("gmail-badge").style.background = "#1a3a2a";
    document.getElementById("gmail-badge").style.color = "#68d391";
    renderSidebar();
    if(selectedPid) selectProject(selectedPid);
  } catch(e){
    document.getElementById("gmail-badge").textContent = "Email unavailable";
  }
}

// Init
renderSidebar();
renderActions();
if(PROJECTS.length>0) selectProject(PROJECTS[0].pid);
document.getElementById("gmail-badge").textContent = "Static snapshot · May 12, 2026"; document.getElementById("gmail-badge").style.cursor="default";
</script>
