<style>
  :root {
    --bg: #0f172a;
    --surface: #1e293b;
    --surface2: #334155;
    --border: #475569;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --blue: #3b82f6;
    --amber: #f59e0b;
    --purple: #a855f7;
    --green: #22c55e;
    --red: #ef4444;
    --blue-dim: rgba(59,130,246,0.15);
    --amber-dim: rgba(245,158,11,0.15);
    --purple-dim: rgba(168,85,247,0.15);
    --green-dim: rgba(34,197,94,0.15);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* HEADER */
  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
  .header-title { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
  .header-title span { color: var(--blue); }
  .header-meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .badge { font-size: 11px; padding: 3px 9px; border-radius: 20px; font-weight: 600; }
  .badge-blue { background: var(--blue-dim); color: var(--blue); border: 1px solid var(--blue); }
  .badge-green { background: var(--green-dim); color: var(--green); border: 1px solid var(--green); }
  .badge-amber { background: var(--amber-dim); color: var(--amber); border: 1px solid var(--amber); }
  .badge-muted { background: var(--surface2); color: var(--muted); }
  .snap-date { font-size: 11px; color: var(--muted); }

  /* SUMMARY BAR */
  .summary-bar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }
  .stat-pill { display: flex; align-items: center; gap: 6px; }
  .stat-pill .dot { width: 10px; height: 10px; border-radius: 50%; }
  .stat-pill .label { font-size: 12px; color: var(--muted); }
  .stat-pill .val { font-size: 13px; font-weight: 600; }
  .total-badge { font-size: 14px; font-weight: 700; color: var(--text); margin-left: auto; }

  /* LAYOUT */
  .layout { display: flex; height: calc(100vh - 110px); overflow: hidden; }
  .sidebar { width: 320px; min-width: 260px; overflow-y: auto; border-right: 1px solid var(--border); background: var(--surface); }
  .main { flex: 1; overflow-y: auto; padding: 16px; background: var(--bg); }

  /* PROJECT CARDS */
  .proj-card { padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.1s; }
  .proj-card:hover { background: var(--surface2); }
  .proj-card.active { background: var(--blue-dim); border-left: 3px solid var(--blue); }
  .proj-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .proj-name { font-size: 13px; font-weight: 600; }
  .proj-pid { font-size: 10px; color: var(--muted); }
  .proj-badges { display: flex; gap: 4px; align-items: center; }
  .email-badge { font-size: 10px; padding: 1px 6px; border-radius: 10px; background: var(--blue-dim); color: var(--blue); font-weight: 600; }
  .prior-badge { font-size: 10px; padding: 1px 6px; border-radius: 10px; background: var(--surface2); color: var(--muted); }

  /* PIPELINE BAR */
  .pipe-bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; margin-bottom: 6px; background: var(--surface2); }
  .pipe-seg { height: 100%; transition: width 0.3s; }
  .seg-setup { background: var(--blue); }
  .seg-field { background: var(--amber); }
  .seg-reporting { background: var(--purple); }
  .seg-done { background: var(--green); }

  /* UNIT CHIPS */
  .unit-chips { display: flex; gap: 4px; flex-wrap: wrap; }
  .chip { font-size: 10px; padding: 1px 7px; border-radius: 10px; font-weight: 500; }
  .chip-setup { background: var(--blue-dim); color: var(--blue); }
  .chip-field { background: var(--amber-dim); color: var(--amber); }
  .chip-reporting { background: var(--purple-dim); color: var(--purple); }
  .chip-done { background: var(--green-dim); color: var(--green); }
  .pct-text { font-size: 10px; color: var(--muted); margin-left: auto; }

  /* DETAIL VIEW */
  .detail-header { margin-bottom: 16px; }
  .detail-title { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .detail-sub { font-size: 13px; color: var(--muted); }
  .stat-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px,1fr)); gap: 10px; margin-bottom: 20px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px; text-align: center; }
  .stat-card .sc-val { font-size: 24px; font-weight: 700; }
  .stat-card .sc-label { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .stat-card.sc-setup { border-top: 3px solid var(--blue); }
  .stat-card.sc-field { border-top: 3px solid var(--amber); }
  .stat-card.sc-reporting { border-top: 3px solid var(--purple); }
  .stat-card.sc-done { border-top: 3px solid var(--green); }

  /* EMAIL THREADS */
  .section-title { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; margin-top: 20px; }
  .thread-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 8px; }
  .thread-subj { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .thread-meta { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
  .thread-snip { font-size: 12px; color: #cbd5e1; line-height: 1.4; }
  .no-threads { font-size: 13px; color: var(--muted); font-style: italic; padding: 10px 0; }

  /* UNIT TABLE */
  .unit-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
  .unit-table th { text-align: left; padding: 6px 10px; background: var(--surface2); color: var(--muted); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; position: sticky; top: 0; }
  .unit-table td { padding: 6px 10px; border-bottom: 1px solid var(--border); color: var(--text); }
  .unit-table tr:hover td { background: var(--surface); }
  .seg-pill { font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 600; white-space: nowrap; }

  /* ACTION ITEMS */
  .action-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
  .action-item { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; display: flex; align-items: flex-start; gap: 10px; }
  .action-icon { font-size: 16px; flex-shrink: 0; }
  .action-text { font-size: 13px; line-height: 1.4; }
  .action-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .pri-hi { border-left: 3px solid var(--red); }
  .pri-md { border-left: 3px solid var(--amber); }
  .pri-lo { border-left: 3px solid var(--blue); }

  /* GMAIL LOADING */
  .gmail-loading { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .spinner { width: 12px; height: 12px; border: 2px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* OVERVIEW */
  .overview-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(280px,1fr)); gap: 12px; }
  .overview-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px; cursor: pointer; transition: border-color 0.15s; }
  .overview-card:hover { border-color: var(--blue); }

  /* TABS */
  .tabs { display: flex; gap: 2px; margin-bottom: 16px; background: var(--surface); border-radius: 8px; padding: 3px; width: fit-content; }
  .tab { padding: 6px 16px; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; color: var(--muted); transition: all 0.15s; }
  .tab.active { background: var(--surface2); color: var(--text); }

  .scrollable-table { max-height: 400px; overflow-y: auto; border-radius: 8px; border: 1px solid var(--border); }
</style>
</head>

function segPillClass(seg) {
  return {Setup:'chip-setup',Field:'chip-field',Reporting:'chip-reporting',Done:'chip-done'}[seg]||'';
}

function pipeBar(seg, total) {
  const segs = ['Setup','Field','Reporting','Done'];
  const cls = ['seg-setup','seg-field','seg-reporting','seg-done'];
  return segs.map((s,i) => {
    const w = total ? (seg[s]||0)/total*100 : 0;
    return `<div class="pipe-seg ${cls[i]}" style="width:${w}%"></div>`;
  }).join('');
}

function fmtDate(iso) {
  if (!iso) return '';
  try { return new Date(iso).toLocaleDateString('en-US',{month:'short',day:'numeric'}); } catch(e){ return iso.slice(0,10); }
}

// ── Sidebar ─────────────────────────────────────────────
let activeCard = null;
function renderSidebar(liveEmails) {
  const sb = document.getElementById('sidebar');
  sb.innerHTML = '';
  PROJECTS.forEach(p => {
    const total = Object.values(p.seg).reduce((a,b)=>a+b,0);
    const emailCt = liveEmails ? (liveEmails[p.pid]||[]).length : p.emails;
    const div = document.createElement('div');
    div.className = 'proj-card' + (activeCard===p.pid?' active':'');
    div.innerHTML = `
      <div class="proj-top">
        <div>
          <div class="proj-name">${p.name} ${p.priorYear?'<span class="prior-badge">Prior Yr</span>':''}</div>
          <div class="proj-pid">${p.pid}</div>
        </div>
        <div class="proj-badges">
          ${emailCt>0?`<span class="email-badge">✉ ${emailCt}</span>`:''}
        </div>
      </div>
      <div class="pipe-bar">${pipeBar(p.seg,total)}</div>
      <div style="display:flex;align-items:center;gap:4px">
        <div class="unit-chips">
          ${p.seg.Setup?`<span class="chip chip-setup">🔧 ${p.seg.Setup}</span>`:''}
          ${p.seg.Field?`<span class="chip chip-field">🔬 ${p.seg.Field}</span>`:''}
          ${p.seg.Reporting?`<span class="chip chip-reporting">📄 ${p.seg.Reporting}</span>`:''}
          ${p.seg.Done?`<span class="chip chip-done">✓ ${p.seg.Done}</span>`:''}
        </div>
        <span class="pct-text">${p.pct}%</span>
      </div>`;
    div.onclick = () => showDetail(p.pid, liveEmails);
    sb.appendChild(div);
  });
}

// ── Detail view ──────────────────────────────────────────
function showDetail(pid, liveEmails) {
  activeCard = pid;
  const p = PROJECTS.find(x=>x.pid===pid);
  if (!p) return;
  renderSidebar(liveEmails);

  const threads = liveEmails ? (liveEmails[pid]||[]) : p.threads;
  const total = Object.values(p.seg).reduce((a,b)=>a+b,0);
  const hasAcm = p.acmLabel && p.acmLabel.length > 0;

  const threadHtml = threads.length === 0
    ? `<div class="no-threads">No recent email threads found for this project.</div>`
    : threads.slice(0,6).map(t=>`
      <div class="thread-card">
        <div class="thread-subj">${t.subject||'(no subject)'}</div>
        <div class="thread-meta">From: ${t.sender||'—'} · ${fmtDate(t.date)}</div>
        <div class="thread-snip">${(t.snippet||'').slice(0,180)}</div>
      </div>`).join('');

  const unitRows = p.units.slice(0,200).map(u=>`
    <tr>
      <td>${u.addr||''}</td>
      <td><span class="seg-pill ${segPillClass(u.seg)}" style="background:none;color:${segColor(u.seg)};font-weight:600">${u.seg}</span></td>
      <td style="color:var(--muted)">${u.status||''}</td>
      ${hasAcm?`<td style="text-align:center">${u.m||''}</td>`:''}
    </tr>`).join('');

  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="detail-header">
      <div class="detail-title">${p.name} ${p.priorYear?'<span class="badge badge-muted" style="font-size:12px;vertical-align:middle">Prior Year</span>':''}</div>
      <div class="detail-sub">${p.pid} · ${total} units · ${p.pct}% complete</div>
    </div>

    <div class="stat-cards">
      <div class="stat-card sc-setup"><div class="sc-val" style="color:var(--blue)">${p.seg.Setup||0}</div><div class="sc-label">Setup</div></div>
      <div class="stat-card sc-field"><div class="sc-val" style="color:var(--amber)">${p.seg.Field||0}</div><div class="sc-label">Field</div></div>
      <div class="stat-card sc-reporting"><div class="sc-val" style="color:var(--purple)">${p.seg.Reporting||0}</div><div class="sc-label">Reporting</div></div>
      <div class="stat-card sc-done"><div class="sc-val" style="color:var(--green)">${p.seg.Done||0}</div><div class="sc-label">Done</div></div>
    </div>

    <div class="section-title">Recent Emails</div>
    ${threadHtml}

    <div class="section-title">Units (${Math.min(p.units.length,200)}${p.units.length>200?' shown':''})</div>
    <div class="scrollable-table">
      <table class="unit-table">
        <thead><tr>
          <th>Address / Unit</th><th>Segment</th><th>Status</th>
          ${hasAcm?`<th>${p.acmLabel}</th>`:''}
        </tr></thead>
        <tbody>${unitRows}</tbody>
      </table>
    </div>
  `;
}

// ── Overview (home) ──────────────────────────────────────
function showOverview(liveEmails) {
  activeCard = null;
  renderSidebar(liveEmails);

  const projCards = PROJECTS.map(p => {
    const total = Object.values(p.seg).reduce((a,b)=>a+b,0);
    const emailCt = liveEmails ? (liveEmails[p.pid]||[]).length : p.emails;
    return `
      <div class="overview-card" onclick="showDetail('${p.pid}', currentLiveEmails)">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">
          <div>
            <div style="font-size:14px;font-weight:700">${p.name}</div>
            <div style="font-size:11px;color:var(--muted)">${p.pid} · ${total} units</div>
          </div>
          ${emailCt>0?`<span class="email-badge">✉ ${emailCt}</span>`:''}
        </div>
        <div class="pipe-bar" style="height:10px;margin-bottom:8px">${pipeBar(p.seg,total)}</div>
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div class="unit-chips">
            ${p.seg.Field?`<span class="chip chip-field">Field: ${p.seg.Field}</span>`:''}
            ${p.seg.Reporting?`<span class="chip chip-reporting">Rpt: ${p.seg.Reporting}</span>`:''}
          </div>
          <span style="font-size:12px;font-weight:700;color:var(--green)">${p.pct}%</span>
        </div>
      </div>`;
  }).join('');

  const actionHtml = ACTION_ITEMS.length === 0
    ? '<p style="color:var(--muted);font-size:13px">No action items at this time.</p>'
    : ACTION_ITEMS.map(a=>`
      <div class="action-item pri-${a.pri}">
        <span class="action-icon">${a.icon}</span>
        <div>
          <div class="action-text">${a.text}</div>
          <div class="action-meta">${a.src} · ${a.pid}</div>
        </div>
      </div>`).join('');

  document.getElementById('main').innerHTML = `
    <div class="tabs">
      <div class="tab active">Overview</div>
    </div>

    <div class="section-title">Action Items</div>
    <div class="action-list">${actionHtml}</div>

    <div class="section-title">All Projects</div>
    <div class="overview-grid">${projCards}</div>
  `;
}

// ── Live Gmail fetch ─────────────────────────────────────
let currentLiveEmails = null;
const PID_RE = /\b2[4-6]-\d{3}\b/g;
const NAME_MAP = {
  'fort carson':'24-101','new london':'26-001','newport':'26-002',
  'earle':'26-003','lakehurst':'26-004','charleston':'26-005',
  'fort jackson':'26-006','fort detrick':'26-007','fort eustis':'26-009',
  'usma':'26-010','minot':'26-024','portsmouth':'26-025'
};

async function fetchLiveEmails() {
  try {
    const result = await window.cowork.callMcpTool(
      'mcp__67d183fc-6aa9-4a14-9fa5-be0bb1098825__search_threads',
      {query: 'newer_than:14d', pageSize: 50}
    );
    const threads = (result && result.threads) ? result.threads : [];
    const live = {};
    threads.forEach(t => {
      t.messages.forEach(msg => {
        const text = ((msg.subject||'') + ' ' + (msg.snippet||'')).toLowerCase();
        const matched = new Set();
        ((msg.subject||'')+' '+(msg.snippet||'')).replace(PID_RE, m => matched.add(m));
        Object.entries(NAME_MAP).forEach(([nm, pid]) => { if (text.includes(nm)) matched.add(pid); });
        matched.forEach(pid => {
          if (!live[pid]) live[pid] = [];
          live[pid].push({subject:msg.subject, snippet:msg.snippet, sender:msg.sender, date:msg.date});
        });
      });
    });
    currentLiveEmails = live;
    const totalEmails = Object.values(live).reduce((a,b)=>a+b.length,0);
    // document.getElementById('gmail-status').innerHTML = `<span style="color:var(--green);font-size:11px;font-weight:600">✉ ${totalEmails} emails (live)</span>`;
    renderSidebar(live);
    if (activeCard) showDetail(activeCard, live);
  } catch(e) {
    // document.getElementById('gmail-status').innerHTML = `<span style="color:var(--muted);font-size:11px">Gmail unavailable</span>`;
  }
}

// ── Init ─────────────────────────────────────────────────
showOverview(null);
// static snapshot - no live Gmail fetch
</script>
