const ACTION_ITEMS = [{"pri": "hi", "icon": "\ud83d\udcb8", "text": "Scott: price and schedule 221 Fletcher \u2014 Robert Kirtland asked at 8:32 AM Aug 11 for roof covering and throughout-drywall testing and there is still no reply. WO 10612256 is already issued, so only the price is missing. Every other Charleston request this week turned around inside a day.", "src": "Daily Snapshot Aug 6\u2013Aug 12", "pid": "26-005"}, {"pri": "hi", "icon": "\ud83d\udcc4", "text": "Scott/Rob: send EHC the NY and PA asbestos + lead inspector licenses \u2014 asked Aug 6 \"by tomorrow\", now five days overdue. Expired copies are acceptable. EHC is also the subcontractor staffing Friday's Fort Eustis round, so the same relationship carries both the paperwork and the field coverage.", "src": "Daily Snapshot Aug 6\u2013Aug 12", "pid": "26-009"}, {"pri": "hi", "icon": "\ud83d\udcc5", "text": "Scott: confirm Friday Aug 14 Fort Eustis in writing \u2014 338A 26th Street and 2942B Summerall Circle. POs 1877321 and 1877310 are issued and Tehsin offered the date, but there is no site-side confirmation and no resident access arranged. An unconfirmed Friday is a wasted mobilization.", "src": "Daily Snapshot Aug 6\u2013Aug 12", "pid": "26-009"}, {"pri": "hi", "icon": "\u2620\ufe0f", "text": "Scott: confirm West Point actually received the 532B Winans Road lead-in-water findings. The unit houses a nine-month-old who tested positive for lead. The PDF went out Aug 10 but both copied BBC contacts were on auto-reply that day and nothing has come back. Call Deb Oates rather than waiting.", "src": "Daily Snapshot Aug 6\u2013Aug 12", "pid": "26-010"}, {"pri": "hi", "icon": "\ud83d\udd0d", "text": "Justin: QC coverage is 0 / 9. All nine deliverables sent this window \u2014 including the 532B Winans lead-in-water letter \u2014 never entered Trace as report records at all, and no record org-wide has \"QC\" in its name. There is no retrievable evidence any of them was reviewed before it left.", "src": "Daily Snapshot Aug 6\u2013Aug 12", "pid": null}, {"pri": "md", "icon": "\ud83e\uddfe", "text": "Scott/Rob: answer Rob's two open billing questions \u2014 does 532B Winans Road bill to USMA Renovations or Facilities, and is there a proposal on file for 304D Madison Avenue? Both invoices are already out. The USMA split question has now recurred three times.", "src": "Daily Snapshot Aug 6\u2013Aug 12", "pid": "26-010"}, {"pri": "md", "icon": "\ud83d\udce6", "text": "Rob/Scott: clear the unreturned Balfour Beatty work orders \u2014 WO 10550777 (Aug 6) and WO 10540142 (Aug 4), plus the 18 Bushnell Street WO gap from July. BBC will not release POs or pay invoices without the signed WO, so each one holds up cash.", "src": "Daily Snapshot Aug 6\u2013Aug 12", "pid": "26-005"}, {"pri": "md", "icon": "\ud83d\udcde", "text": "Justin/Scott: settle the Franklin Township NJ radon scope before Christine Woodbury returns Aug 24. Soos Radon has offered Aug 25 or 26 for set-up; Woodbury has no email access until the 24th. Decide whether LCA bids the radon portion and have a written plan waiting for her.", "src": "Daily Snapshot Aug 6\u2013Aug 12", "pid": null}, {"pri": "md", "icon": "\ud83d\uddfa", "text": "Scott/Justin: submit the Grand Forks AFB ESR \u2014 BBC Environmental approved the sampling proposal Jul 28 and asked LCA to coordinate with Gabriel Hayes. Nothing has moved in two weeks. Grand Forks is $1,250/unit against Minot's $875 and is the successor to a wound-down program. Set up the tracker at the same time.", "src": "Daily Snapshot Aug 6\u2013Aug 12", "pid": null}, {"pri": "md", "icon": "\ud83c\udfe5", "text": "Scott: follow up Lower Bucks Hospital while they are still ready to proceed. Dana Cummando said Aug 10 they want to move forward and has gone back to Prime's corporate office. Send two or three abatement referrals and propose LCA for the pre- and post-abatement inspection and clearance scope.", "src": "Daily Snapshot Aug 6\u2013Aug 12", "pid": null}, {"pri": "md", "icon": "\ud83d\udcb5", "text": "Rob: settle the Big East payables \u2014 invoice 26121 ($450, February, never on any remittance) and invoice 26503 ($450, the 273 Ohio Avenue clearance, due Aug 10). Confirm each cheque has a matching LCA invoice behind it, then close the February item with Lindsay Bartlett.", "src": "Daily Snapshot Aug 6\u2013Aug 12", "pid": "26-001"}, {"pri": "md", "icon": "\ud83d\udce5", "text": "Check the mailbox rules \u2014 at least three in-window Balfour Beatty replies carry the TRASH label, including Kirtland's Aug 11 work order chase and Laurie Becker's Aug 10 acknowledgement. If a filter is trashing BBC replies, real requests are being missed.", "src": "Daily Snapshot Aug 6\u2013Aug 12", "pid": null}, {"pri": "md", "icon": "\ud83c\udfe6", "text": "Justin/Rob: send the Paychex ICHRA and HSA administration pricing request. It was drafted Aug 8 with \"let's discuss early next week\"; that week is half gone and a September 1 effective date leaves very little room for carrier set-up.", "src": "Daily Snapshot Aug 6\u2013Aug 12", "pid": null}, {"pri": "md", "icon": "\ud83d\udcc1", "text": "Create unit folders under 26-005 Buildings:Units for the seven Charleston addresses now in play with no folder \u2014 647 Chanticleer, 813 Petrel, 215 Fletcher, 221 Fletcher, 37 Hamilton, 404 Parnassus and 6 Polk. Note 643/646 Chanticleer, 217/233 Fletcher and 818/831 Petrel already exist and are different properties.", "src": "Folder audit Aug 12", "pid": "26-005"}, {"pri": "md", "icon": "\ud83d\udcc1", "text": "Create unit folders for Fort Eustis 338A 26th Street and 2942B Summerall Circle \u2014 both have POs issued and Friday Aug 14 proposed, but neither has a folder. 2946A/2946B Summerall and 307A/327E/339H/345E 26th Street already exist and are different units.", "src": "Folder audit Aug 12", "pid": "26-009"}, {"pri": "lo", "icon": "\u2753", "text": "Scott: confirm whether 215 Fletcher was actually inspected on Aug 10. PO 1876406 was approved Aug 6 but Kirtland had not reached the resident as of Aug 7 and no report has followed. If access failed it needs rescheduling before reports are promised.", "src": "Daily Snapshot Aug 6\u2013Aug 12", "pid": "26-005"}, {"pri": "lo", "icon": "\ud83d\udcdd", "text": "Scott: write up what was agreed at the Aug 11 Fort Carson point-count discussion. Point counting decides whether marginal materials are classified as asbestos-containing, which drives the conclusions in the PHII finals Balfour Beatty has been chasing since April so Tasman can file for the demolition permit.", "src": "Daily Snapshot Aug 6\u2013Aug 12", "pid": "24-101"}, {"pri": "lo", "icon": "\ud83d\uddc2", "text": "Three revenue-bearing sites have folders but no tracker xlsx \u2014 Grand Forks 26-032, Fort Story 26-013 and Picatinny 26-014 (empty Project Tracker folder). LCA invoiced 104 Farley Lane on Aug 11 and sent four Santiago Circle reports Jul 29, so this is live work invisible to the tracker spine.", "src": "Folder audit Aug 12", "pid": null}, {"pri": "lo", "icon": "\ud83d\udcc2", "text": "Create a project folder and number for Franklin Township NJ \u2014 a municipal lead and radon request with named addresses (149 Girard Avenue, 24 Austin Avenue) and no folder, no tracker and no Trace project.", "src": "Folder audit Aug 12", "pid": null}, {"pri": "lo", "icon": "\ud83d\udcea", "text": "Mark the 26-024 Minot tracker closed. Minot is dormant by design \u2014 final invoice May 2026, no Trace project, no email traffic since June \u2014 but all 113 units still read as active Field work, which inflates every rollup.", "src": "Daily Snapshot Aug 6\u2013Aug 12", "pid": "26-024"}, {"pri": "lo", "icon": "\ud83c\udfe6", "text": "Rob: close out the incoming wire fee question. Admin was charged $15 on an incoming wire and asked whether LCA was also charged $30; no fee showed in TD Bank and the thread trails off. Small money, but it is an open reconciliation item.", "src": "Daily Snapshot Aug 6\u2013Aug 12", "pid": null}];

function segCounts(units) {
  const c = {Setup:0,Field:0,Reporting:0,Done:0};
  units.forEach(u => { if(c[u.seg]!==undefined) c[u.seg]++; });
  return c;
}
function pct(units) {
  const done = units.filter(u=>u.seg==='Done').length;
  return units.length ? Math.round(done/units.length*100) : 0;
}

let currentPid = PROJECTS[0].pid;


function buildSidebar() {
  const sb = document.getElementById('sidebar');
  const active = PROJECTS.filter(p=>!p.prior);
  const prior = PROJECTS.filter(p=>p.prior);
  const hiActions = ACTION_ITEMS.filter(a=>a.pri==='hi');

  let html = '<div class="section-label">Active Projects</div>';
  active.forEach((p,i) => {
    const pctDone = pct(p.units);
    html += `<div class="proj-row${p.pid===currentPid?' active':''}" onclick="selectProject('${p.pid}')" id="row-${p.pid}">
      <div class="proj-info">
        <span class="proj-name">${p.name}</span>
        <div class="proj-id">${p.pid}</div>
        <div class="pct-bar"><div class="pct-fill" style="width:${pctDone}%"></div></div>
      </div>
      <div class="proj-meta">
        <span class="email-badge${p.emailCount>0?'':' zero'}">${p.emailCount}✉</span>
      </div>
    </div>`;
  });

  if(prior.length) {
    html += '<div class="section-label">Prior Year</div>';
    prior.forEach(p => {
      const pctDone = pct(p.units);
      html += `<div class="proj-row prior${p.pid===currentPid?' active':''}" onclick="selectProject('${p.pid}')" id="row-${p.pid}">
        <div class="proj-info">
          <div style="display:flex;align-items:center;gap:6px"><span class="proj-name">${p.name}</span><span class="prior-tag">PY</span></div>
          <div class="proj-id">${p.pid}</div>
          <div class="pct-bar"><div class="pct-fill" style="width:${pctDone}%"></div></div>
        </div>
        <div class="proj-meta"><span class="email-badge${p.emailCount>0?'':' zero'}">${p.emailCount}✉</span></div>
      </div>`;
    });
  }

  if(hiActions.length) {
    html += '<div class="section-label" style="color:#ef4444">🔴 High Priority</div>';
    hiActions.forEach(a => {
      html += `<div style="padding:7px 16px;font-size:11px;border-left:3px solid var(--red);background:#1e293b;margin:1px 0;cursor:pointer;line-height:1.4" onclick="selectProject('${a.pid}')">${a.text.substring(0,65)}</div>`;
    });
  }

  sb.innerHTML = html;
}

function selectProject(pid) {
  currentPid = pid;
  buildSidebar();
  renderProject(pid);
}

function renderProject(pid) {
  const p = PROJECTS.find(x=>x.pid===pid);
  if(!p) return;
  const sc = segCounts(p.units);
  const pctDone = pct(p.units);
  const actions = ACTION_ITEMS.filter(a=>a.pid===pid);
  const emails = gmailThreads[pid]||[];

  let html = `
    <div class="proj-header">
      <h2>${p.name}${p.prior?' <span class="prior-tag">Prior Year</span>':''}</h2>
      <div class="sub">${p.pid} · ${p.units.length} units · ${pctDone}% complete · ${p.emailCount} email threads (14d)</div>
    </div>
    <div class="stats-row">
      <div class="stat-card"><div class="val" style="color:var(--blue)">${sc.Setup}</div><div class="lbl">Setup</div></div>
      <div class="stat-card"><div class="val" style="color:var(--amber)">${sc.Field}</div><div class="lbl">Field</div></div>
      <div class="stat-card"><div class="val" style="color:var(--purple)">${sc.Reporting}</div><div class="lbl">Reporting</div></div>
      <div class="stat-card"><div class="val" style="color:var(--green)">${sc.Done}</div><div class="lbl">Done</div></div>
      <div class="stat-card"><div class="val">${pctDone}%</div><div class="lbl">Complete</div></div>
    </div>
    <div class="pipeline">
      <div class="seg Setup"><span class="count">${sc.Setup}</span>Setup</div>
      <div class="seg Field"><span class="count">${sc.Field}</span>Field</div>
      <div class="seg Reporting"><span class="count">${sc.Reporting}</span>Reporting</div>
      <div class="seg Done"><span class="count">${sc.Done}</span>Done</div>
    </div>`;

  if(actions.length) {
    html += `<div class="action-board"><h3>⚡ Action Items</h3>`;
    actions.forEach(a => { html += `<div class="action-item ${a.pri}">${a.icon} ${a.text}</div>`; });
    html += `</div>`;
  }

  if(emails.length) {
    html += `<div class="email-section" style="margin-top:20px"><h3>📧 Recent Email Threads (${emails.length})</h3>`;
    emails.forEach(e => {
      html += `<div class="email-card">
        <div class="email-subject">${e.subject||'(no subject)'}</div>
        <div class="email-meta">From: ${e.sender} · ${e.date?new Date(e.date).toLocaleDateString():''}</div>
        <div class="email-snippet">${e.snippet||''}</div>
      </div>`;
    });
    html += `</div>`;
  }

  html += `<div style="margin-top:20px"><h3 style="font-size:13px;font-weight:700;margin-bottom:10px">Units (${p.units.length})</h3>
    <div class="unit-table-wrap"><table>
      <tr><th>Address</th><th>Status</th><th>Stage</th>${p.hasAcm?'<th>'+p.acmLabel+'</th>':''}${p.isWater?'<th>Notes</th>':''}</tr>`;
  p.units.forEach(u => {
    html += `<tr>
      <td>${u.a||'—'}</td><td>${u.s||'—'}</td>
      <td><span class="seg-chip ${u.seg}">${u.seg}</span></td>
      ${p.hasAcm?`<td>${u.m||'—'}</td>`:''}
      ${p.isWater?`<td>${u.m||'—'}</td>`:''}
    </tr>`;
  });
  html += `</table></div></div>`;

  document.getElementById('main').innerHTML = html;
}

// Boot
buildSidebar();
renderProject(currentPid);

</script>
