const ACTION_ITEMS = [{"pri": "hi", "icon": "📅", "text": "Scott: confirm or release both Friday Aug 14 Fort Eustis slots today — 338A 26th Street and 2942B Summerall Circle. POs 1877321 and 1877310 are already issued, so the work is funded and only the date is missing. Laurie Becker never answered Scott's Aug 10 request and Tehsin Aurangabadwala (EHC Impact) has now chased the same Friday twice with no reply. Two parties are holding tomorrow for LCA.", "src": "Daily Snapshot Aug 13", "pid": "26-009"}, {"pri": "hi", "icon": "💰", "text": "Scott: send Franklin Township a priced estimate now so it is waiting when Christine Woodbury returns Aug 24. She asked for pricing and said a PO would be drawn up before inspection day; Scott sent availability only. Price all four Somerset residences — 149 Girard, 24 Austin, 20 Archer (lead + radon) and 45 Van Doren (lead only) — and copy Soos so the Aug 25/26 slots hold. Only new customer in the window.", "src": "Daily Snapshot Aug 13", "pid": null}, {"pri": "hi", "icon": "📞", "text": "Justin: decide whether LCA self-performs radon on Franklin Township before the estimate goes out. Admin asked on Aug 10 whether Soos is still doing radon at all and said that if not, Christine should be told LCA can. That answer changes the price, the margin and who LCA presents as responsible party on a brand-new municipal account.", "src": "Daily Snapshot Aug 13", "pid": null}, {"pri": "hi", "icon": "📄", "text": "Justin/Scott: answer BBC on striking the Contractual Provisions pages from Lusk SCO 02 (BBC-0095-WP-P2502, covering 78A, 82A and 82B Lusk). Legal will not push the change order through while pages 6–7 and 12–13 remain, on the grounds they were not in the executed PSA. Those pages are LCA's contractual protections — this is a legal decision, and the SCO is stalled meanwhile.", "src": "Daily Snapshot Aug 13", "pid": "26-011"}, {"pri": "hi", "icon": "💸", "text": "Scott: price 221 Fletcher (WO 10612256, asked Aug 11) and 410 Knutson (WO 10594458, asked Aug 12). Both have live work orders and explicit asks for pricing and scheduling, and both are overdue — every other Charleston request this window was priced inside one business day. Offer a combined visit, since the last batch ran as a single Monday trip.", "src": "Daily Snapshot Aug 13", "pid": "26-005"}, {"pri": "hi", "icon": "🔍", "text": "Justin: QC coverage is 0 of 9 again, and Trace logged zero activity of any kind between Aug 7 and Aug 13. None of the nine deliverables sent this window has any Trace report record — not a QC sibling, not even a draft — and no record org-wide contains \"QC\". Decide whether QC records get created in Trace and name who owns it, or say plainly that QC lives elsewhere so the metric can be redefined.", "src": "Daily Snapshot Aug 13", "pid": null}, {"pri": "md", "icon": "🧾", "text": "Rob/Scott: resolve the 78A&B Schofield Place invoice — the report went out July 22 and was never invoiced, and Rob holds a proposal for 78A but not 78B. He also flagged four PLM 198.6 NOB samples billed at $21 by the lab against $31 historically charged in QuickBooks. An invoice and then a revision went out without confirmation. Scott confirms scope and pricing, Rob reissues.", "src": "Daily Snapshot Aug 13", "pid": "26-011"}, {"pri": "md", "icon": "💵", "text": "Scott: tell Rob what was actually performed at 258 Pelican. Rob holds an EMSL invoice for 3 PLMs and 3 PLM 400-point counts, but LCA only ever invoiced a clearance there. He asked Aug 12, then followed up asking whether to raise a separate invoice for the samples — no reply either time. Unanswered, this is lab cost absorbed with no matching revenue.", "src": "Daily Snapshot Aug 13", "pid": "26-001"}, {"pri": "md", "icon": "📊", "text": "Scott: send Elliott Johnson the gyp/texture counts. Balfour Beatty will not discuss whether point counts are needed until LCA says how many buildings and units are not testing hot, asked Aug 12 following the Aug 11 Teams call. Fort Carson is the largest active draw project on the books and the point-count question directly changes sampling scope and fee.", "src": "Daily Snapshot Aug 13", "pid": "24-101"}, {"pri": "md", "icon": "🧪", "text": "Scott: answer Eurofins on sample 5637-70 at 5637 Cherbourg Circle. It appears on no chain of custody and Erik Young needs a yes or no before analysing it (asked Aug 12). Until then the sample sits idle and the 5637 portion of the batch cannot close out. It also touches the open Eurofins question about being billed for layered materials.", "src": "Daily Snapshot Aug 13", "pid": "24-101"}, {"pri": "md", "icon": "📦", "text": "Scott/Rob: complete and return WO 10438891 for the 107B radon testing at West Point — Deb DePalma asked at 12:54 AM Aug 13, the newest item in the window, and says she needs one form per testing day rather than one overall. Unreturned work orders are the recurring cause of stalled BBC payments across Charleston, New London and USMA this quarter.", "src": "Daily Snapshot Aug 13", "pid": "26-010"}, {"pri": "md", "icon": "📋", "text": "Scott/Rob: close the 304D Madison Avenue proposal gap. Rob asked Aug 10 whether a proposal exists, got no reply, and invoiced Aug 11 anyway. No proposal means no agreed price — the same pattern that produced the 246 Ohio Avenue dispute at New London last month. Locate or retro-issue it and check the invoice matches what was agreed.", "src": "Daily Snapshot Aug 13", "pid": "26-009"}, {"pri": "md", "icon": "📜", "text": "Justin: chase Sid Hussain for the Florida asbestos consultant licence documents, requested Aug 12. The application is structured under the DBPR Form ALU 11 ten-year endorsement path, which waives the Florida exam — that waiver is what makes this worth filing at all, and it cannot be filed until the supporting documents arrive.", "src": "Daily Snapshot Aug 13", "pid": null}, {"pri": "md", "icon": "🧭", "text": "Justin: Fort Eustis Lead Inspections holds zero Trace report records despite being one of the most active reporting sites — created May 21, only activity since is a July 16 template update. This is the sharpest Trace gap of the five standing programs and it sits underneath the 0-of-9 QC figure rather than beside it.", "src": "Daily Snapshot Aug 13", "pid": "26-009"}, {"pri": "md", "icon": "🗺", "text": "Scott/Justin: submit the Grand Forks AFB ESR. BBC Environmental approved the sampling proposal Jul 28 and asked LCA to coordinate with Gabriel Hayes; sixteen days on nothing has moved, and there is no Trace project and no tracker xlsx under 26-032. Grand Forks is $1,250/unit against Minot's $875 and is the successor to a wound-down program — the cheapest revenue in the pipeline to lose.", "src": "Daily Snapshot Aug 13", "pid": null}, {"pri": "md", "icon": "📁", "text": "Create unit folders under 26-005 Buildings:Units for the eight Charleston addresses now in play with no folder — 404 Parnassus Road, 37 Hamilton Street, 6 Polk, 221 Fletcher Street, 410 Knutson Street, 215 Fletcher Street and 647 Chanticleer Street. Note 400/405 Parnassus, 217/233/288 Fletcher, 404/406/423/425/445 Knutson, 2 Hamilton and 624/643/646 Chanticleer already exist and are different properties.", "src": "Folder audit Aug 13", "pid": "26-005"}, {"pri": "md", "icon": "📁", "text": "Create unit folders for Fort Eustis 338A 26th Street and 2942B Summerall Circle — both have POs issued and Friday Aug 14 proposed, but neither has a folder. 307A/307G/327E/339H/345E 26th Street and 2946A/2946B Summerall already exist and are different units.", "src": "Folder audit Aug 13", "pid": "26-009"}, {"pri": "md", "icon": "📁", "text": "Create unit folders under 26-004 Lakehurst for 212 Lansdowne Road, 1903 Pinehurst Estates and 2203 Pinehurst Estates. A full proposal-to-PO-to-report cycle ran at 212 Lansdowne on Aug 11 and the two Pinehurst proposals went out the same day, yet none of the three has a folder — 202/208 Lansdowne and 1602/1904 Pinehurst exist and are different units.", "src": "Folder audit Aug 13", "pid": "26-004"}, {"pri": "md", "icon": "📁", "text": "Create unit folders under 24-101 for 5636, 5637, 5642 and 5655 Cherbourg Circle — all four had eCOCs executed Aug 12 and none has a folder, while 24 other Cherbourg Circle units do. 5709 Falaise Gap Road, which also came back Aug 12, does have one.", "src": "Folder audit Aug 13", "pid": "24-101"}, {"pri": "md", "icon": "🗃", "text": "26-011 USMA Renovations has no unit folders at all — Buildings:Units holds only \"Chimney Renovation (24-032)\" and \"Exteriors\", while the tracker carries 12 addresses and this week's work touched 78A&B Schofield Place, 82A&B Partridge Place and 82A/82B Lusk. Rob has already flagged 82A&B Partridge as having a proposal but no report.", "src": "Folder audit Aug 13", "pid": "26-011"}, {"pri": "md", "icon": "📋", "text": "26-006 Fort Jackson and 26-007 Fort Detrick trackers exist but are empty skeletons — 103 numbered rows with no site addresses in either. Both also have no Trace presence. They render as zero-unit projects on this dashboard, so either seed them from the Sites & SA sheets or mark them not-yet-started.", "src": "Folder audit Aug 13", "pid": "26-006"}, {"pri": "lo", "icon": "❓", "text": "Scott: confirm whether 215 Fletcher was actually inspected. Kirtland said Aug 7 it was the one property he had not reached the resident about and offered to swap in 404 Parnassus. Whether it was covered on the Monday visit is still unverified, and it needs rescheduling before any report is promised.", "src": "Daily Snapshot Aug 13", "pid": "26-005"}, {"pri": "lo", "icon": "📉", "text": "Lakehurst is the clearest case of work running entirely off both tools — a full proposal-to-PO-to-report cycle at 212 Lansdowne Road on Aug 11 plus two Pinehurst Estates proposals, with no Trace project at all. It has a tracker so it is on the spine, but nothing about this week's work is recorded anywhere except email.", "src": "Daily Snapshot Aug 13", "pid": "26-004"}, {"pri": "lo", "icon": "🗂", "text": "Revenue-be function segCounts(units) {
  const c = {Setup:0,Field:0,Reporting:0,Done:0};
  units.forEach(u => { if(c[u.seg]!==undefined) c[u.seg]++; });
  return c;
}
function pct(units) {
  const done = units.filter(u=>u.seg==='Done').length;
  return units.length ? Math.round(done/units.length*100) : 0;
}

let currentPid = PROJECTS[0].pid;



function buildSidebar() {
  const sb = document.getElementById('sidebar');
  const active = PROJECTS.filter(p=>!p.prior);
  const prior = PROJECTS.filter(p=>p.prior);
  const hiActions = ACTION_ITEMS.filter(a=>a.pri==='hi');

  let html = '<div class="section-label">Active Projects</div>';
  active.forEach((p,i) => {
    const pctDone = pct(p.units);
    html += `<div class="proj-row${p.pid===currentPid?' active':''}" onclick="selectProject('${p.pid}')" id="row-${p.pid}">
      <div class="proj-info">
        <span class="proj-name">${p.name}</span>
        <div class="proj-id">${p.pid}</div>
        <div class="pct-bar"><div class="pct-fill" style="width:${pctDone}%"></div></div>
      </div>
      <div class="proj-meta">
        <span class="email-badge${p.emailCount>0?'':' zero'}">${p.emailCount}✉</span>
      </div>
    </div>`;
  });

  if(prior.length) {
    html += '<div class="section-label">Prior Year</div>';
    prior.forEach(p => {
      const pctDone = pct(p.units);
      html += `<div class="proj-row prior${p.pid===currentPid?' active':''}" onclick="selectProject('${p.pid}')" id="row-${p.pid}">
        <div class="proj-info">
          <div style="display:flex;align-items:center;gap:6px"><span class="proj-name">${p.name}</span><span class="prior-tag">PY</span></div>
          <div class="proj-id">${p.pid}</div>
          <div class="pct-bar"><div class="pct-fill" style="width:${pctDone}%"></div></div>
        </div>
        <div class="proj-meta"><span class="email-badge${p.emailCount>0?'':' zero'}">${p.emailCount}✉</span></div>
      </div>`;
    });
  }

  if(hiActions.length) {
    html += '<div class="section-label" style="color:#ef4444">🔴 High Priority</div>';
    hiActions.forEach(a => {
      html += `<div style="padding:7px 16px;font-size:11px;border-left:3px solid var(--red);background:#1e293b;margin:1px 0;cursor:pointer;line-height:1.4" onclick="selectProject('${a.pid}')">${a.text.substring(0,65)}</div>`;
    });
  }

  sb.innerHTML = html;
}

function selectProject(pid) {
  currentPid = pid;
  buildSidebar();
  renderProject(pid);
}

function renderProject(pid) {
  const p = PROJECTS.find(x=>x.pid===pid);
  if(!p) return;
  const sc = segCounts(p.units);
  const pctDone = pct(p.units);
  const actions = ACTION_ITEMS.filter(a=>a.pid===pid);
  const emails = gmailThreads[pid]||[];

  let html = `
    <div class="proj-header">
      <h2>${p.name}${p.prior?' <span class="prior-tag">Prior Year</span>':''}</h2>
      <div class="sub">${p.pid} · ${p.units.length} units · ${pctDone}% complete · ${p.emailCount} email threads (14d)</div>
    </div>
    <div class="stats-row">
      <div class="stat-card"><div class="val" style="color:var(--blue)">${sc.Setup}</div><div class="lbl">Setup</div></div>
      <div class="stat-card"><div class="val" style="color:var(--amber)">${sc.Field}</div><div class="lbl">Field</div></div>
      <div class="stat-card"><div class="val" style="color:var(--purple)">${sc.Reporting}</div><div class="lbl">Reporting</div></div>
      <div class="stat-card"><div class="val" style="color:var(--green)">${sc.Done}</div><div class="lbl">Done</div></div>
      <div class="stat-card"><div class="val">${pctDone}%</div><div class="lbl">Complete</div></div>
    </div>
    <div class="pipeline">
      <div class="seg Setup"><span class="count">${sc.Setup}</span>Setup</div>
      <div class="seg Field"><span class="count">${sc.Field}</span>Field</div>
      <div class="seg Reporting"><span class="count">${sc.Reporting}</span>Reporting</div>
      <div class="seg Done"><span class="count">${sc.Done}</span>Done</div>
    </div>`;

  if(actions.length) {
    html += `<div class="action-board"><h3>⚡ Action Items</h3>`;
    actions.forEach(a => { html += `<div class="action-item ${a.pri}">${a.icon} ${a.text}</div>`; });
    html += `</div>`;
  }

  if(emails.length) {
    html += `<div class="email-section" style="margin-top:20px"><h3>📧 Recent Email Threads (${emails.length})</h3>`;
    emails.forEach(e => {
      html += `<div class="email-card">
        <div class="email-subject">${e.subject||'(no subject)'}</div>
        <div class="email-meta">From: ${e.sender} · ${e.date?new Date(e.date).toLocaleDateString():''}</div>
        <div class="email-snippet">${e.snippet||''}</div>
      </div>`;
    });
    html += `</div>`;
  }

  html += `<div style="margin-top:20px"><h3 style="font-size:13px;font-weight:700;margin-bottom:10px">Units (${p.units.length})</h3>
    <div class="unit-table-wrap"><table>
      <tr><th>Address</th><th>Status</th><th>Stage</th>${p.hasAcm?'<th>'+p.acmLabel+'</th>':''}${p.isWater?'<th>Notes</th>':''}</tr>`;
  p.units.forEach(u => {
    html += `<tr>
      <td>${u.a||'—'}</td><td>${u.s||'—'}</td>
      <td><span class="seg-chip ${u.seg}">${u.seg}</span></td>
      ${p.hasAcm?`<td>${u.m||'—'}</td>`:''}
      ${p.isWater?`<td>${u.m||'—'}</td>`:''}
    </tr>`;
  });
  html += `</table></div></div>`;

  document.getElementById('main').innerHTML = html;
}
